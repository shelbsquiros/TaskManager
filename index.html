/* ── UNIFIED TEE MODAL (Task / Event / Entry) ── */
// openTEEModal(itemId, forceType, defaultDate, defaultStatus)
// ── TEE ADD / EDIT MODAL ─────────────────────────────────────
// Unified form for Task, Event, and Entry creation/editing.
// Shows pinned notes side panel when pinned notes exist.
function openTEEModal(itemId, forceType, defaultDate, defaultStatus) {
  const existing = itemId ? STATE.items.find(i => i.id === itemId) : null;
  const currentType = forceType || existing?.type || 'entry';
  _renderTEEModal(existing, currentType, defaultDate || '', defaultStatus || '');
}

// switchTEEType: swaps only the type-specific fields in-place
// (no full re-render) with a 80ms opacity fade for smoothness.
// Called by the type-tab buttons — swaps only the type-specific fields in place, no full re-render
function switchTEEType(newType) {
  const itemId      = document.getElementById('tee-hidden-id')?.value || '';
  const defaultDate = document.getElementById('tee-hidden-date')?.value || '';
  const defStatus   = document.getElementById('tee-hidden-status')?.value || '';
  const existing    = itemId ? STATE.items.find(i => i.id === itemId) : null;

  // Capture whatever the user has already typed in shared fields
  // P4-R011a: dept/project added — Context standardization (discovery basis
  // P4-D021a) means Dept/Project now render for every type, so an in-
  // progress value typed on a new, unsaved item must survive a type switch
  // the same way category/tags/notes already do. Same fallback shape as
  // every other carried field: read the live DOM value if the field is
  // currently mounted, else fall back to the existing saved item's value.
  const carried = {
    title:    document.getElementById('tee-title')?.value    || existing?.title    || '',
    desc:     document.getElementById('tee-desc')?.value     || existing?.desc     || '',
    category: document.getElementById('tee-category')?.value || existing?.category || '',
    tags:     document.getElementById('tee-tags')?.value     || (Array.isArray(existing?.tags) ? existing.tags.join(', ') : '') || '',
    notes:    document.getElementById('tee-notes')?.value    || existing?.notes    || '',
    dept:     document.getElementById('tee-dept')?.value     || existing?.dept     || '',
    project:  document.getElementById('tee-project')?.value  || existing?.project  || '',
    subtasks: (() => {
      const list = document.getElementById('tee-subtask-list');
      if (!list) return existing?.subtasks || [];
      return Array.from(list.querySelectorAll('.subtask-row')).map((row, idx) => {
        const done   = row.querySelector('.subtask-check')?.classList.contains('checked') || false;
        const doneAt = row.querySelector(`#tee-st-donat-${idx}`)?.value || null;
        return {
          text:   (row.querySelector(`#tee-st-text-${idx}`)?.value || '').trim(),
          done,
          // Preserve existing doneAt; if newly checked and no timestamp, add one now
          doneAt: done ? (doneAt || (() => {
            const n = new Date();
            return fmtDate(n) + ' ' + String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
          })()) : null,
        };
      }).filter(s => s.text).map(s => s.doneAt ? s : { text: s.text, done: s.done });
    })(),
  };

  // P4-R008b: Type is now a compact pill dropdown trigger (.tee-identity-pill),
  // not a row of .tee-type-btn tabs — update the hidden #tee-current-type
  // value-holder (read by quickAddPersonFromModal instead of the old
  // .tee-type-btn.active selector) and sync the trigger's icon/label in place.
  const typeHolder = document.getElementById('tee-current-type');
  if (typeHolder) typeHolder.value = newType;
  _syncTEETypeTrigger(newType);

  // Update the save button's type argument
  const saveBtn = document.querySelector('.modal .btn-primary[onclick^="saveTEEModal"]');
  if (saveBtn) saveBtn.setAttribute('onclick', `saveTEEModal('${itemId}','${newType}')`);

  // Update the header title to reflect the new type (P4-R003a). P4-R008b-fix1:
  // header text is now uppercase ("NEW TASK"/"EDIT TASK") and no longer shows
  // the TEE internal id/counter — itemId is still tracked internally (hidden
  // field, Save button argument) and unaffected, only this visible label changed.
  const headerTitleEl = document.getElementById('tee-modal-header-title');
  if (headerTitleEl) {
    const typeLabels = { task:'Task', event:'Event', entry:'Entry' };
    headerTitleEl.textContent = !itemId
      ? `NEW ${(typeLabels[newType] || 'ITEM').toUpperCase()}`
      : `EDIT ${(typeLabels[newType] || 'ITEM').toUpperCase()}`;
  }

  // Swap only the type-specific field zones (Identity/Details-bottom/Assign/Context
  // — P4-R003a; identity zone renamed/relocated out of Details in P4-R008a/b)
  const identityEl      = document.getElementById('tee-type-fields-identity');
  const detailsBottomEl = document.getElementById('tee-type-fields-details-bottom');
  const assignEl        = document.getElementById('tee-type-fields-assign');
  const contextEl       = document.getElementById('tee-type-fields-context');
  if (!identityEl || !detailsBottomEl || !assignEl || !contextEl) return;

  const d = defaultDate || (existing?.date || existing?.dueDate || fmtDate(TODAY));
  const assignees = STATE.people.map(p => p.name).filter(Boolean);

  const newIdentity      = _buildTEEIdentityFields(newType, existing, defStatus);
  const newDetailsBottom = _buildTEEDetailsBottom(newType, existing, d);
  const newAssign        = _buildTEEAssignFields(newType, existing, assignees);
  const newContext       = _buildTEEContextFields(newType, existing);

  // Smooth swap with a brief fade — same 80ms opacity-fade pattern as before,
  // now applied across all four zones so the type-switch transition still plays
  [identityEl, detailsBottomEl, assignEl, contextEl].forEach(el => {
    el.style.opacity = '0';
    el.style.transition = 'opacity 0.12s';
  });
  setTimeout(() => {
    identityEl.innerHTML     = newIdentity;
    detailsBottomEl.innerHTML = newDetailsBottom;
    assignEl.innerHTML        = newAssign;
    contextEl.innerHTML       = newContext;
    [identityEl, detailsBottomEl, assignEl, contextEl].forEach(el => { el.style.opacity = '1'; });
    // P4-R009b-fix5: buildPeoplePicker (called synchronously above, inside
    // _buildTEEAssignFields) schedules its own setTimeout(0) initial regroup
    // at the moment it's called — well before this 80ms-delayed innerHTML
    // swap actually mounts the new #tee-contributors. That early regroup
    // finds nothing (or the old, about-to-be-replaced picker) and never
    // measures Browse All's real overflow for the newly switched type,
    // leaving it stuck at its default hidden state — this is why Browse All
    // disappeared after internal Task/Event/Entry switching even though it
    // appeared correctly on a fresh "Open New ___" (openModal() there
    // inserts synchronously, so the setTimeout(0) always finds the right
    // DOM already in place — only switchTEEType's deferred swap didn't).
    // Re-running the regroup here, now that the new picker is actually in
    // the DOM, fixes this without touching buildPeoplePicker's own timing at
    // all — _peoplePickerRegroup's existing disconnect/reconnect wrapper and
    // requestAnimationFrame-based overflow measurement apply exactly as they
    // already do everywhere else it's called from.
    _peoplePickerRegroup('tee-contributors');
    // P4-R011a: restore any in-progress Dept/Project value into the newly
    // mounted Context zone. Unlike title/desc/category/tags/notes (shared
    // fields that live outside the swapped zones and are never destroyed —
    // see the synchronous restore block below), #tee-dept/#tee-project are
    // rendered by _buildTEEContextFields *inside* contextEl, so they are
    // torn down and rebuilt by the innerHTML swap above. newContext was
    // already generated from `existing` (not from the live carried value),
    // so on a brand-new item it renders blank — restoring here, after the
    // new markup is actually in the DOM, is what makes an in-progress typed
    // value survive the switch, the same way it already does for the
    // shared fields.
    if (carried.dept)    { const el = document.getElementById('tee-dept');    if (el) el.value = carried.dept; }
    if (carried.project) { const el = document.getElementById('tee-project'); if (el) el.value = carried.project; }
  }, 80);

  // Restore carried values into shared fields
  if (carried.title)    { const el = document.getElementById('tee-title');    if (el) el.value = carried.title; }
  if (carried.desc)     { const el = document.getElementById('tee-desc');     if (el) el.value = carried.desc; }
  if (carried.category) { const el = document.getElementById('tee-category'); if (el) el.value = carried.category; }
  if (carried.tags)     { const el = document.getElementById('tee-tags');     if (el) el.value = carried.tags; }
  if (carried.notes)    { const el = document.getElementById('tee-notes');    if (el) el.value = carried.notes; }
}

// ── TEE TAGS CHIP-ENTRY (P4-R010) ──────────────────────────────────────────
// Discovery basis: P4-D020. Dedicated namespace only — deliberately not
// sharing .sticky-tag-chip/.sticky-tag-option (Sticky notes, window._sticky-
// ModalTags array-as-truth model) or .people-picker/.chip-option/.people-chip
// (Assignees/Participants). #tee-tags is the single save-time value-holder
// saveTEEModal already reads unchanged — it is DOM-authoritative (like every
// other TEE field), never a separate in-memory array. Suggestions are in-flow
// (no floating caret-position popup), sourced from the existing, unchanged
// getAllKnownTags(); chip colors from the existing, unchanged tagColor().
// Owner decisions (this checkpoint): strip one leading # before storage; do
// not force lowercase; no strict character sanitization; trim outer spaces;
// case-insensitive duplicate prevention within the open editor; no migration
// of previously-saved tag data.

// Normalize a typed/clicked tag label for storage: trim outer spaces, strip
// exactly one leading '#', trim again (handles "# work" -> "work"). Case is
// preserved — no lowercasing, no character stripping beyond the leading '#'.
function _teeTagsNormalize(raw) {
  let t = (raw || '').toString().trim();
  if (t.charAt(0) === '#') t = t.slice(1);
  return t.trim();
}

// Read the current selection from the value-holder (DOM-authoritative read,
// matching every other TEE field's save-time contract).
function _teeTagsGetSelected() {
  const el = document.getElementById('tee-tags');
  if (!el) return [];
  return el.value.split(',').map(s => s.trim()).filter(Boolean);
}

// Write the selection back to the value-holder as the existing comma-
// delimited format, then re-render the visible chip/suggestion UI.
function _teeTagsSetSelected(tags) {
  const el = document.getElementById('tee-tags');
  if (!el) return;
  el.value = tags.join(', ');
  _teeTagsRender();
}

// Add a tag: normalize, reject if blank, skip (but still refresh/clear) if a
// case-insensitive duplicate of an already-selected tag, otherwise append
// (typed/clicked case preserved) and persist via _teeTagsSetSelected.
function _teeTagsAdd(rawValue) {
  const tag = _teeTagsNormalize(rawValue);
  if (tag) {
    const current = _teeTagsGetSelected();
    const isDuplicate = current.some(t => t.toLowerCase() === tag.toLowerCase());
    if (!isDuplicate) {
      current.push(tag);
      _teeTagsSetSelected(current);
    }
  }
  const input = document.getElementById('tee-tags-input');
  if (input) { input.value = ''; input.focus(); }
  _teeTagsRender();
}

// Remove exactly the tag named on the chip the × button belongs to
// (case-insensitive match against the stored value).
function _teeTagsRemove(btnEl) {
  const chip = btnEl.closest('.tee-tag-chip');
  if (!chip) return;
  const tag = chip.dataset.tag;
  const current = _teeTagsGetSelected();
  const next = current.filter(t => t.toLowerCase() !== tag.toLowerCase());
  _teeTagsSetSelected(next);
  const input = document.getElementById('tee-tags-input');
  if (input) input.focus();
}

function _teeTagsInputKeydown(e) {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  _teeTagsAdd(e.target.value);
}

// Re-render chips (from the value-holder) and in-flow suggestions (from the
// existing, unchanged getAllKnownTags(), filtered by the current typed query
// and excluding already-selected tags, capped to avoid a wall of pills).
// P4-R010-fix1: suggestions are no longer an always-visible row — they only
// render/show while the Tags input is focused AND has a non-empty typed
// query, as a small popover anchored under the input (.tee-tag-suggestions,
// position:absolute in CSS) — not Sticky's caret-position mirror popup, just
// a plain dropdown anchored to the input element's own box. Chips (the
// selected-tags row) remain always visible regardless of focus/typing state.
function _teeTagsRender() {
  const chipsEl = document.getElementById('tee-tags-chips');
  const suggEl  = document.getElementById('tee-tags-suggestions');
  const input   = document.getElementById('tee-tags-input');
  if (!chipsEl || !suggEl) return;

  const selected      = _teeTagsGetSelected();
  const selectedLower = selected.map(t => t.toLowerCase());

  chipsEl.innerHTML = selected.length ? selected.map(t => {
    const tc = tagColor(t);
    return `<span class="tee-tag-chip" data-tag="${t}" style="background:${tc.bg};color:${tc.text};border-color:${tc.border}">#${t}<button type="button" class="tee-tag-chip-remove" title="Remove ${t}" aria-label="Remove ${t}" onclick="event.stopPropagation();_teeTagsRemove(this)">&times;</button></span>`;
  }).join('') : '<span class="tee-tag-empty">No tags yet</span>';

  const rawInputValue = input?.value || '';
  const hasQuery  = rawInputValue.trim().length > 0;
  const isFocused = document.activeElement === input;

  if (!hasQuery || !isFocused) {
    suggEl.innerHTML = '';
    suggEl.classList.remove('tee-tag-suggestions-open');
    return;
  }

  const query = rawInputValue.trim().toLowerCase().replace(/^#/, '');
  const known = getAllKnownTags();
  const matches = known.filter(t => !selectedLower.includes(t) && t.includes(query)).slice(0, 8);
  const suggestionItems = matches.map(t =>
    `<span class="tee-tag-suggestion" data-tag="${t}" onclick="_teeTagsAdd(this.dataset.tag)">#${t}</span>`
  ).join('');

  const rawTyped      = _teeTagsNormalize(rawInputValue);
  const rawTypedLower = rawTyped.toLowerCase();
  const alreadyKnown    = rawTypedLower && known.includes(rawTypedLower);
  const alreadySelected = rawTypedLower && selectedLower.includes(rawTypedLower);
  const createOption = (rawTyped && !alreadyKnown && !alreadySelected)
    ? `<span class="tee-tag-suggestion tee-tag-suggestion-create" data-tag="${rawTyped}" onclick="_teeTagsAdd(this.dataset.tag)">+ Create #${rawTyped}</span>`
    : '';

  const html = suggestionItems + createOption;
  suggEl.innerHTML = html;
  suggEl.classList.toggle('tee-tag-suggestions-open', !!html);
}

// P4-R010-fix2: the Tags widget is now built as two separately-placed
// pieces (Context Row 2 pairs the input with Category; the chips render on
// their own full-width Row 3 below) — split so each can be positioned
// independently in _renderTEEModal while staying synced through the shared
// #tee-tags value-holder and #tee-tags-chips/#tee-tags-suggestions ids,
// which _teeTagsRender() already looks up by id regardless of where in the
// DOM tree they physically sit.

// Builds the "Tags" side-label compact-field: the hidden value-holder,
// the visible search input, and its suggestions popover. #tee-tags stays
// the value-holder saveTEEModal already reads unchanged. Deferred via
// setTimeout(0), matching buildPeoplePicker's own established technique, so
// the initial render runs after openModal() has actually inserted this
// markup (and the chips-row piece below) into the DOM. The suggestions
// popover (.tee-tag-suggestions) sits inside a position:relative wrapper
// (.tee-tag-input-wrap) so it can anchor directly under the input via plain
// CSS, with no caret-tracking JS. Blur hides it on a short delay (standard
// dismissible-dropdown technique — not Sticky-specific) so a click on a
// suggestion registers before it disappears; _teeTagsAdd() re-focuses the
// input afterward, so a genuine add correctly leaves the popover closed
// (input is now empty) rather than reopening it.
function _buildTeeTagsInputField(initialValue) {
  const initial = (initialValue || '').toString();
  setTimeout(() => _teeTagsRender(), 0);
  return `
    <div class="tee-compact-field tee-context-tags-field">
      <span class="tee-side-label">Tags</span>
      <div class="tee-tag-input-wrap">
        <input type="hidden" id="tee-tags" value="${initial.replace(/"/g,'&quot;')}">
        <input type="text" class="form-input tee-tag-input" id="tee-tags-input" placeholder="Type a tag, press Enter…" autocomplete="off"
          oninput="_teeTagsRender()" onkeydown="_teeTagsInputKeydown(event)"
          onfocus="_teeTagsRender()" onblur="setTimeout(_teeTagsRender, 200)">
        <div class="tee-tag-suggestions" id="tee-tags-suggestions"></div>
      </div>
    </div>`;
}

// Builds the full-width selected-tags chips row (Context Row 3). Populated
// entirely by _teeTagsRender() via #tee-tags-chips; starts empty here.
function _buildTeeTagsChipsRow() {
  return `<div class="tee-tag-chips" id="tee-tags-chips"></div>`;
}

// ── TEE Links Editor (P4-R012a) ─────────────────────────────────────────
// Discovery basis: P4-D022. Dedicated .tee-link-* namespace and dedicated
// helper functions only — deliberately not reusing .subtask-*/
// _addSubtaskToForm (different field, different data shape) or
// .dir-card-action-link (Directory/Folders' existing Open-link pattern,
// an unrelated feature this checkpoint does not touch). Mirrors the
// Subtasks *pattern* only (shared across all types, dynamic add/remove
// rows read directly from the DOM at save time, no hidden value-holder) —
// not its markup or functions. Rendered once, outside the four type-
// swapped zones (Identity/Details-bottom/Assign/Context), in the same spot
// the pre-existing .tee-links-spacer placeholder occupied (Context, after
// Notes, before Execution/Subtasks) — this is what lets switchTEEType skip
// any carry/restore logic for Links entirely, the same way it already
// does for Subtasks (see switchTEEType's own comment for the verification
// that this remains true).
//
// Open/Copy actions, dangerous-scheme handling, and TEE Detail display are
// explicitly out of scope for this checkpoint (P4-D022 stages those as
// P4-R012b) — no clickable links are rendered here, only plain editable
// Name/URL text inputs.
function _buildTEELinksEditor(links) {
  const rows = (links || []).map((l, idx) => `
    <div class="tee-link-row" id="tee-link-row-${idx}">
      <input class="form-input tee-link-name" id="tee-link-name-${idx}" value="${(l.name||'').replace(/"/g,'&quot;')}" placeholder="Name">
      <input class="form-input tee-link-url" id="tee-link-url-${idx}" value="${(l.url||'').replace(/"/g,'&quot;')}" placeholder="URL / Link / Path">
      <button type="button" class="tee-link-remove" onclick="document.getElementById('tee-link-row-${idx}').remove();_teeLinksCheckMax();" title="Remove">&times;</button>
    </div>`).join('');
  // Deferred to run after openModal() has actually inserted this markup —
  // same setTimeout(0) convention already used by _buildTeeTagsInputField/
  // buildPeoplePicker — so the max-10 check measures the real, mounted row
  // count (relevant when reopening an item that already has 10 links).
  setTimeout(() => _teeLinksCheckMax(), 0);
  return `
    <div class="form-group tee-links-editor">
      <label class="form-label">Links / URLs</label>
      <div id="tee-link-list">${rows}</div>
      <div style="display:flex;align-items:center;gap:8px">
        <button type="button" id="tee-link-add-btn" class="tee-link-add-btn" onclick="_addTeeLinkRow()">+ Add Link</button>
        <span class="tee-link-limit-note" id="tee-link-limit-note" style="display:none">Max 10 links</span>
      </div>
    </div>`;
}

// Appends one new, empty, directly-editable link row. Unlike Subtasks'
// separate staging-input-then-Enter/Add flow, Links has no staging input —
// "+ Add Link" appends the row itself, immediately editable, per the
// owner-specified interaction shape ("click + Add Link and a row appears").
function _addTeeLinkRow() {
  const list = document.getElementById('tee-link-list');
  if (!list) return;
  if (list.children.length >= 10) return; // max 10 — button is also disabled/hidden at this point
  const idx = list.children.length;
  const row = document.createElement('div');
  row.className = 'tee-link-row';
  row.id = `tee-link-row-${idx}`;
  const nameInp = document.createElement('input');
  nameInp.className = 'form-input tee-link-name';
  nameInp.id = `tee-link-name-${idx}`;
  nameInp.placeholder = 'Name';
  const urlInp = document.createElement('input');
  urlInp.className = 'form-input tee-link-url';
  urlInp.id = `tee-link-url-${idx}`;
  urlInp.placeholder = 'URL / Link / Path';
  const del = document.createElement('button');
  del.type = 'button';
  del.className = 'tee-link-remove';
  del.title = 'Remove';
  del.innerHTML = '&times;';
  del.onclick = () => { row.remove(); _teeLinksCheckMax(); };
  row.appendChild(nameInp);
  row.appendChild(urlInp);
  row.appendChild(del);
  list.appendChild(row);
  _teeLinksCheckMax();
  nameInp.focus();
}

// Enforces the max-10 link cap as a UI-level guard only (per P4-D022 §6/§7
// — a soft cap, not a save-time hard block): disables/hides "+ Add Link"
// once 10 rows exist, and shows a calm inline note while at the cap.
function _teeLinksCheckMax() {
  const list = document.getElementById('tee-link-list');
  const btn  = document.getElementById('tee-link-add-btn');
  const note = document.getElementById('tee-link-limit-note');
  if (!list || !btn) return;
  const atMax = list.children.length >= 10;
  btn.disabled = atMax;
  btn.style.display = atMax ? 'none' : '';
  if (note) note.style.display = atMax ? '' : 'none';
}

// Reads the current Links editor rows directly from the DOM into a plain
// { name, url } array — shared by saveTEEModal (final save read) and
// quickAddPersonFromModal (in-progress capture before the quick-add
// mini-form replaces the modal's DOM), so both use identical row-reading
// logic instead of duplicating it. Reads by class (.tee-link-name/
// .tee-link-url), not by reconstructing an id from iteration index — see
// saveTEEModal's own comment for why. Returns null (not []) when the
// editor isn't currently mounted, so callers can distinguish "no editor
// present" from "editor present but genuinely empty" and choose the
// correct fallback themselves. A row is kept only if it has a URL/Path;
// blank Name is allowed (Name is optional). Outer whitespace is trimmed.
function _getTeeLinksFromDOM() {
  const list = document.getElementById('tee-link-list');
  if (!list) return null;
  return Array.from(list.querySelectorAll('.tee-link-row')).map(row => {
    const name = (row.querySelector('.tee-link-name')?.value || '').trim();
    const url  = (row.querySelector('.tee-link-url')?.value  || '').trim();
    return { name, url };
  }).filter(l => l.url);
}

// _renderTEEModal: internal renderer — builds and opens the form
function _renderTEEModal(item, type, defaultDate, defaultStatus, carried) {
  const id      = item?.id || '';
  const isNew   = !item;
  const d       = defaultDate || (item?.date || item?.dueDate || fmtDate(TODAY));
  const assignees = STATE.people.map(p => p.name).filter(Boolean);

  // Pre-fill values: carried (from type switch) > item > defaults
  const val = (field, fallback='') => carried?.[field] ?? item?.[field] ?? fallback;

  // Type-aware header title — e.g. "NEW TASK" / "EDIT EVENT" (P4-R003a).
  // P4-R008b-fix1: uppercase, no visible TEE internal id/counter — `id` is
  // still tracked internally (hidden field, Save button argument) below,
  // just no longer interpolated into this visible header string.
  const typeLabels  = { task:'Task', event:'Event', entry:'Entry' };
  const headerTitle = isNew
    ? `NEW ${(typeLabels[type] || 'ITEM').toUpperCase()}`
    : `EDIT ${(typeLabels[type] || 'ITEM').toUpperCase()}`;

  // P4-R008b: Type trigger — compact pill dropdown (.tee-identity-pill), replacing
  // the former .tee-type-tabs large pill-tab row (P4-R003b). This button is a
  // static element — it is never destroyed/rebuilt by switchTEEType (unlike the
  // relocated Status/Priority pair below, whose onclick needs a fresh type-aware
  // argument baked in). Only its icon/label are updated in place, via
  // _syncTEETypeTrigger, on every type switch — see switchTEEType.
  const typeIcons = { task:'ti-clipboard-list', event:'ti-calendar-event', entry:'ti-notes' };
  const typeTrigger = `
    <div class="tee-identity-group">
      <span class="tee-side-label">Type</span>
      <button type="button" id="tee-type-trigger" class="tee-identity-pill" onclick="openTEETypeDropdown(this, event)">
        <span class="tee-identity-pill-main">
          <i class="ti ${typeIcons[type] || 'ti-clipboard-list'}" id="tee-type-trigger-icon" style="font-size:13px"></i>
          <span id="tee-type-trigger-label" class="tee-identity-pill-label">${typeLabels[type] || 'Task'}</span>
        </span>
        <span class="tee-identity-pill-chevron">&#9660;</span>
      </button>
    </div>`;

  // Hidden state fields (carry id, defaultDate, defaultStatus across type switches).
  // P4-R008b: #tee-current-type is the new value-bearing "what type is this form
  // currently showing" holder — replaces reading .tee-type-btn.active textContent
  // (that markup no longer exists), and is kept in sync by switchTEEType on every
  // type change. quickAddPersonFromModal() reads this instead of the old selector.
  const hiddenFields = `
    <input type="hidden" id="tee-hidden-id"     value="${id}">
    <input type="hidden" id="tee-hidden-date"   value="${defaultDate||''}">
    <input type="hidden" id="tee-hidden-status" value="${defaultStatus||''}">
    <input type="hidden" id="tee-current-type"  value="${type}">`;

  // ── Type-specific field zones — built by shared helpers (P4-R004; identity
  // fields relocated out of Details and renamed in P4-R008a/P4-R008b, see below) ──
  const identityFields      = _buildTEEIdentityFields(type, item, defaultStatus);
  const detailsBottomFields = _buildTEEDetailsBottom(type, item, d);
  const assignFields        = _buildTEEAssignFields(type, item, assignees);
  const contextFields       = _buildTEEContextFields(type, item);

  // ── Shared fields (all types) — distributed into Details/Context/Execution sections ──
  // P4-R008b-fix1: Title's label is now a .tee-section-header (same class as
  // Details/Assign/Context/Execution) instead of a small .form-label, so it
  // reads as a top-level section header rather than a field label — visual
  // polish only, id="tee-title" and validation (saveTEEModal's title-required
  // check) unchanged. Placeholder is now generic "Title…" for all three types
  // (was type-specific "Task title…"/"Event name…"/"Entry title…").
  const titleField = `
    <div class="tee-section-header">Title</div>
    <div class="form-group">
      <input class="form-input" id="tee-title" value="${val('title')}" placeholder="Title…"></div>`;
  const descriptionField = `
    <div class="form-group"><label class="form-label">Description</label>
      <textarea class="form-textarea" id="tee-desc" placeholder="Optional details…">${val('desc')}</textarea></div>`;
  // P4-R010-fix2: Context section is back to the original compact side-label
  // field style. Row 1 (from #tee-type-fields-context, Task only): Dept |
  // Project. Row 2: Category | Tags-input, in that DOM order — the visual
  // desktop order is reversed to Tags-input | Category via
  // .tee-context-tags-field/.tee-context-category-field's `order` CSS (see
  // the CSS block), which is what lets Category naturally stack before the
  // Tags block on mobile with zero extra mobile-specific markup. Row 3: the
  // full-width tag chips row (categoryTagsChipsRow, below). Category's own
  // field, id, value, and placeholder are unchanged from fix1/r010.
  const categoryField = `
    <div class="tee-compact-field tee-context-category-field">
      <span class="tee-side-label">Category</span>
      <input class="form-input" id="tee-category" value="${val('category')}" placeholder="e.g. Meeting, Design…">
    </div>`;
  // P4-R010: Tags chip-entry. #tee-tags remains the single save-time value-holder
  // saveTEEModal already reads unchanged (now a hidden input; the chip UI is the
  // visible representation, same "hidden value-holder + visual control" pattern
  // already used for Status/Priority/Type/Lead). Initial value computed directly
  // here (not via the shared val() helper) to avoid val()'s pre-existing quirk of
  // returning the raw tags ARRAY (not a joined string) when carried is absent —
  // discovery basis: P4-D020 §A/§E/§M.
  const _teeTagsFallbackStr = Array.isArray(item?.tags) ? item.tags.join(', ') : (item?.tags || '');
  const _teeTagsInitialValue = carried?.tags ?? _teeTagsFallbackStr;
  const tagsInputField = _buildTeeTagsInputField(_teeTagsInitialValue);
  const tagsChipsRow   = _buildTeeTagsChipsRow();
  const notesField = `
    <div class="form-group"><label class="form-label">Notes</label>
      <textarea class="form-textarea" id="tee-notes" placeholder="Additional notes…">${val('notes')}</textarea></div>`;
  // P4-R012a: TEE Links (discovery basis P4-D022) — shared across all
  // types, same val()-with-empty-array-guard shape already used by
  // Subtasks below (carried?.[field] ?? item?.[field] would otherwise
  // treat a carried empty array as "present," masking a saved item's real
  // links — the explicit .length check avoids that).
  const linksField = _buildTEELinksEditor(val('links',[]).length ? val('links',[]) : (item?.links||[]));
  const subtasksField = `
    <div class="form-group">
      <label class="form-label">Subtasks</label>
      <div id="tee-subtask-list" class="subtask-list" style="margin-bottom:4px">
        ${(val('subtasks',[]).length ? val('subtasks',[]) : (item?.subtasks||[])).map((s,idx)=>`
          <div class="subtask-row" id="tee-st-row-${idx}">
            <div class="subtask-check${s.done?' checked':''}" onclick="this.classList.toggle('checked')"></div>
            <input class="subtask-edit-input" id="tee-st-text-${idx}" value="${s.text.replace(/"/g,'&quot;')}" placeholder="Subtask…">
            ${s.doneAt ? '<span class="subtask-ts subtask-ts-edit">' + _fmtSubtaskTs(s.doneAt) + '</span>' : ''}
            <input type="hidden" id="tee-st-donat-${idx}" value="${s.doneAt||''}">
            <button class="subtask-del" onclick="document.getElementById('tee-st-row-${idx}').remove()" title="Remove">✕</button>
          </div>`).join('')}
      </div>
      <div class="subtask-add-row" style="display:flex;align-items:center;gap:6px">
        <input class="subtask-add-input" id="tee-subtask-new" placeholder="New subtask…"
          onkeydown="if(event.key==='Enter'){event.preventDefault();_addSubtaskToForm();}">
        <button type="button" style="flex-shrink:0;padding:4px 10px;border-radius:8px;border:1px solid var(--border2);background:var(--glass2);color:var(--text2);font-size:11px;font-family:var(--font);cursor:pointer;"
          onclick="_addSubtaskToForm()">Add</button>
      </div>
    </div>`;

  // ── Pinned notes side panel ──
  const pinnedForPanel = [...STATE.stickies]
    .filter(s => s.pinned)
    .sort((a,b) => {
      const na = parseInt((a.id||'').replace(/\D/g,''), 10) || 0;
      const nb = parseInt((b.id||'').replace(/\D/g,''), 10) || 0;
      return nb - na;
    });
  const hasPinned    = pinnedForPanel.length > 0;
  const isMobile     = window.innerWidth < 600;
  const panelId      = 'tee-pinned-panel';
  const panelBtnId   = 'tee-panel-toggle';
  const panelSlotId  = 'tee-pinned-panel-slot';
  const handleId     = 'tee-panel-handle';
  const handleArrowId = 'tee-panel-handle-arrow';

  // P4-R003c-v7: "more" is now conditional, reusing the EXISTING app-wide rule
  // found in buildPinnedNotesPanel() (Today/Overview widget, ~L5598): a note
  // only gets a "more" affordance when `s.text.length > 120`. That existing
  // rule is character-length-based (not a post-render scrollHeight/clientHeight
  // measurement), so there's no DOM-measurement step to reuse here — the
  // condition is evaluated directly while building this string, exactly like
  // the existing call site does. The TEE panel keeps its OWN existing toggle
  // mechanism (classList.toggle('expanded'), matching .tee-panel-note-text's
  // CSS) rather than calling the shared togglePinExpand() helper, because that
  // helper reads/writes el.style.webkitLineClamp directly (inline style) and
  // is not compatible with .tee-panel-note-text's class-based clamp toggle
  // without also rewriting this panel's CSS to match — out of scope for a
  // local "more" visibility fix, and not requested.
  const panelNotesHTML = pinnedForPanel.map((s, idx) => {
    const c = getStickyColor(s.colorIdx);
    const needsMore = s.text.length > 120;
    return `<div style="border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:11px;line-height:1.55;font-weight:500;background:${c.bg};color:${c.text}">
      <div class="tee-panel-note-text" id="tpn-${idx}">${s.text}</div>
      ${needsMore ? `<button class="today-pinned-expand" id="tpn-btn-${idx}" style="color:${c.text}"
        onclick="(function(){
          const t=document.getElementById('tpn-${idx}');
          const b=document.getElementById('tpn-btn-${idx}');
          const exp=t.classList.toggle('expanded');
          b.textContent=exp?'▲ less':'▼ more';
        })()">▼ more</button>` : ''}
    </div>`;
  }).join('');

  // P4-R003c-v7: Pinned Notes inside TEE Add/Edit is reference-only — pinned-note
  // creation stays in the Reminders/Sticky Notes flow (openPinnedNoteModal() is
  // unchanged there). The "+ Add" buttons (desktop header and the old bottom
  // button, both desktop and mobile) are removed; nothing else in this panel
  // creates notes anymore.
  const panelHTML = isMobile
    ? `<div id="${panelId}" class="tee-panel-mobile collapsed">
        <div class="tee-panel-mobile-header">
          <span style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--text2)"><i class="ti ti-pin" style="font-size:13px"></i>Pinned Notes${hasPinned ? ` (${pinnedForPanel.length})` : ''}</span>
          <button id="${panelBtnId}" class="tee-panel-collapse-btn" onclick="(function(){
            const p=document.getElementById('${panelId}');
            const b=document.getElementById('${panelBtnId}');
            const open=p.classList.toggle('collapsed');
            b.textContent=open?'▾':'▴';
          })()">▾</button>
        </div>
        <div class="tee-panel-mobile-body">
          ${hasPinned ? panelNotesHTML : '<div style="font-size:11px;color:var(--muted);text-align:center;padding:10px 0">No pinned notes yet. Pin a note from the Reminders tab.</div>'}
        </div>
      </div>`
    : `<div id="${panelSlotId}" class="tee-panel-side-slot hidden">
        <div id="${panelId}" class="tee-panel-side">
          <div class="tee-panel-side-header">
            <span style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--text2)"><i class="ti ti-pin" style="font-size:14px"></i>Pinned Notes</span>
          </div>
          <div class="tee-panel-side-body">
            ${hasPinned ? panelNotesHTML : `<div style="text-align:center;padding:20px 8px;color:var(--muted);font-size:11px;line-height:1.6">No pinned notes yet.<br>Pin a note from the<br>Reminders tab.</div>`}
          </div>
        </div>
      </div>`;

  // P4-R003c-v7: desktop-only vertical edge handle — pin icon, vertical "Pinned
  // Notes (N)" label (count merged into the text, no separate floating badge),
  // and a directional solid-triangle arrow (▶ closed / ◀ open — plain >/< are
  // no longer used), all inside one pill (CSS: .tee-panel-handle-slot /
  // .tee-panel-handle). Toggle logic targets ${panelSlotId} and never touches
  // .tee-modal-with-panel's class list (no .panel-hidden — see CSS comment
  // above). Mobile is unchanged apart from starting collapsed — its own
  // self-contained .tee-panel-mobile-header collapse button (panelBtnId)
  // still works exactly as before.
  const desktopPanelHandle = isMobile ? '' : `<div class="tee-panel-handle-slot">
      <button id="${handleId}" class="tee-panel-handle" title="Pinned Notes — click to open/close"
        onclick="(function(){
          const s=document.getElementById('${panelSlotId}');const b=document.getElementById('${handleId}');const a=document.getElementById('${handleArrowId}');const hidden=s.classList.toggle('hidden');b.classList.toggle('active',!hidden);if(a)a.textContent=hidden?'▶':'◀';
        })()">
        <i class="ti ti-pin" style="font-size:14px"></i><span class="tee-panel-handle-label">Pinned Notes${hasPinned ? ` (${pinnedForPanel.length})` : ''}</span><span class="tee-panel-handle-arrow" id="${handleArrowId}">▶</span>
      </button>
    </div>`;

  // P4-R003c-v5: header (title + close) is now a sibling of the two-column body,
  // both wrapped in .tee-modal-shell — NOT nested inside .tee-modal-form. This
  // means opening/closing the pinned panel (which only affects the body row)
  // can never visually shift or feel "owned by" the form column. The body
  // wrapper class differs by viewport: desktop uses .tee-modal-with-panel (the
  // flex row owning the handle/panel slots), mobile uses .tee-modal-body-mobile
  // (a single scrollable region holding the form + inline accordion together,
  // since mobile pinned notes intentionally scroll as part of the body).
  openModal(`
    <div class="tee-modal-shell">
      <div class="tee-modal-header modal-title">
        <span id="tee-modal-header-title">${headerTitle}</span>
        <div style="display:flex;align-items:center;gap:6px;margin-left:auto">
          ${_modalCloseBtn()}
        </div>
      </div>
      <div class="${!isMobile ? 'tee-modal-with-panel' : 'tee-modal-body-mobile'}">
        <div class="tee-modal-form">
          <div class="tee-modal-form-scroll">
            ${hiddenFields}
            ${titleField}
            <div class="tee-identity-row">
              ${typeTrigger}
              <div id="tee-type-fields-identity" class="tee-identity-subrow">${identityFields}</div>
            </div>

            <div class="tee-section-header">Details</div>
            <div class="tee-field-group">
              ${descriptionField}
              <div id="tee-type-fields-details-bottom">${detailsBottomFields}</div>
            </div>

            <div class="tee-section-header">Assign</div>
            <div class="tee-field-group">
              <div id="tee-type-fields-assign">${assignFields}</div>
            </div>

            <div class="tee-section-header">Context</div>
            <div class="tee-field-group">
              <div id="tee-type-fields-context">${contextFields}</div>
              <div class="tee-compact-pair">
                ${categoryField}
                ${tagsInputField}
              </div>
              ${tagsChipsRow}
              ${notesField}
              ${linksField}
            </div>

            <div class="tee-section-header">Execution</div>
            <div class="tee-field-group">
              ${subtasksField}
            </div>
          </div>

          <div class="tee-modal-footer">
            <div>${!isNew ? `<button class="btn-danger" onclick="deleteTEEItem('${id}')">Delete</button>` : ''}</div>
            <div style="display:flex;gap:8px">
              <button class="btn-ghost" onclick="popNav()">Cancel</button>
              <button class="btn-primary" onclick="saveTEEModal('${id}','${type}')">Save</button>
            </div>
          </div>
        </div>
        ${desktopPanelHandle}
        ${panelHTML}
      </div>
    </div>`);
}

// saveTEEModal: reads form fields, builds item object, saves to
// STATE.items and triggers a debounced sheet sync.
function saveTEEModal(existingId, type) {
  const title = document.getElementById('tee-title')?.value.trim();
  if (!title) { toast('Title is required','error'); return; }
  const g = id => document.getElementById(id)?.value || '';
  const existing = existingId ? STATE.items.find(i => i.id === existingId) : null;

  // Start with a clean slate — all fields empty, then populate only what's relevant
  const base = {
    id:          existingId || nextTEEId(),
    type,
    title,
    desc:        g('tee-desc'),
    category:    g('tee-category'),
    tags:        g('tee-tags').split(',').map(s=>s.trim()).filter(Boolean),
    notes:       g('tee-notes'),
    // Type-exclusive fields default to empty/zero
    date:        '', dueDate: '', startDate: '', time: '', endTime: '',
    status:      '', priority: 'Medium', project: '', dept: '',
    progress: 0, color: '', recurrence: 'none', assignees: '',
    subtasks: (() => {
      const list = document.getElementById('tee-subtask-list');
      if (!list) return existingId ? (STATE.items.find(i=>i.id===existingId)?.subtasks||[]) : [];
      return Array.from(list.querySelectorAll('.subtask-row')).map((row, idx) => {
        const done   = row.querySelector('.subtask-check')?.classList.contains('checked') || false;
        const doneAt = row.querySelector(`#tee-st-donat-${idx}`)?.value || null;
        return {
          text:   (row.querySelector(`#tee-st-text-${idx}`)?.value || '').trim(),
          done,
          // Preserve existing doneAt; if newly checked and no timestamp, add one now
          doneAt: done ? (doneAt || (() => {
            const n = new Date();
            return fmtDate(n) + ' ' + String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
          })()) : null,
        };
      }).filter(s => s.text).map(s => s.doneAt ? s : { text: s.text, done: s.done });
    })(),
    // P4-R012a: TEE Links (discovery basis P4-D022) — shared across all
    // types, read directly from the DOM at save time via the shared
    // _getTeeLinksFromDOM() helper (no hidden value-holder), same overall
    // shape as Subtasks just above. A filled Name with a blank URL is
    // dropped rather than blocking Save (see _getTeeLinksFromDOM). The
    // max-10 cap is a soft UI-level guard (see _teeLinksCheckMax) — this
    // .slice(0,10) is only a defensive backstop in case more than 10 rows
    // somehow exist in the DOM, and never touches or discards any
    // already-saved sheet data.
    links: (() => {
      const rows = _getTeeLinksFromDOM();
      if (rows === null) return existingId ? (STATE.items.find(i=>i.id===existingId)?.links||[]) : [];
      return rows.slice(0, 10);
    })(),
  };

  if (type === 'task') {
    const _stRaw = g('tee-status') || 'Backlog';
    if (_stRaw === 'Completed') {
      if (!existing || parseStatus(existing.status).state !== 'Completed') {
        const _sn=new Date(); const _sts=_sn.getFullYear()+'-'+String(_sn.getMonth()+1).padStart(2,'0')+'-'+String(_sn.getDate()).padStart(2,'0')+' '+String(_sn.getHours()).padStart(2,'0')+':'+String(_sn.getMinutes()).padStart(2,'0');
        base.status = 'Completed|'+_sts;
      } else { base.status = existing.status; }
    } else { base.status = _stRaw; }
    base.priority  = g('tee-priority')  || 'Medium';
    // Build assignees string from lead + contributors chip selections
    const lead = g('tee-lead') || '';
    const allSelectedPeople = getChipSelections('tee-contributors');
    // P4-R009c: block Save only when people are selected but no Lead has
    // been chosen (owner decision 3) — a Task with zero selected people may
    // still save with no Lead (owner decision 2), and no one is ever
    // auto-promoted to Lead on Save (owner decision 1). This check must run
    // before any STATE.items mutation below, which it does — the earliest
    // STATE.items write in this function happens after the entire type
    // branch, so returning here leaves STATE untouched, same as the
    // existing title-required check at the top of this function.
    if (allSelectedPeople.length > 0 && !lead) {
      toast('Choose a Lead for this task, or remove all selected people.', 'error');
      return;
    }
    // allSelectedPeople already includes the Lead's own name whenever a
    // Lead is set (Selected is the single source of truth for everyone
    // involved, owner decision 4/13 — see _buildTEEAssignFields) — this
    // filter is what keeps buildAssigneesStr's slot-0 Lead from also being
    // duplicated in the rest of the list (owner decision / item E), exactly
    // the same safety net this line already provided before P4-R009c.
    const contributors = allSelectedPeople.filter(v => v !== lead);
    base.assignees = buildAssigneesStr(lead, contributors);
    base.dept      = g('tee-dept')      || '';
    base.startDate = g('tee-startDate') || '';
    base.dueDate   = g('tee-dueDate')   || '';
    base.project   = g('tee-project')   || '';
  } else if (type === 'event') {
    base.date      = g('tee-date')      || '';
    base.time      = g('tee-time')      || '';
    base.endTime   = g('tee-endTime')   || '';
    // P4-R011b: Event Color removed from Add/Edit (discovery basis
    // P4-D021a) — #tee-color no longer exists in the DOM, so there is
    // nothing to read here. base.color keeps the empty-string default
    // already set at the top of this function (the `base` object literal);
    // no replacement default color is introduced. saveTEE/saveArchiveItem/
    // _teeRowToItem's Color column handling is intentionally left
    // untouched — existing saved Color values are preserved, not migrated
    // or deleted; full column retirement is out of scope for this
    // checkpoint.
    base.priority  = g('tee-priority')  || 'Medium';
    // P4-R011a: Context standardization — Event now renders tee-dept/
    // tee-project (see _buildTEEContextFields), so read them here the same
    // way Task already does. No Apps Script/schema change — the Department/
    // Project columns already exist and saveTEE/saveArchiveItem already
    // write them for other types.
    base.dept      = g('tee-dept')      || '';
    base.project   = g('tee-project')   || '';
    base.assignees = getChipSelections('tee-contributors').join('|');
    const _evRaw = g('tee-status') || 'Open';
    if (_evRaw === 'Done') {
      if (!existing || parseStatus(existing.status).state !== 'Done') {
        const _evn=new Date(), _evts=_evn.getFullYear()+'-'+String(_evn.getMonth()+1).padStart(2,'0')+'-'+String(_evn.getDate()).padStart(2,'0')+' '+String(_evn.getHours()).padStart(2,'0')+':'+String(_evn.getMinutes()).padStart(2,'0');
        base.status = 'Done|'+_evts;
      } else { base.status = existing.status; }
    } else { base.status = _evRaw; }
  } else { // entry
    base.date      = g('tee-date')      || '';
    base.time      = g('tee-time')      || '';
    base.priority  = g('tee-priority')  || 'Medium';
    base.project   = g('tee-project')   || '';
    // P4-R011a: Context standardization — Entry now also renders tee-dept
    // alongside its existing tee-project (see _buildTEEContextFields);
    // read it the same way Task already does.
    base.dept      = g('tee-dept')      || '';
    base.assignees = getChipSelections('tee-contributors').join('|');
    const _enRaw = g('tee-status') || 'Open';
    if (_enRaw === 'Done') {
      if (!existing || parseStatus(existing.status).state !== 'Done') {
        const _enn=new Date(); const _ents=_enn.getFullYear()+'-'+String(_enn.getMonth()+1).padStart(2,'0')+'-'+String(_enn.getDate()).padStart(2,'0')+' '+String(_enn.getHours()).padStart(2,'0')+':'+String(_enn.getMinutes()).padStart(2,'0');
        base.status = 'Done|'+_ents;
      } else { base.status = existing.status; }
    } else { base.status = _enRaw; }
  }

  if (existingId) {
    STATE.items = STATE.items.map(i => i.id === existingId ? base : i);
  } else {
    STATE.items.push(base);
  }
  clearNav();
  renderAll();
  saveTEE(base)
    .then(() => { toast(existingId ? 'Updated' : 'Created'); triggerSync(); })
    .catch(() => toast('Saved locally — sheet will sync next time', 'info'));
}

// ── P4-R024: TEE Delete confirmation Cancel restoration ────────────────
// OD-31, discovery basis P4-D037. Captures the exact live, unsaved TEE
// Add/Edit DOM state before the Delete confirmation opens, so its Cancel
// button can restore this exact form instead of unwinding the whole modal
// chain. Conceptually the same two-tier pattern quickAddPersonFromModal/
// _saveQuickPerson/_restoreTEEModal already prove (Tier 1: values threaded
// through _renderTEEModal's existing `carried` param via val(); Tier 2:
// fields _renderTEEModal has no carried path for, reapplied to the DOM
// after render) — captured/restored independently here, not by reusing or
// modifying the quick-add-person flow's own carried-state objects. Unlike
// that flow, Subtasks ARE captured (val('subtasks',[]) already supports it
// — the omission in quick-add-person is caller-side, not a _renderTEEModal
// limitation; see P4-D037 §3). Local return value only — nothing here is
// written to STATE or persisted.
function _captureTEEModalState() {
  const subtasks = (() => {
    const list = document.getElementById('tee-subtask-list');
    if (!list) return [];
    return Array.from(list.querySelectorAll('.subtask-row')).map((row, idx) => {
      const done   = row.querySelector('.subtask-check')?.classList.contains('checked') || false;
      const doneAt = row.querySelector(`#tee-st-donat-${idx}`)?.value || null;
      return {
        text: (row.querySelector(`#tee-st-text-${idx}`)?.value || '').trim(),
        done,
        doneAt: done ? doneAt : null,
      };
    }).filter(s => s.text);
  })();

  return {
    // Tier 1 — shared fields _renderTEEModal already threads through its
    // `carried` param (read via val()): title/desc/category/tags/notes/
    // links/subtasks. Mirrors quickAddPersonFromModal's own `carried` shape,
    // plus subtasks.
    carried: {
      title:    document.getElementById('tee-title')?.value    || '',
      desc:     document.getElementById('tee-desc')?.value     || '',
      category: document.getElementById('tee-category')?.value || '',
      tags:     document.getElementById('tee-tags')?.value      || '',
      notes:    document.getElementById('tee-notes')?.value     || '',
      links:    _getTeeLinksFromDOM() || [],
      subtasks: subtasks,
    },
    // Tier 2 — fields _buildTEEIdentityFields/_buildTEEDetailsBottom/
    // _buildTEEAssignFields/_buildTEEContextFields build from `item` only,
    // with no `carried` path — reapplied to the DOM after render (see
    // _restoreTEEModalState). `type` is threaded as _renderTEEModal's own
    // `type` argument (not part of Tier 2's post-render patch), which is
    // what correctly mounts the right type-specific field zone, including
    // an in-progress, unsaved type switch.
    type:      document.getElementById('tee-current-type')?.value || 'task',
    status:    document.getElementById('tee-status')?.value       || '',
    priority:  document.getElementById('tee-priority')?.value     || '',
    dept:      document.getElementById('tee-dept')?.value         || '',
    project:   document.getElementById('tee-project')?.value      || '',
    startDate: document.getElementById('tee-startDate')?.value    || '',
    dueDate:   document.getElementById('tee-dueDate')?.value      || '',
    date:      document.getElementById('tee-date')?.value         || '',
    time:      document.getElementById('tee-time')?.value         || '',
    endTime:   document.getElementById('tee-endTime')?.value      || '',
    lead:      document.getElementById('tee-lead')?.value         || '',
    people:    getChipSelections('tee-contributors'),
  };
}

// Restores a _captureTEEModalState() snapshot into a freshly (re)rendered
// TEE Add/Edit form. Does not touch _navStack — this is a direct render
// call, not a nav-stack operation; the reopen closure already on the stack
// (pushed by TEE Detail's Edit button, if any) is left completely alone.
function _restoreTEEModalState(itemId, defaultDate, defaultStatus, captured) {
  const existingItem = itemId ? STATE.items.find(i => i.id === itemId) : null;
  _renderTEEModal(existingItem, captured.type || 'task', defaultDate, defaultStatus, captured.carried);
  // Same timing discipline as _saveQuickPerson/_restoreTEEModal: Tier-2
  // fields are reapplied after the synchronous render/DOM-insertion
  // completes, since chip-select elements etc. must already exist.
  setTimeout(() => {
    if (captured.status)   { const el = document.getElementById('tee-status');   if (el) { el.value = captured.status;   _syncTEEStatusTrigger(el.value); } }
    if (captured.priority) { const el = document.getElementById('tee-priority'); if (el) { el.value = captured.priority; _syncTEEPriorityTrigger(el.value); } }
    const deptEl    = document.getElementById('tee-dept');      if (deptEl)    deptEl.value    = captured.dept    || '';
    const projectEl = document.getElementById('tee-project');   if (projectEl) projectEl.value = captured.project || '';
    const startEl   = document.getElementById('tee-startDate'); if (startEl)   startEl.value   = captured.startDate || '';
    const dueEl     = document.getElementById('tee-dueDate');   if (dueEl)     dueEl.value     = captured.dueDate   || '';
    const dateEl    = document.getElementById('tee-date');      if (dateEl)    dateEl.value    = captured.date    || '';
    const timeEl    = document.getElementById('tee-time');      if (timeEl)    timeEl.value    = captured.time    || '';
    const endTimeEl = document.getElementById('tee-endTime');   if (endTimeEl) endTimeEl.value = captured.endTime || '';
    const leadEl = document.getElementById('tee-lead');
    if (leadEl) leadEl.value = captured.lead || '';
    const people = new Set(captured.people || []);
    document.querySelectorAll('#tee-contributors .chip-option').forEach(chip => {
      chip.classList.toggle('selected', people.has(chip.dataset.val));
    });
  }, 50);
}

function deleteTEEItem(id) {

  // Links row typed before opening quick-add-person must survive the same
  // way those already do. Read via the shared _getTeeLinksFromDOM() helper
  // (same one saveTEEModal uses) — the quick-add mini-form's own
  // openModal() call below replaces the entire TEE Add/Edit DOM, so
  // anything not captured here would otherwise be silently lost, the same
  // way Subtasks currently is (a pre-existing, separate gap — see

  const carried = {

    lead:      document.getElementById('tee-lead')?.value || '',

// Save new person, restore prior people selections, and add the new person
// into the current item's Contributors (Task) / Participants (Event/Entry) —
// P4-R009a: never into Lead (owner decision, P4-D018 §K / OD-02).
function _saveQuickPerson(itemId, type, defaultDate, defaultStatus) {
  const name  = document.getElementById('qap-name')?.value.trim();
  if (!name) { toast('Name is required','error'); return; }
  const role  = document.getElementById('qap-role')?.value.trim() || '';
  const color = document.getElementById('qap-color-val')?.value || '#285C70';

  const newPerson = { id:uid('P'), name, role, color, photo:'' };
  STATE.people.push(newPerson);
  savePerson(newPerson).catch(()=>{});
  renderAll();
  toast(`${name} added to the team ✓`, 'success');

  const existingItem = itemId ? STATE.items.find(i => i.id === itemId) : null;
  const carried = window._qapCarried || {};
  const ct = window._qapCarriedTask || {};
  _renderTEEModal(existingItem || null, type, defaultDate, defaultStatus, { ...carried });

  setTimeout(() => {
    // P4-R006-fix1: ct (carriedTask) is a plain carried-value bag with no `.type`
    // property — passing it to getDisplayStatus(ct) was a bug: getDisplayStatus
    // checks `item.type === 'task'`, which is always false for `ct`, so it fell
    // through to the Event/Entry branch and returned 'Open' regardless of the
    // Task's actual carried status. `ct.status` is already the correct bare
    // identifier (read straight from #tee-status before quick-add opened) — just
    // normalize it for the current type and use it directly; no getDisplayStatus.
    if (ct.status)    { const el = document.getElementById('tee-status');    if (el) { el.value = _normalizeTEEStatusForType(type, ct.status); _syncTEEStatusTrigger(el.value); } }
    if (ct.priority)  { const el = document.getElementById('tee-priority');  if (el) { el.value = ct.priority; _syncTEEPriorityTrigger(el.value); } }
    if (ct.dept)      { const el = document.getElementById('tee-dept');      if (el) el.value = ct.dept; }
    if (ct.startDate) { const el = document.getElementById('tee-startDate'); if (el) el.value = ct.startDate; }
    if (ct.dueDate)   { const el = document.getElementById('tee-dueDate');   if (el) el.value = ct.dueDate; }
    if (ct.project)   { const el = document.getElementById('tee-project');   if (el) el.value = ct.project; }
    // P4-R009a: restore the pre-quick-add Lead (Task only) exactly as it was —
    // never the new person — then restore the prior Contributors/Participants
    // selection and add the newly created person into it. A Set naturally
    // avoids a duplicate entry if the new person were somehow already present.
    const leadEl = document.getElementById('tee-lead');
    if (leadEl) leadEl.value = ct.lead || '';
    const people = new Set(ct.people || []);
    people.add(name);
    document.querySelectorAll('#tee-contributors .chip-option').forEach(chip => {
      chip.classList.toggle('selected', people.has(chip.dataset.val));
    });
  }, 50);

  window._qapCarried = null;
  window._qapCarriedTask = null;
}

// Restore TEE modal after cancelling quick-add
function _restoreTEEModal(itemId, type, defaultDate, defaultStatus) {
  const existingItem = itemId ? STATE.items.find(i => i.id === itemId) : null;
  const carried = window._qapCarried || {};
  _renderTEEModal(existingItem, type || 'task', defaultDate, defaultStatus, carried);
  setTimeout(() => {
    const ct = window._qapCarriedTask || {};
    // P4-R006-fix1: see _saveQuickPerson's comment above — ct has no `.type`, so
    // getDisplayStatus(ct) always misread it as Event/Entry and returned 'Open'.
    // Use ct.status (already a bare identifier) directly, normalized for the type.
    if (ct.status)    { const el = document.getElementById('tee-status');    if (el) { el.value = _normalizeTEEStatusForType(type || 'task', ct.status); _syncTEEStatusTrigger(el.value); } }
    if (ct.priority)  { const el = document.getElementById('tee-priority');  if (el) { el.value = ct.priority; _syncTEEPriorityTrigger(el.value); } }
    if (ct.dept)      { const el = document.getElementById('tee-dept');      if (el) el.value = ct.dept; }
    if (ct.startDate) { const el = document.getElementById('tee-startDate'); if (el) el.value = ct.startDate; }
    if (ct.dueDate)   { const el = document.getElementById('tee-dueDate');   if (el) el.value = ct.dueDate; }
    if (ct.project)   { const el = document.getElementById('tee-project');   if (el) el.value = ct.project; }
    // P4-R009a: restore the exact pre-quick-add Lead/Contributors/Participants
    // selection — no person is added on Cancel. This replaces a previously dead
    // `if (ct.assignees)` block: quickAddPersonFromModal() never actually set
    // `ct.assignees`, so that branch could never fire (see P4-D018 §G). `ct.lead`
    // and `ct.people` are the real captured values now.
    const leadEl = document.getElementById('tee-lead');
    if (leadEl) leadEl.value = ct.lead || '';
    const people = new Set(ct.people || []);
    document.querySelectorAll('#tee-contributors .chip-option').forEach(chip => {
      chip.classList.toggle('selected', people.has(chip.dataset.val));
    });
    window._qapCarried = null;
    window._qapCarriedTask = null;
  }, 50);
}
// ── PEOPLE / TEAM MEMBER MODALS ──────────────────────────────
// Editing a person's name automatically renames them on all tasks
// they are assigned to (see savePersonModal).
function openPersonModal(personId, carried=null) {
  const p = personId ? STATE.people.find(x=>x.id===personId) : null;
  // P4-R025: optional `carried` override for unsaved-state restoration
  // (Person Remove confirmation Cancel — see removePerson below). Every
  // pre-existing call site passes only `personId`, so `carried` stays
  // `null` and `val()` resolves to the exact prior `p?.field||fallback`
  // behavior, byte-for-byte. When `carried` IS supplied, presence of the
  // field on `carried` (not truthiness) decides the value — this is what
  // lets an intentionally blank unsaved value (e.g. a cleared Role) survive
  // restoration instead of being masked by `||` falling through to the
  // saved value. Precedence: carried value (if the field is present on
  // `carried`) > saved Person value > fallback default. The value is fully
  // HTML-attribute-escaped (&, ", <, > — & first, so newly-created entities
  // from the other three replacements are never themselves re-escaped) so
  // it can be safely inserted inside a double-quoted value="..." attribute
  // — quote-only escaping was insufficient (P4-R025 Patch 1): unescaped `&`
  // could start a stray/invalid entity and unescaped `<`/`>` could be
  // misparsed as markup once the browser parses the attribute value. This
  // applies identically to both the carried and saved paths, so it also
  // fixes the same pre-existing attribute-injection risk for ordinary saved
  // data, not just carried data; the browser decodes the entities back to
  // the original literal characters on read, so `.value` is unaffected —
  // no displayed or saved value changes.
  const val = (field, fallback='') => {
    const raw = (carried && field in carried) ? carried[field] : (p?.[field] ?? fallback);
    return String(raw)
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  };
  openModal(`
    <div class="modal-title">${p?'Edit':'Add'} Team Member ${_modalCloseBtn()}</div>
    <div class="form-group"><label class="form-label">Full Name *</label><input class="form-input" id="pm-name" value="${val('name')}" placeholder="Full name"></div>
    <div class="form-group"><label class="form-label">Role / Title</label><input class="form-input" id="pm-role" value="${val('role')}" placeholder="e.g. UI/UX Designer"></div>
    <div class="form-group"><label class="form-label">Color</label><input class="form-input" type="color" id="pm-color" value="${val('color','#285C70')}"></div>
    <div class="form-group">
      <label class="form-label" style="display:flex;align-items:center;justify-content:space-between">
        Profile Photo URL
        <span style="font-size:10px;color:var(--muted);font-weight:400">direct image link</span>
      </label>
      <input class="form-input" id="pm-photo" value="${val('photo')}" placeholder="https://… or paste a Google Drive share link"
        oninput="(function(el){
          let v=el.value.trim();
          const m=v.match(/drive\\.google\\.com\\/file\\/d\\/([^/?]+)/);
          if(m){
            el.value='https://drive.google.com/thumbnail?id='+m[1]+'&sz=w200';
            el.style.color='var(--green)';
          } else { el.style.color=''; }
        })(this)">
      <div style="font-size:10px;color:var(--muted);margin-top:5px;line-height:1.6">
        💡 <strong>Google Drive:</strong> Right-click file → Share → "Anyone with the link" → Copy link → paste here. It auto-converts.<br>
        Or use any direct image URL (Imgur, GitHub raw, etc.).
      </div>
      ${p?.photo ? `<div style="margin-top:8px;display:flex;align-items:center;gap:10px"><img src="${p.photo}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--border2)" onerror="this.style.display='none'"><span style="font-size:11px;color:var(--muted)">Current photo</span></div>` : ''}
    </div>
    ${p?`<div style="margin-bottom:12px"><button class="btn-ghost" style="color:var(--red);border-color:rgba(248,113,113,0.3)" onclick="removePerson('${p.id}')">Remove</button></div>`:''}
    <div class="modal-actions">
      <button class="btn-ghost" onclick="clearNav()">Cancel</button>
      <button class="btn-primary" onclick="savePersonModal('${personId||''}')">Save</button>
    </div>`);
}

function savePersonModal(existingId) {
  const name  = document.getElementById('pm-name').value.trim();
  if (!name) { toast('Name required','error'); return; }
  const data  = {
    id:    existingId || uid('P'),
    name,
    role:  document.getElementById('pm-role').value.trim(),
    color: document.getElementById('pm-color').value,
    photo: document.getElementById('pm-photo').value.trim(),
  };

  if (existingId) {
    const oldPerson = STATE.people.find(x => x.id === existingId);
    const oldName   = oldPerson?.name || '';
    STATE.people = STATE.people.map(x => x.id === existingId ? data : x);

    // Propagate name change to all items — tasks, events, AND entries
    if (oldName && oldName !== name) {
      let updatedCount = 0;
      STATE.items.forEach(item => {
        const parts = (item.assignees || '').split('|').map(s => s.trim());
        if (parts.includes(oldName)) {
          item.assignees = parts.map(n => n === oldName ? name : n).join('|');
          saveTEE(item).catch(() => {});
          updatedCount++;
        }
      });
      if (updatedCount > 0) toast(`Updated name on ${updatedCount} item${updatedCount > 1 ? 's' : ''}`, 'info');
    }
  } else {
    STATE.people.push(data);
  }

  clearNav(); renderAll();
  savePerson(data).then(() => toast(existingId ? 'Updated' : 'Added')).catch(() => toast('Saved locally', 'info'));
}

function removePerson(id) {
  const person = STATE.people.find(x => x.id === id);
  const name   = person?.name || 'this team member';
  // P4-R025 (OD-31, discovery basis P4-D037): capture the live, unsaved
  // Person Add/Edit form state before opening the confirmation, so Cancel
  // can restore this exact form. Person Add/Edit is always top-level and
  // never on `_navStack` (per P4-D037 §4) — this is a direct re-render via
  // `openPersonModal(id, captured)`, not a nav-stack operation; `_navStack`
  // is untouched by any of this. Values are read raw (not `.trim()`ed) so
  // in-progress whitespace is preserved exactly as typed, matching
  // savePersonModal's own separate trim-at-save-time behavior.
  const captured = {
    name:  document.getElementById('pm-name')?.value  ?? '',
    role:  document.getElementById('pm-role')?.value  ?? '',
    color: document.getElementById('pm-color')?.value ?? '',
    photo: document.getElementById('pm-photo')?.value ?? '',
  };
  confirmAction(
    `"<strong>${name}</strong>" will be removed from the team. Their tasks will remain but become unassigned.`,
    'Remove',
    () => {
      STATE.people = STATE.people.filter(x => x.id !== id);
      // P4-R018d (People Remove local-refresh fix, discovery basis P4-D030):
      // was `renderOverview()`, which never rebuilds the People tab itself —
      // the removed person stayed visible locally until the next full sync/
      // reload. Changed to `renderAll()`, matching savePersonModal's own
      // existing refresh pattern immediately above (`clearNav(); renderAll();`)
      // — renderAll() already calls renderOverview() first, so Today/Overview
      // still updates exactly as before, plus renderPeople() now runs too,
      // so the removed person disappears from the People tab immediately.
      // Each of renderAll()'s renders is independently try/caught, so this
      // cannot introduce a new failure mode beyond what savePersonModal
      // already relies on. Delete persistence (deletePerson below) and
      // confirmAction/clearNav behavior are both unchanged.
      clearNav(); renderAll();
      deletePerson(id).then(() => toast('Removed')).catch(() => toast('Removed locally','info'));
    },
    true,
    () => openPersonModal(id, captured)
  );
}

      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px">
        <input type="checkbox" id="st-float" ${isFloat?'checked':''}> Float
      </label>

      <button class="btn-ghost" onclick="clearNav()">Cancel</button>
      <button class="btn-primary" onclick="saveStickyModal('${stickyId||''}')">${s?'Save Changes':'Add Note'}</button>
    </div>`);
  window._stickyModalTags = [...existingTags];
}

window._stickyTagInput = function(textarea) {
  const val     = textarea.value;
  const cursor  = textarea.selectionStart;
  const before  = val.slice(0, cursor);
  const hashIdx = before.lastIndexOf('#');
  const dropdown = document.getElementById('st-tag-dropdown');
  if (!dropdown) return;

  // Hide if no # found or space between # and cursor (not a tag)
  if (hashIdx === -1 || before.slice(hashIdx).includes(' ')) {
    dropdown.style.display = 'none'; return;
  }

  const query   = before.slice(hashIdx + 1).toLowerCase();
  const allTags = getAllKnownTags();
  const current = window._stickyModalTags || [];
  const matches = allTags.filter(t => t.includes(query) && !current.includes(t)).slice(0, 8);

  if (matches.length === 0 && query.length === 0) {
    dropdown.style.display = 'none'; return;
  }

  const createOpt = query.length > 0 && !allTags.includes(query)
    ? `<div class="sticky-tag-option" style="font-style:italic;opacity:0.7" onclick="window._stickyPickTag('${query}')">+ Create #${query}</div>` : '';
  dropdown.innerHTML = matches.map(t =>
    `<div class="sticky-tag-option" onclick="window._stickyPickTag('${t}')">#${t}</div>`
  ).join('') + createOpt;

  // ── Caret position detection using mirror div ─────────────────
  // Create a hidden mirror div matching the textarea's style
  let mirror = document.getElementById('_st_mirror');
  if (!mirror) {
    mirror = document.createElement('div');
    mirror.id = '_st_mirror';
    document.body.appendChild(mirror);
  }
  const cs     = window.getComputedStyle(textarea);
  const taRect = textarea.getBoundingClientRect();
  const lineH  = parseInt(cs.lineHeight) || 18;

  // Position mirror exactly over the textarea so caret span coords match
  mirror.style.cssText = [
    'position:fixed','visibility:hidden','overflow:hidden','white-space:pre-wrap',
    'word-wrap:break-word',
    'top:'  + taRect.top  + 'px',
    'left:' + taRect.left + 'px',
    'width:'  + taRect.width  + 'px',
    'height:' + taRect.height + 'px',
    'font-family:'  + cs.fontFamily,
    'font-size:'    + cs.fontSize,
    'font-weight:'  + cs.fontWeight,
    'line-height:'  + cs.lineHeight,
    'padding:'      + cs.padding,
    'border:'       + cs.border,
    'box-sizing:'   + cs.boxSizing,
  ].join(';');

  // Text up to # + marker span; account for textarea scroll offset
  const textUpToHash = val.slice(0, hashIdx);
  mirror.innerHTML   = _escapeHtml(textUpToHash) + '<span id="_st_caret"></span>';
  // Shift mirror content up by scroll amount so caret position is correct
  mirror.scrollTop = textarea.scrollTop;

  const caretSpan = document.getElementById('_st_caret');
  const spRect    = caretSpan.getBoundingClientRect();

  // Dropdown appears just below the # character
  let top  = spRect.bottom + 2;
  let left = spRect.left;

  // Clamp to viewport — flip above if near bottom
  const dropH = Math.min(200, matches.length * 36 + 36);
  if (top + dropH > window.innerHeight - 20) top = top - dropH - parseInt(cs.lineHeight||'18');
  if (left + 300 > window.innerWidth - 10)   left = window.innerWidth - 310;
  left = Math.max(10, left);
  top  = Math.max(10, top);

  dropdown.style.top  = top  + 'px';
  dropdown.style.left = left + 'px';
  dropdown.style.display = 'block';
};

function _captureSearchFocus(inputId) {
  return document.activeElement?.id === inputId;
}

function _restoreSearchFocus(inputId, wasFocused) {
  if (!wasFocused) return;
  const el = document.getElementById(inputId);
  if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

function _escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/ /g,'&nbsp;').replace(/\n/g,'<br>');
}

window._stickyPickTag = function(tag) {
  tag = tag.toLowerCase().replace(/[^a-z0-9_]/g, '');
  if (!tag) return;
  if ((window._stickyModalTags||[]).includes(tag)) {
    const d = document.getElementById('st-tag-dropdown');
    if (d) d.style.display = 'none'; return;
  }
  const ta = document.getElementById('st-text');
  if (ta) {
    const before  = ta.value.slice(0, ta.selectionStart);
    const after   = ta.value.slice(ta.selectionStart);
    const hashIdx = before.lastIndexOf('#');
    ta.value = before.slice(0, hashIdx) + after;
    ta.focus();
  }
  window._stickyModalTags.push(tag);
  _stickyRenderChips();
  const d = document.getElementById('st-tag-dropdown');
  if (d) d.style.display = 'none';
};

window._stickyRemoveTag = function(tag) {
  window._stickyModalTags = (window._stickyModalTags||[]).filter(t => t !== tag);
  _stickyRenderChips();
};

function _stickyRenderChips() {
  const container = document.getElementById('st-tags-chips');
  if (!container) return;
  const tags = window._stickyModalTags || [];
  container.innerHTML = tags.map(t => {
    const tc = tagColor(t);
    return `<span class="sticky-tag-chip" data-tag="${t}" style="background:${tc.bg};color:${tc.text};border:1px solid ${tc.border}">#${t}<button onclick="event.stopPropagation();_stickyRemoveTag('${t}')" style="background:none;border:none;cursor:pointer;margin-left:3px;opacity:0.7;font-size:10px;color:inherit">x</button></span>`;
  }).join('');
}

function saveStickyModal(existingId) {
  const rawText  = document.getElementById('st-text')?.value || '';
  const isPinned = document.getElementById('st-pinned')?.checked || false;
  const isFloat  = document.getElementById('st-float')?.checked  || false;
  const sDate    = document.getElementById('st-due-date')?.value || '';
  const sTime    = document.getElementById('st-due-time')?.value || '';

  if (!rawText.trim()) { toast('Note text required','error'); return; }

  // Extract trailing hashtags as safety net, merge with modal chips — deduplicate
  const { cleaned, tags: trailingTags } = extractStickyTags(rawText);
  const modalTags  = window._stickyModalTags || [];
  const mergedTags = [...new Set([...modalTags, ...trailingTags])];
  const finalText  = cleaned || rawText.trim();

  if (existingId) {
    const s = STATE.stickies.find(x=>x.id===existingId);
    if (s) {
      s.text     = finalText;
      s.colorIdx = Number(document.getElementById('st-color').value);
      s.pinned   = isPinned;
      s.float    = isFloat;
      s.tags     = mergedTags;
      s.date  = sDate;
      s.time  = sTime;
      saveSticky(s).catch(()=>{});
    }
  } else {
    const cx = Math.min(60 + STATE.stickies.length * 220, window.innerWidth - 220);
    const cy = 100 + Math.random() * 80;
    const s  = {
      id:       uid('ST'),
      text:     finalText,
      colorIdx: Number(document.getElementById('st-color').value),
      x: cx, y: cy,
      float:    isFloat,
      pinned:   isPinned,
      tags:     mergedTags,
      date:   sDate,
      time:   sTime,
      done:     false,
      doneAt:   '',
    };
    STATE.stickies.push(s);
    saveSticky(s).then(()=>toast('Note added')).catch(()=>toast('Saved locally','info'));
  }
  window._stickyModalTags = [];
  clearNav(); renderStickyLayer(); renderReminders(); renderOverview();
}

function addStickyNote() { saveStickyModal(''); }

function removeStickyItem(id) {
  STATE.stickies = STATE.stickies.filter(s=>s.id!==id);

function openStickyArchiveDrawer() {
  openModal(`
    <div class="modal-title">
      <i class="ti ti-archive" style="font-size:16px;margin-right:6px"></i>Notes Archive
      ${_modalCloseBtn()}
    </div>
    <div style="margin-bottom:12px">
      <input id="sticky-archive-search" class="form-input" placeholder="Search archived notes…"
        oninput="_renderStickyArchiveList()" style="width:100%;box-sizing:border-box">
    </div>
    <div id="sticky-archive-list" style="min-height:120px;max-height:420px;overflow-y:auto">
      <div style="text-align:center;padding:40px;color:var(--muted)">
        <i class="ti ti-loader" style="font-size:24px"></i>
        <div style="margin-top:8px;font-size:13px">Loading archive…</div>
      </div>
    </div>`);
  // Load archive from sheet
  if (!STATE.sheetConnected) {
    document.getElementById('sticky-archive-list').innerHTML =
      '<div style="text-align:center;padding:40px;color:var(--muted);font-size:13px">Not connected to sheet</div>';
    return;
  }
  sheetGetAll(CONFIG.SHEETS.stickyArchive).then(rows => {

    })).filter(r=>r.id).sort((a,b)=>b.archivedAt.localeCompare(a.archivedAt));
    _renderStickyArchiveList();
  }).catch(e => {
    document.getElementById('sticky-archive-list').innerHTML =
      `<div style="text-align:center;padding:40px;color:var(--red);font-size:13px">Failed to load: ${e.message}</div>`;
