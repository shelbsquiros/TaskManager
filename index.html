      <button class="sticky-del" onclick="unfloatSticky('${s.id}')" style="color:${c.text}" title="Stop floating (returns to Reminders tab)">✕</button>
    </div>`;
  }).join('');
}

function focusSticky(id) {
  const el = document.getElementById(`sticky-${id}`);
  if (!el) return;
  el.style.zIndex = 950;
  el.style.boxShadow = '0 0 0 3px rgba(79,154,181,0.55), 6px 10px 28px rgba(0,0,0,0.5)';
  setTimeout(() => { el.style.boxShadow = ''; el.style.zIndex = ''; }, 2000);
}

function changeStickyColor(id, colorIdx) {
  const s = STATE.stickies.find(x=>x.id===id);
  if (!s) return;
  s.colorIdx = colorIdx;
  saveSticky(s).catch(()=>{});
  renderStickyLayer();
  renderReminders();
}

// ── STICKY DRAG LOGIC ────────────────────────────────────────
// Mouse + touch drag with sidebar-aware boundary clamping
let _drag = null;

function _sidebarWidth() {
  const sb = document.getElementById('sidebar');
  if (!sb) return 0;
  // On mobile sidebar slides off-canvas so doesn't eat space
  if (window.innerWidth <= 900) return 0;
  return sb.classList.contains('collapsed') ? 64 : 240;
}

function startDragSticky(e, id) {
  const el = document.getElementById(`sticky-${id}`);
  if (!el) return;
  e.preventDefault();
  const rect = el.getBoundingClientRect();
  _drag = { id, el, ox: e.clientX - rect.left, oy: e.clientY - rect.top };
  el.style.zIndex = 950;
  el.style.cursor = 'grabbing';
  document.addEventListener('mousemove', onDragSticky);
  document.addEventListener('mouseup', endDragSticky);
  document.addEventListener('touchmove', onDragStickyTouch, { passive: false });
  document.addEventListener('touchend', endDragStickyTouch);
}

function _clampSticky(nx, ny) {
  const sidebarW = _sidebarWidth();
  const noteW = 240, noteH = 140;
  const minX = sidebarW + 8;
  const maxX = window.innerWidth  - noteW - 8;
  const minY = 62;
  const maxY = window.innerHeight - noteH - 8;
  return {
    x: Math.min(Math.max(nx, minX), maxX),
    y: Math.min(Math.max(ny, minY), maxY),
  };
}

function onDragSticky(e) {
  if (!_drag) return;
  const { x, y } = _clampSticky(e.clientX - _drag.ox, e.clientY - _drag.oy);
  _drag.el.style.left = `${x}px`;
  _drag.el.style.top  = `${y}px`;
}
function onDragStickyTouch(e) {
  if (!_drag || !e.touches[0]) return;
  e.preventDefault();
  const t = e.touches[0];
  const { x, y } = _clampSticky(t.clientX - _drag.ox, t.clientY - _drag.oy);
  _drag.el.style.left = `${x}px`;
  _drag.el.style.top  = `${y}px`;
}
function endDragSticky() {
  if (!_drag) return;
  const x = parseFloat(_drag.el.style.left);
  const y = parseFloat(_drag.el.style.top);
  const s = STATE.stickies.find(s => s.id === _drag.id);
  if (s) { s.x = x; s.y = y; saveSticky(s).catch(()=>{}); }
  _drag.el.style.cursor = 'grab';
  _drag.el.style.zIndex = '';
  _drag = null;
  document.removeEventListener('mousemove', onDragSticky);
  document.removeEventListener('mouseup', endDragSticky);
}
function endDragStickyTouch() {
  endDragSticky();
  document.removeEventListener('touchmove', onDragStickyTouch);
  document.removeEventListener('touchend', endDragStickyTouch);
}

// Re-renders sticky layer but keeps current DOM positions for notes already on screen
function _renderStickyLayerPreservePositions() {
  // Capture current DOM positions before re-render
  STATE.stickies.forEach(s => {
    const el = document.getElementById(`sticky-${s.id}`);
    if (el) {
      s.x = parseFloat(el.style.left) || s.x;
      s.y = parseFloat(el.style.top)  || s.y;
    }
  });
  renderStickyLayer();
}

// KANBAN BOARD — 5 status columns, KPI strip, filter bar
// ═══════════════════════════════════════════════════════════
function renderBoard() {
  try {
  const f = STATE.kanbanFilter;
  const today = fmtDate(TODAY);
  const in7   = fmtDate(new Date(TODAY.getTime() + 7*24*60*60*1000));
  const allTasks = getTasks();

  // ── Context pill filter ───────────────────────────────────────────
  let contextFiltered = allTasks.filter(t => {
    const st   = parseStatus(t.status).state;
    const days = daysUntil(t.dueDate);
    switch (f.context) {
      case 'all':        return true;
      case 'open':       return st !== 'Completed';
      case 'done':       return st === 'Completed';
      case 'overdue':    return st !== 'Completed' && days !== null && days < 0;
      case 'today':      return t.dueDate === today;
      case 'week':       return t.dueDate && t.dueDate >= today && t.dueDate <= in7;
      case 'noassignee': return !t.assignees || t.assignees.trim() === '';
      default:           return st !== 'Completed';
    }
  });

  // ── Search + priority + assignee refinements ──────────────────────
  let visible = contextFiltered.filter(t => {
    if (f.search && !t.title.toLowerCase().includes(f.search.toLowerCase())) return false;
    if (f.priority !== 'All' && t.priority !== f.priority) return false;
    if (f.assignee !== 'All') {
      const parts = (t.assignees||'').split('|').map(s=>s.trim());
      if (!parts.includes(f.assignee)) return false;
    }
    return true;
  });

  // ── Pill counts ───────────────────────────────────────────────────
  const cOpen      = allTasks.filter(t => parseStatus(t.status).state !== 'Completed').length;
  const cDone      = allTasks.filter(t => parseStatus(t.status).state === 'Completed').length;
  const cOverdue   = allTasks.filter(t => { const d=daysUntil(t.dueDate); return parseStatus(t.status).state!=='Completed'&&d!==null&&d<0; }).length;
  const cToday     = allTasks.filter(t => parseStatus(t.status).state !== 'Completed' && t.dueDate === today).length;
  const cWeek      = allTasks.filter(t => parseStatus(t.status).state !== 'Completed' && t.dueDate && t.dueDate >= today && t.dueDate <= in7).length;
  const cNoAssign  = allTasks.filter(t => parseStatus(t.status).state !== 'Completed' && (!t.assignees || t.assignees.trim() === '')).length;

  const _emptyMsgs = {
    'Backlog':'Nothing in the backlog',
    'To Do':'No tasks to do',
    'In Progress':'Nothing in progress',
    'Review':'Nothing to review',
    'Completed':'No completed tasks'
  };

  const _kbPriOrd = p => p==='Critical'?0:p==='High'?1:p==='Medium'?2:p==='Low'?3:4;

  const buildCardTags = (t) => {
    // Tags
    const allTags   = (t.tags||[]).slice(0,6);
    const tagsRow1  = allTags.slice(0,3);
    const tagsRow2  = allTags.slice(3);
    const mkTag     = tag => _buildTagChip(tag);
    const tags1HTML = tagsRow1.length ? `<div style="display:flex;gap:3px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;max-width:50%">${tagsRow1.map(mkTag).join('')}</div>` : '';
    const tags2HTML = tagsRow2.length ? `<div style="display:flex;gap:3px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;max-width:50%">${tagsRow2.map(mkTag).join('')}</div>` : '';
    return { tagsRow2, tags1HTML, tags2HTML };
  };

  const buildCardMetaRight = (t) => {
    const { state: _ms, doneAt: _da } = parseStatus(t.status);
    let metaRight = '';
    if (_ms==='Completed'||_ms==='Done') {
      if (_da) {
        const _dp = _da.split(' ');
        const _doneDate = _dp[0] || '';
        const _doneTime = _dp[1] ? fmtTime(_dp[1]) : '';
        metaRight = 'Done ' + [_doneDate, _doneTime].filter(Boolean).join(' ');
      } else {
        metaRight = 'Completed';
      }
    } else if (t.dueDate) {
      metaRight = t.dueDate;
    }
    return metaRight;
  };

  const buildBoardCard = (t, isCompleted) => {
    // Unified chip/badge system
    const evBorder      = _buildAccentBorder(t.priority);
    const priorityBadge = _buildPriorityBadge(t);
    const statusBadge   = _buildStatusBadge(t);
    const dueChip       = isCompleted ? '' : _buildCounterChip(t.dueDate);
    const ctxChips      = _buildContextChips(t);
    const { tagsRow2, tags1HTML, tags2HTML } = buildCardTags(t);
    // Subtask chip + meta
    const stChip = _subtaskChip(t);
    const metaRight = buildCardMetaRight(t);
    const titleStyle = isCompleted ? 'text-decoration:line-through;opacity:0.6;' : '';
    return `<div class="gt-card" style="${evBorder}" draggable="true" ondragstart="dragStart('${t.id}')" ondragend="dragEnd()" onclick="openTEEDetail('${t.id}')" title="Click to view/edit">
        <div class="gt-card-row1">
          ${priorityBadge}${statusBadge}
          <span style="display:flex;align-items:center;gap:4px;margin-left:auto">${ctxChips}${stChip}</span>
        </div>
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin:4px 0 2px">
          <div class="gt-card-title" style="margin:0;flex:1;min-width:0;${titleStyle}">${t.title}</div>
          ${tags1HTML}
        </div>
        ${(t.desc||tagsRow2.length) ? `<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px">
          ${t.desc ? `<div class="gt-card-desc-wrap" style="flex:1;min-width:0">${t.desc}</div>` : '<div></div>'}
          ${tags2HTML}
        </div>` : ''}
        <div class="gt-card-footer">
          <div class="gt-card-footer-left">${renderAssigneeStack(t.assignees||'', false, t.type)}</div>
          <div class="gt-card-footer-right">${dueChip}${metaRight ? `<span class="gt-card-meta">${metaRight}</span>` : ''}</div>
        </div>
        ${isCompleted ? `<button class="archive-card-btn" onclick="event.stopPropagation();archiveItem('${t.id}')">Archive</button>` : ''}
      </div>`;
  };

  const colsHTML = KANBAN_COLS.map(col => {
    const colTasks = visible.filter(t=>parseStatus(t.status).state===col.id)
      .sort((a,b) => {
        const pd = _kbPriOrd(a.priority) - _kbPriOrd(b.priority);
        if (pd !== 0) return pd;
        if (a.dueDate && b.dueDate) return a.dueDate.localeCompare(b.dueDate);
        if (a.dueDate) return -1;
        if (b.dueDate) return 1;
        return 0;
      });
    const isCompleted = col.id === 'Completed';
    // Completed column cap — dynamic based on screen height
    const cardsHTML = colTasks.map(t => buildBoardCard(t, isCompleted)).join('');

    return `<div class="kanban-col" ondragover="dragOver(event,'${col.id}')" ondrop="drop(event,'${col.id}')">
      <div class="kanban-col-header" style="border-top:2px solid ${getColColor(col)}">
        <div class="kanban-dot" style="background:${getColColor(col)};box-shadow:0 0 6px ${getColColor(col)}"></div>
        <span class="kanban-col-name" style="color:${getColColor(col)}">${col.label}</span>
        <span class="kanban-count" style="color:${getColColor(col)}">${colTasks.length}</span>
      </div>
      <div class="kanban-body">${cardsHTML || '<div class="kanban-empty-col">'+(_emptyMsgs[col.id]||'No tasks')+'</div>'}</div>
      <button class="kanban-add-btn" onclick="openTEEModal(null,'task',null,'${col.id}')">+ Add task</button>
    </div>`;
  }).join('');

  // ── Priority + assignee counts for dropdowns ─────────────────────
  // Base for priority counts — respects active assignee filter
  const _baseForPri = allTasks.filter(t =>
    parseStatus(t.status).state !== 'Completed' &&
    (f.assignee === 'All' || (t.assignees||'').split('|').map(s=>s.trim()).includes(f.assignee))
  );
  const priCounts = {};
  ['Critical','High','Medium','Low'].forEach(p => {
    priCounts[p] = _baseForPri.filter(t => t.priority === p).length;
  });
  // Base for assignee counts — respects active priority filter
  const _baseForAssignee = allTasks.filter(t =>
    parseStatus(t.status).state !== 'Completed' &&
    (f.priority === 'All' || t.priority === f.priority)
  );
  const assigneeNames = new Set();
  _baseForAssignee.forEach(t => splitAssigneeNames(t.assignees).forEach(n=>assigneeNames.add(n)));
  const assigneeCounts = {};
  assigneeNames.forEach(n => {
    assigneeCounts[n] = _baseForAssignee.filter(t => (t.assignees||'').split('|').map(s=>s.trim()).includes(n)).length;
  });

  // ── Priority dropdown HTML ────────────────────────────────────────
  const priColors = {Critical:'#F87171',High:'#FB923C',Medium:'#0891B2',Low:'#64748B'};
  const priFloatHTML = '<div class="kb-float-item' + (f.priority==='All'?' active':'') + '" onclick="_kbSetPriority(\'All\')">All Priorities</div>'
    + ['Critical','High','Medium','Low'].map(p =>
        '<div class="kb-float-item' + (f.priority===p?' active':'') + '" onclick="_kbSetPriority(\''+p+'\')"><span class="kb-float-dot" style="background:'+priColors[p]+'"></span>'+p+'<span class="kb-float-count">'+( priCounts[p]||0)+'</span></div>'
      ).join('');
  const priCount  = _baseForPri.filter(t => t.priority === f.priority).length;
  const priLabel  = f.priority === 'All' ? 'All Priority' : f.priority + ' (' + priCount + ')';
  const priColor  = priColors[f.priority] || null;
  const priActive = f.priority !== 'All';

  // ── Assignee dropdown HTML ────────────────────────────────────────
  const assigneeFloatHTML = '<div class="kb-float-item' + (f.assignee==='All'?' active':'') + '" onclick="_kbSetAssignee(\'All\')">All Assignees</div>'
    + [...assigneeNames].map(n =>
        '<div class="kb-float-item' + (f.assignee===n?' active':'') + '" onclick="_kbSetAssignee(\''+n+'\')">'+n+'<span class="kb-float-count">'+assigneeCounts[n]+'</span></div>'
      ).join('');
  const assigneeCount = f.assignee === 'All' ? 0 : _baseForAssignee.filter(t => (t.assignees||'').split('|').map(s=>s.trim()).includes(f.assignee)).length;
  const assigneeLabel = f.assignee === 'All' ? 'All Assignees' : f.assignee + ' (' + assigneeCount + ')';
  const assigneeActive = f.assignee !== 'All';

  // ── Context subtitle ──────────────────────────────────────────────
  const ctxLabels = {open:'Open Tasks',done:'Completed',overdue:'Overdue',today:'Due Today',week:'Next 7 Days',noassignee:'No Assignee'};
  const ctxSubtitle = f.context === 'all' ? 'All Tasks' : ctxLabels[f.context] || 'All Tasks';

  // Store float HTML in STATE for button onclick access
  STATE._kbPriFloatHTML      = priFloatHTML;
  STATE._kbAssigneeFloatHTML = assigneeFloatHTML;

  // Capture focus state BEFORE re-render destroys DOM
  const _wasSearchFocused = _captureSearchFocus('kanban-search-input');

  document.getElementById('boardSection').innerHTML = `
    <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:12px;flex-shrink:0">
      <span style="font-size:26px;font-weight:800;letter-spacing:-0.03em;line-height:1.1;color:var(--text);font-family:var(--font-disp)">Kanban Board</span>
      <span style="font-size:26px;font-weight:400;color:var(--muted);font-family:var(--font-disp)"> · ${ctxSubtitle}</span>
      <div style="display:flex;gap:8px;margin-left:auto">
        <button class="btn-ghost" onclick="openArchiveDrawer()">View Archive</button>
        <button class="btn-primary" onclick="openTEEModal(null,'task',null,'Backlog')">+ New Task</button>
      </div>
    </div>
    <div class="kanban-board-wrap">

    <div class="kb-pill-strip" style="margin-bottom:8px">
      <button class="kb-pill${f.context==='open'?' active':''}" onclick="_kbSetContext('open')">
        <span class="kb-pill-num">${cOpen}</span> OPEN TASKS
      </button>
      ${cDone > 0 ? `<button class="kb-pill done${f.context==='done'?' active':''}" onclick="_kbSetContext('done')"><span class="kb-pill-num">${cDone}</span> COMPLETED</button>` : ''}
      ${cOverdue > 0 ? `<button class="kb-pill overdue${f.context==='overdue'?' active':''}" onclick="_kbSetContext('overdue')"><span class="kb-pill-num">${cOverdue}</span> OVERDUE</button>` : ''}
      ${cToday > 0 ? `<button class="kb-pill today${f.context==='today'?' active':''}" onclick="_kbSetContext('today')"><span class="kb-pill-num">${cToday}</span> TODAY</button>` : ''}
      ${cWeek > 0 ? `<button class="kb-pill week${f.context==='week'?' active':''}" onclick="_kbSetContext('week')"><span class="kb-pill-num">${cWeek}</span> NEXT 7 DAYS</button>` : ''}
      ${cNoAssign > 0 ? `<button class="kb-pill noassignee${f.context==='noassignee'?' active':''}" onclick="_kbSetContext('noassignee')"><span class="kb-pill-num">${cNoAssign}</span> NO ASSIGNEE</button>` : ''}
    </div>
    <div class="kb-pill-strip" style="margin-bottom:12px">
      <div class="kb-search-wrap">
        <i class="ti ti-search" style="font-size:12px;color:var(--muted)"></i>
        <input id="kanban-search-input" placeholder="Search tasks…" value="${f.search}"
          oninput="STATE.kanbanFilter.search=this.value;renderBoard();">
      </div>
      <button class="kb-dropdown-btn${priActive?' active':''}" onclick="_kbOpenPriFloat(this)"
        style="${priColor ? 'border-color:'+priColor+';color:'+priColor+';background:'+priColor+'22;' : ''}">
        ${priLabel} &nbsp;&#9660;
      </button>
      <button class="kb-dropdown-btn${assigneeActive?' active':''}" onclick="_kbOpenAssigneeFloat(this)">
        ${assigneeLabel} &nbsp;&#9660;
      </button>
    </div>

    <div class="kanban-wrap">${colsHTML}</div>
    </div>
  `;
  // Restore focus to search if it was active before re-render
  _restoreSearchFocus('kanban-search-input', _wasSearchFocused);
  } catch(e) {
    console.error('renderBoard error:', e);
    const _bs = document.getElementById('boardSection');
    if (_bs) _bs.innerHTML = '<div style="padding:24px;color:#F87171;font-size:13px">Kanban error: ' + e.message + '</div>';
  }
}

// ── ARCHIVE DRAWER ────────────────────────────────────────────
// Lazy-loads archived tasks from STATE.archiveCache, with
// search / priority / assignee filters and one-click restore
function openArchiveDrawer() {
  // Load archive cache if not already fetched
  if (!STATE.archiveCache._fetched && STATE.sheetConnected) {
    openModal(`
      ${buildModalListHeader('📦', 'Task Archive', 'Loading…')}
      <div style="text-align:center;padding:40px;color:var(--muted)">Loading archive…</div>`);
    // Fetch and re-open once loaded
    const now = new Date();
    fetchArchiveMonth(now.getFullYear(), now.getMonth())
      .then(() => { openArchiveDrawer(); });
    return;
  }

  // Flatten all archive cache into one array (tasks only for this drawer)
  const allArchived = Object.entries(STATE.archiveCache)
    .filter(([k]) => k !== '_fetched')
    .flatMap(([, items]) => items)
    .filter(i => i.type === 'task');

  _renderArchiveDrawer('', 'All', 'All');
}

function _renderArchiveDrawer(search, priority, assignee) {
  // Always read fresh from cache
  const allArchived = Object.entries(STATE.archiveCache)
    .filter(([k]) => k !== '_fetched')
    .flatMap(([, items]) => items)
    .filter(i => i.type === 'task');

  const assignees = ['All', ...new Set(allArchived.flatMap(t=>splitAssigneeNames(t.assignees)).filter(Boolean))];
  let filtered = allArchived.filter(t => {
    if (search && !t.title.toLowerCase().includes(search.toLowerCase()) && !t.id.toLowerCase().includes(search.toLowerCase())) return false;
    if (priority !== 'All' && t.priority !== priority) return false;
    if (assignee !== 'All' && !splitAssigneeNames(t.assignees||'').includes(assignee)) return false;
    return true;
  });

  filtered = filtered.slice().sort((a,b) => (b.archivedDate||'').localeCompare(a.archivedDate||''));

  const rowsHTML = filtered.length === 0
    ? `<div style="text-align:center;padding:40px 20px;color:var(--muted)">
        <div style="font-size:32px;margin-bottom:10px">📦</div>
        <div>No archived tasks match your filters</div>
      </div>`
    : filtered.map(t => {
        const pri = getPri(t.priority);
        return `<div class="archive-row">
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-decoration:line-through;opacity:0.8">${t.title}</div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap">
              <span style="font-family:var(--mono)">${t.id}</span>
              <span>${splitAssigneeNames(t.assignees).join(', ')||'Unassigned'}</span>
              ${t.archivedDate ? `<span>Archived ${t.archivedDate}</span>` : ''}
              ${t.dueDate ? `<span>Due was ${t.dueDate}</span>` : ''}
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
            <span style="font-size:10px;padding:2px 8px;border-radius:20px;background:${pri.bg};color:${pri.text}">${t.priority}</span>
            <button class="btn-ghost" style="height:30px;padding:0 12px;font-size:12px" onclick="restoreFromArchive('${t.id}')">Restore</button>
          </div>
        </div>`;
      }).join('');

  openModal(`
    ${buildModalListHeader('📦', 'Task Archive', `${allArchived.length} archived task${allArchived.length!==1?'s':''} · ${filtered.length} shown`)}

    <div class="archive-filter-bar">
      <input id="arch-search" placeholder="Search…" value="${search}"
        oninput="_renderArchiveDrawer(this.value,document.getElementById('arch-priority').value,document.getElementById('arch-assignee').value)"
        style="flex:1;min-width:120px">
      <select id="arch-priority" onchange="_renderArchiveDrawer(document.getElementById('arch-search').value,this.value,document.getElementById('arch-assignee').value)">
        <option value="All"${priority==='All'?' selected':''}>All Priorities</option>
        ${['Critical','High','Medium','Low'].map(p=>`<option value="${p}"${priority===p?' selected':''}>${p}</option>`).join('')}
      </select>
      <select id="arch-assignee" onchange="_renderArchiveDrawer(document.getElementById('arch-search').value,document.getElementById('arch-priority').value,this.value)">
        ${assignees.map(a=>`<option value="${a}"${assignee===a?' selected':''}>${a==='All'?'All Assignees':a}</option>`).join('')}
      </select>
    </div>

    <div style="display:flex;flex-direction:column;gap:6px;max-height:55vh;overflow-y:auto;padding-right:4px;margin-top:14px">
      ${rowsHTML}
    </div>

    <div class="modal-actions" style="margin-top:16px">
      ${_backBtn()}
    </div>`, true);
}

// DIRECTORIES — Folders, Contacts, Locations tabbed view
// ═══════════════════════════════════════════════════════════
function renderDirectories() {
  const tab        = STATE.dirTab;
  const q          = STATE.dirSearch.toLowerCase();
  const activeTags = STATE.dirTags || [];

  // ── Group label ──────────────────────────────────────────────
  const groupLabel = tab === 'folders' ? 'Folders & Files' : tab === 'contacts' ? 'Contacts' : tab === 'locations' ? 'Locations' : 'Tags';

  // ── Sort helper — defined first so it can be used below ───────
  const _sortItems = arr => {
    if (STATE.dirSort === 'az')
      return [...arr].sort((a,b) => (a.name||'').localeCompare(b.name||''));
    return [...arr].sort((a,b) => (b.id||'').localeCompare(a.id||''));
  };

  // ── Tab strip ────────────────────────────────────────────────
  const _tabs = [
    { id:'folders',   icon:'ti-folder',  label:'Folders & Files' },
    { id:'contacts',  icon:'ti-user',    label:'Contacts'        },
    { id:'locations', icon:'ti-map-pin', label:'Locations'       },
    { id:'tags',      icon:'ti-tag',     label:'Tags'            },
  ];
  const tabHTML = _tabs.map(t =>
    '<button class="gt-primary-pill' + (tab===t.id?' active':'') + '"'
    + ' onclick="_dirSwitchTab(\'' + t.id + '\')">'
    + '<i class="ti ' + t.icon + '" style="font-size:13px"></i>' + t.label
    + '</button>'
  ).join('');

  // ── Helpers ───────────────────────────────────────────────────
  const emptyState = (icon, msg, sub, action, actionLabel) =>
    '<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)">'
    + '<i class="ti ' + icon + '" style="font-size:40px;display:block;margin-bottom:12px;opacity:0.5"></i>'
    + '<div style="font-size:15px;font-weight:600;margin-bottom:4px;color:var(--text2)">' + msg + '</div>'
    + '<div style="font-size:13px;margin-bottom:16px">' + sub + '</div>'
    + '<button class="btn-primary" onclick="' + action + '"><i class="ti ti-plus" style="font-size:13px;margin-right:4px"></i>' + actionLabel + '</button>'
    + '</div>';

  const searchEmpty = type =>
    '<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)">'
    + '<i class="ti ti-search-off" style="font-size:40px;display:block;margin-bottom:12px;opacity:0.5"></i>'
    + '<div style="font-size:15px;font-weight:600;margin-bottom:4px;color:var(--text2)">No results</div>'
    + '<div style="font-size:13px">No ' + type + ' match that search</div>'
    + '</div>';

  const editBtn = (type, id) =>
    '<button class="dir-action-btn" onclick="openDirModal(\'' + type + '\',\'' + id + '\')" title="Edit"><i class="ti ti-pencil" style="font-size:13px"></i></button>';
  const delBtn = (type, id) =>
    '<button class="dir-action-btn" onclick="removeDirItem(\'' + type + '\',\'' + id + '\')" title="Delete"><i class="ti ti-trash" style="font-size:13px"></i></button>';
  const addCard = (type, label) =>
    '<div class="dir-add-btn" onclick="openDirModal(\'' + type + '\',null)"><i class="ti ti-plus" style="font-size:20px"></i><span>Add ' + label + '</span></div>';

  // ── Tag chip row / action button group helpers ─────────────────
  const tagChipRow = (tags, marginBottom) => {
    const _raw = (tags||[]).map(t => _buildTagChip(t)).join('');
    return _raw ? '<div style="display:flex;flex-wrap:wrap;gap:4px' + (marginBottom ? ';margin-bottom:4px' : '') + '">' + _raw + '</div>' : '';
  };
  const actionButtons = (type, id, marginLeftAuto) =>
    '<div style="display:flex;gap:2px' + (marginLeftAuto ? ';margin-left:auto' : '') + '">' + editBtn(type,id) + delBtn(type,id) + '</div>';

  // ── Card builders ────────────────────────────────────────────
  const buildFolderCard = f => {
    const _fTags = tagChipRow(f.tags, true);

      + (c.position ? '<div class="dir-card-sub">' + c.position + '</div>' : '')
      + (c.company  ? '<div class="dir-card-sub" style="font-size:10px;opacity:0.75">' + c.company + '</div>' : '')
      + '</div></div>'
      + _contacts

      + _lNotes
      + _lTags
      + '<div class="dir-card-footer" style="align-items:center">'
      + '<div>' + _lMapUrl + '</div>'
      + actionButtons('location', l.id, true)
      + '</div></div>';
  };

  // ── Build cards ───────────────────────────────────────────────
  let cardsHTML = '';

  if (tab === 'folders') {
    const _fBase     = STATE.folders.filter(f => !q || f.name.toLowerCase().includes(q) || (f.desc||'').toLowerCase().includes(q) || (f.tags||[]).some(t=>t.includes(q)));
    const _fFiltered = activeTags.length ? _fBase.filter(f => activeTags.every(t => (f.tags||[]).includes(t))) : _fBase;
    const filtered   = _sortItems(_fFiltered);
    if (STATE.folders.length === 0) {
      cardsHTML = emptyState('ti-folder-off', 'No folders yet', 'Save links to important folders and resources', "openDirModal('folder',null)", 'Add Folder');
    } else if (filtered.length === 0) {
      cardsHTML = searchEmpty('folders');
    } else {
      cardsHTML = filtered.map(buildFolderCard).join('') + addCard('folder','Folder/File');
    }

  } else if (tab === 'contacts') {
    const _cBase     = STATE.contacts.filter(c => !q || c.name.toLowerCase().includes(q) || (c.position||'').toLowerCase().includes(q) || (c.email||'').toLowerCase().includes(q) || (c.phone||'').includes(q) || (c.company||'').toLowerCase().includes(q) || (c.tags||[]).some(t=>t.includes(q)));
    const _cFiltered = activeTags.length ? _cBase.filter(c => activeTags.every(t => (c.tags||[]).includes(t))) : _cBase;
    const filtered   = _sortItems(_cFiltered);
    if (STATE.contacts.length === 0) {
      cardsHTML = emptyState('ti-address-book-off', 'No contacts yet', 'Add people you frequently need to reach', "openDirModal('contact',null)", 'Add Contact');

      cardsHTML = searchEmpty('contacts');
    } else {
      cardsHTML = filtered.map(buildContactCard).join('') + addCard('contact','Contact');
    }

  } else {
    const _lBase     = STATE.locations.filter(l => !q || l.name.toLowerCase().includes(q) || (l.address||'').toLowerCase().includes(q) || (l.company||'').toLowerCase().includes(q) || (l.tags||[]).some(t=>t.includes(q)));
    const _lFiltered = activeTags.length ? _lBase.filter(l => activeTags.every(t => (l.tags||[]).includes(t))) : _lBase;
    const filtered   = _sortItems(_lFiltered);
    if (STATE.locations.length === 0) {
      cardsHTML = emptyState('ti-map-pin-off', 'No locations yet', 'Save addresses and map links for quick access', "openDirModal('location',null)", 'Add Location');
    } else if (filtered.length === 0) {
      cardsHTML = searchEmpty('locations');

    cardsHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)">'
      + '<i class="ti ti-tag" style="font-size:40px;display:block;margin-bottom:16px;opacity:0.5"></i>'

  } else {
      cardsHTML = filtered.map(buildLocationCard).join('') + addCard('location','Location');

  // ── Build tag float HTML ──────────────────────────────────────

  const _tagBase   = _tabItems.filter(item => !q || item.name.toLowerCase().includes(q) || (item.tags||[]).some(t=>t.includes(q)));
  const _allTagsMap = {};
  _tagBase.forEach(item => (item.tags||[]).forEach(t => {

      const cnt = activeTags.length
        ? _tagBase.filter(i => activeTags.every(a => (i.tags||[]).includes(a)) && (i.tags||[]).includes(t)).length

      if (cnt > 0) _allTagsMap[t] = cnt;
    }
  }));
  const _availTags = Object.entries(_allTagsMap).sort((a,b) => b[1]-a[1]);
  const _floatItems = _availTags.length
    ? _availTags.map(([t,c]) => '<div class="kb-float-item" onclick="_dirAddTag(\'' + t + '\')">#' + t + '<span class="kb-float-count">' + c + '</span></div>').join('')
    : '<div style="padding:10px 14px;font-size:12px;color:var(--muted)">No more tags available</div>';
  STATE._dirTagFloatHTML = '<div style="padding:4px 0">' + _floatItems + '</div>';

  const _activeChipsHTML = activeTags.map(t => {
    const tc = tagColor(t);
    return '<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;background:' + tc.bg + ';color:' + tc.text + ';border:1px solid ' + tc.border + '">#' + t + '<button onclick="_dirRemoveTag(\'' + t + '\')" style="background:none;border:none;cursor:pointer;padding:0;margin-left:2px;opacity:0.7;font-size:10px;color:inherit;line-height:1">x</button></span>';
  }).join('');
  const _tagBtnLabel   = activeTags.length === 0 ? 'All Tags &#9660;' : '+ Tags &#9660;';
  const _tagBtnActive  = activeTags.length ? ' active' : '';
  const _tagFilterHTML = _activeChipsHTML + '<button class="kb-dropdown-btn' + _tagBtnActive + '" onclick="_dirOpenTagFloat(this)">' + _tagBtnLabel + '</button>';

  // ── Sort controls ────────────────────────────────────────────
  const _azActive  = STATE.dirSort === 'az'     ? ' active' : '';
  const _newActive = STATE.dirSort === 'newest'  ? ' active' : '';
  const _sortHTML  = '<div style="display:flex;align-items:center;gap:6px;margin-left:auto;flex-shrink:0">'
    + '<span style="font-size:11px;color:var(--muted);font-weight:500">Sort:</span>'
    + '<button class="gt-primary-pill' + _azActive  + '" onclick="_dirSetSort(\'az\')" style="padding:4px 10px;font-size:11px">A-Z</button>'
    + '<button class="gt-primary-pill' + _newActive + '" onclick="_dirSetSort(\'newest\')" style="padding:4px 10px;font-size:11px">Newest</button>'
    + '</div>';

  // ── Search value (safe for innerHTML) ───────────────────────
  const _searchVal = (STATE.dirSearch||'').replace(/"/g, '&quot;');
  const _searchPh  = 'Search ' + groupLabel.toLowerCase() + '…';

  // ── Render ────────────────────────────────────────────────────
  // P1-BUG001: renderDirectories() replaces dirSection.innerHTML on every
  // keystroke, destroying and recreating #dir-search-input — causing focus
  // loss after each character. Capture focus state before replacement and
  // restore after so search typing is continuous.
  const _prevActive    = document.activeElement;
  const _searchFocused = _prevActive && _prevActive.id === 'dir-search-input';

  document.getElementById('dirSection').innerHTML = ''
    + '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:16px;flex-shrink:0;flex-wrap:wrap">'
    + '<span style="font-size:26px;font-weight:800;letter-spacing:-0.03em;line-height:1.1;color:var(--text);font-family:var(--font-disp)">Resources</span>'
    + '<span style="font-size:26px;font-weight:400;color:var(--muted);font-family:var(--font-disp)"> &middot; ' + groupLabel + '</span>'
    + '</div>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">' + tabHTML + '</div>'
    + '<div style="display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap">'
    + '<div class="kb-search-wrap">'
    + '<i class="ti ti-search" style="font-size:12px;color:var(--muted)"></i>'
    + '<input id="dir-search-input" placeholder="' + _searchPh + '" value="' + _searchVal + '" oninput="STATE.dirSearch=this.value;renderDirectories()" style="border:none;background:transparent;color:var(--text);font-family:var(--font);font-size:13px;outline:none;width:100%">'
    + '</div>'
    + _tagFilterHTML
    + _sortHTML
    + '</div>'
    + '<div class="dir-grid" style="padding-bottom:40px">' + cardsHTML + '</div>';

  // Restore focus and cursor if search input was active before render.
  // P1-BUG001 (follow-up): the previous fix captured selectionStart/End from
  // the old (destroyed) input before replacement. On the first character typed
  // into an empty field, selectionStart was 0, so setSelectionRange(0,0) placed
  // the cursor before the new character — causing the second character to prepend
  // rather than append, making it appear the first character didn't filter.
  // Fix: always place the cursor at the end of the new input value after restore.
  if (_searchFocused) {
    const _newInp = document.getElementById('dir-search-input');
    if (_newInp) {
      _newInp.focus();
      const _len = _newInp.value.length;
      _newInp.setSelectionRange(_len, _len);
    }
  }
}

function confirmAction(message, confirmLabel, onConfirm, danger=true, onCancel=null) {
  const btnId = 'confirm-action-btn-' + Date.now();
  const cancelBtnId = 'confirm-action-cancel-btn-' + Date.now();
  openModal(`
    <div style="padding:4px 0 12px">
      <div style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:10px">Confirm</div>
      <div style="font-size:14px;color:var(--text2);line-height:1.6">${message}</div>
    </div>
    <div class="modal-actions">
      <button id="${cancelBtnId}" class="btn-ghost">Cancel</button>
      <button id="${btnId}" style="${danger?'background:rgba(248,113,113,0.12);color:var(--red);border:1px solid rgba(248,113,113,0.35);height:36px;padding:0 16px;border-radius:10px;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;':''}">
        ${confirmLabel}
      </button>
    </div>`);
  // P4-R024: Cancel is now a real addEventListener (was a static inline
  // onclick="clearNav()") so an arbitrary onCancel closure can be preserved
  // without .toString() serialization — same closure-preserving mechanism
  // the Confirm button below already uses (since P4-R003d-pre). Callers that
  // don't pass onCancel keep the exact prior behavior.
  document.getElementById(cancelBtnId).addEventListener('click', () => { if (onCancel) onCancel(); else clearNav(); });
  document.getElementById(btnId).addEventListener('click', () => { clearNav(); onConfirm(); });
}

// ── NAVIGATION STACK ────────────────────────────────────────
// Rules:
//   _backBtn() → call BEFORE pushNav to get correct back button
//   pushNav(fn) → call AFTER openModal so next modal can pop back here
//   popNav()   → called by ‹ Back only, pops and reopens previous
//   clearNav() → called by ✕, outside click, save, cancel, escape

window._navStack = [];

function pushNav(reopenFn) {
  window._navStack.push(reopenFn);
}

function popNav() {
  const fn = window._navStack.pop();
  if (fn) fn();
  else clearNav();
}

function clearNav() {
  window._navStack = [];
  document.getElementById('activeModal')?.remove();
  document.getElementById('fabWrap')?.classList.remove('hidden');
  document.removeEventListener('keydown', document._modalEscHandler);
}


// ── NAV HELPER ───────────────────────────────────────────────
// Call this when navigating FROM one modal TO another.
// reopenCurrent: function that reopens the current modal
// openNext: function that opens the next modal
function _navTo(reopenCurrent, openNext) {
  pushNav(reopenCurrent);
  openNext();
}
function _backBtn() {
  // Check stack length AT THE MOMENT OF RENDERING
  // Push happens AFTER openModal, so this correctly reflects
  // whether there is a previous modal to return to
  return window._navStack.length > 0
    ? `<button class="btn-ghost" onclick="popNav()">‹ Back</button>`
    : '';
}

window._kbSetAssignee = (val) => { STATE.kanbanFilter.assignee = val; document.querySelectorAll('.kb-float').forEach(el=>el.remove()); renderBoard(); };
window._kbOpenFloat = function(btnEl, html) {
  // Toggle if already open from same button
  const existing = document.querySelector('.kb-float');
  if (existing) { existing.remove(); return; }
  const float = document.createElement('div');
  float.className = 'kb-float';
  float.innerHTML = html;
  document.body.appendChild(float);
  const rect = btnEl.getBoundingClientRect();
  float.style.top  = (rect.bottom + 6) + 'px';
  float.style.left = rect.left + 'px';
  setTimeout(() => {
    document.addEventListener('click', function _close(e) {
      if (!float.contains(e.target) && !btnEl.contains(e.target)) {
        float.remove();
        document.removeEventListener('click', _close);
      }
    });
  }, 0);
}

function openModal(html, wide=false) {
  document.getElementById('activeModal')?.remove();
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'activeModal';
  backdrop.innerHTML = `<div class="modal${wide?' modal-wide':''}">${html}</div>`;
  backdrop.addEventListener('click', e => { if (e.target===backdrop) clearNav(); });
  document.body.appendChild(backdrop);
  document.getElementById('fabWrap')?.classList.add('hidden');
  document.removeEventListener('keydown', document._modalEscHandler);
  document._modalEscHandler = e => {
    if (e.key === 'Escape') { clearNav(); }
  };
  document.addEventListener('keydown', document._modalEscHandler);
}

function closeModal() {
  document.getElementById('activeModal')?.remove();
  document.getElementById('fabWrap')?.classList.remove('hidden');
  document.removeEventListener('keydown', document._modalEscHandler);
}

function toggleFab() {
  const main = document.getElementById('fabMain');
  const opts = document.getElementById('fabOptions');
  const isOpen = opts.classList.contains('open');
  if (isOpen) {
    closeFab();
  } else {
    main.classList.add('open');
    opts.classList.add('open');
    // Close on outside click
    setTimeout(() => {
      document.addEventListener('click', function _fabClose(e) {
        if (!document.getElementById('fabWrap')?.contains(e.target)) {
          closeFab();
          document.removeEventListener('click', _fabClose);
        }
      });
    }, 0);
  }
}
function closeFab() {
  document.getElementById('fabMain')?.classList.remove('open');
  document.getElementById('fabOptions')?.classList.remove('open');
}

function openTagList(tag) {
  const matches = STATE.items.filter(item => {
    const tags = Array.isArray(item.tags)
      ? item.tags
      : (item.tags||'').split(',').map(t=>t.trim()).filter(Boolean);
    return tags.some(t => t.toLowerCase() === tag.toLowerCase());
  });

  const typeIcon = { task:'📋', event:'📆', entry:'📝' };
  const listHTML = matches.length === 0
    ? `<div style="text-align:center;padding:28px;color:var(--muted)">No items tagged "${tag}"</div>`
    : matches.map(item => {
        const pri = getPri(item.priority);
        const metaStr = item.type === 'task'
          ? `${getDisplayStatus(item)}${item.dueDate?' · due '+item.dueDate:''}`
          : item.type === 'event'
            ? `${item.date}${item.time?' · '+fmtTime(item.time):''}`
            : item.date || '';
        const onclickFn = `_navTo(()=>openTagList('${tag}'),()=>openTEEDetail('${item.id}'))`;
        return `<div class="tag-list-item" onclick="${onclickFn}">
          <span class="tag-list-type">${typeIcon[item.type]||'📋'}</span>
          <div class="tag-list-body">
            <div class="tag-list-title">${item.title}</div>
            <div class="tag-list-meta">${metaStr}</div>
          </div>
          <span style="font-size:9px;padding:2px 7px;border-radius:20px;background:${pri.bg};color:${pri.text};font-weight:600">${item.priority||''}</span>
        </div>`;
      }).join('');

  openModal(`
    <div class="modal-title">
      <div>
        <div style="font-size:16px;font-weight:800">#${tag}</div>
        <div style="font-size:11px;color:var(--muted)">${matches.length} item${matches.length!==1?'s':''} tagged</div>
      </div>
      ${_modalCloseBtn()}
    </div>
    <div style="max-height:55vh;overflow-y:auto;padding-right:4px">${listHTML}</div>
    <div class="modal-actions" style="margin-top:12px">${_backBtn()}</div>`, true);
}

// ── TEE DETAIL VIEW ───────────────────────────────────────────
// Read-only item detail. fromDate enables ‹ Back to day list.
// isArchived flag switches Edit→Restore and searches archiveCache.
function openTEEDetail(itemId, _u1, isArchived) {
  // Search active items first, then archive cache
  let item = STATE.items.find(i => i.id === itemId);
  if (!item && isArchived) {
    for (const [key, items] of Object.entries(STATE.archiveCache)) {
      if (key === '_fetched') continue;
      const match = items.find(i => i.id === itemId);
      if (match) { item = match; break; }
    }
  }
  if (!item) return;

  const typeIcon  = { task:'📋', event:'📆', entry:'📝' }[item.type] || '📄';
  const typeLabel = { task:'Task', event:'Event', entry:'Entry' }[item.type] || item.type;
  const pri = getPri(item.priority);

  // Build detail rows — only show fields that have values
  const row = (label, value, mono=false) => value
    ? `<div class="detail-row">
        <span class="detail-label">${label}</span>
        <span class="detail-value${mono?' detail-mono':''}">${value}</span>
       </div>`
    : '';

  // P4-R013a-fix2: full weekday + full month names in Detail date displays
  // (discovery basis P4-D023, owner visual review) — was 'short'/'short'
  // ("Sat, Jul 4, 2026"), now 'long'/'long' ("Saturday, July 4, 2026").
  // fmtDisplayDate is local to openTEEDetail only — this does not affect
  // any other date display in the app (Add/Edit, list/board/calendar views
  // each use their own separate date formatting).
  const fmtDisplayDate = str => {
    if (!str) return '';
    const d = new Date(str + 'T00:00:00');
    return d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
  };

  // P4-R013a-fix4: Detail-only dash separator (owner review — "any time/date
  // range using a dash must include spaces before and after it"). A plain
  // " - " with regular space characters was verified byte-correct (each
  // side is a real 0x20 space, confirmed via Range measurement) but reads
  // visually tight-to-attached with certain fallback fonts, since a run of
  // regular whitespace collapses to a single (font-dependent-width) space
  // under normal HTML whitespace rules — the gap is then only as wide as
  // that font's space glyph, which can be very narrow. `.tee-detail-dash`
  // below gives the dash a fixed CSS margin instead, so the visual gap is a
  // guaranteed pixel value independent of font/glyph metrics. row()/detail
  // values are already inserted as HTML (see buildModalDetailHeader's own
  // inline-styled spans for the same pattern elsewhere in this file), so
  // this small span is safe to embed the same way.
  const _dtDash = '<span class="tee-detail-dash">-</span>';

  // P4-R013a-fix5: same reasoning as _dtDash above, applied to the middle
  // dot joining an Event/Entry's date and time into one "Date and Time"
  // row — a plain " · " read as too faint/subtle per owner review.
  // `.tee-detail-dot` gives it a fixed margin plus bolder weight/size so it
  // stays clearly visible regardless of font fallback.
  const _dtDot = '<span class="tee-detail-dot">·</span>';

  // Detail-only time formatter (fmtTimeRange itself is unchanged — it is
  // also used by the Kanban card time display; this local helper is scoped
  // to openTEEDetail only). Degrades safely: both start and end present ->
  // "start - end", only one present -> that one alone, neither -> ''.
  const fmtDetailTime = (start, end) => {
    if (start && end) return `${fmtTime(start)} ${_dtDash} ${fmtTime(end)}`;
    if (start) return fmtTime(start);
    if (end) return fmtTime(end);
    return '';
  };

  // P4-R013a-fix4: corrected date/time row rules per owner visual review of
  // -fix3 (discovery basis P4-D023) — display-only: saved fields
  // (item.dueDate, item.startDate, item.date, item.time, item.endTime) and
  // Add/Edit are both unchanged; this only changes how openTEEDetail
  // presents them. Task keeps -fix3's two-row model as-is (Due Date, plus
  // a hyphen-spaced Timeframe row when Start Date also exists — already
  // correct, spaces confirmed present on both sides of the hyphen). Event
  // and Entry are now combined into one "Date and Time" row instead of
  // -fix3's separate Date/Time rows, joined with a middle dot when a time
  // value exists, degrading to the date alone when no time value is
  // present. No "Timeline"/"Schedule"/"When" labels remain.
  let dateTimeRow = '';
  let timeframeRow = '';
  if (item.type === 'task') {
    if (item.dueDate) {
      dateTimeRow = row('Due Date', fmtDisplayDate(item.dueDate));
      if (item.startDate) {
        timeframeRow = row('Timeframe', `${fmtDisplayDate(item.startDate)} ${_dtDash} ${fmtDisplayDate(item.dueDate)}`);
      }
    } else if (item.startDate) {
      dateTimeRow = row('Start Date', fmtDisplayDate(item.startDate));
    }
  } else if (item.type === 'event') {
    if (item.date) {
      const timeVal = fmtDetailTime(item.time, item.endTime);
      dateTimeRow = row('Date and Time', timeVal ? `${fmtDisplayDate(item.date)} ${_dtDot} ${timeVal}` : fmtDisplayDate(item.date));
    }
  } else { // entry
    if (item.date) {
      const timeVal = item.time ? fmtTime(item.time) : '';
      dateTimeRow = row('Date and Time', timeVal ? `${fmtDisplayDate(item.date)} ${_dtDot} ${timeVal}` : fmtDisplayDate(item.date));
    }
  }

  // P4-R013a-fix5: the Completed/Done terminal timestamp is no longer a
  // Details-section row (fix4's interpretation, undone here per owner
  // review) — it now renders inline in the header next to the Status chip
  // instead (see buildModalDetailHeader). Nothing else here builds a
  // timestamp row any more; non-terminal items already showed no such row
  // before fix4 and still show none.
  // P4-R011b: Event color swatch removed from TEE Detail (discovery basis
  // P4-D021a) — no dot renders before the title for any Event, including
  // legacy Events that already have a saved Color value. buildModalDetailHeader's
  // colorSwatch parameter is left in place (its own default is already ''),
  // simply no longer passed a non-empty value from here.

  // P4-R013a: TEE Detail section grouping (discovery basis P4-D023) — the
  // former single flat .detail-grid card is replaced by the same
  // .tee-section-header/.tee-field-group section-card language Add/Edit
  // already uses (Details/Assign/Context/Execution), reusing every
  // existing field-rendering helper/row unchanged. Each section's content
  // is computed first, then wrapped only if non-empty — an empty section
  // renders nothing at all, matching the owner-approved "hide a whole
  // section if it would have no visible content" rule. Field membership,
  // visibility rules, Links (P4-R012b/-fix1, untouched), and the archived-
  // Subtasks branch are all otherwise identical to the pre-P4-R013a markup.
  const section = (title, content) => content
    ? `<div class="tee-section-header">${title}</div><div class="tee-field-group">${content}</div>`
    : '';

  // P4-R013a-fix1: Status moved out of the Details section body into the
  // header's Row 2 chip row (see buildModalDetailHeader) — no longer part
  // of detailsContent. Its exact id/onclick/color logic was reproduced
  // inline in buildModalDetailHeader so the existing in-place
  // status-button-update selector (`#detail-status-btn-<id>, [onclick*=...]`)
  // keeps matching either way. (P4-R013c: the now-unreachable
  // _buildDetailStatusRow this section used to call has been removed —
  // discovery basis P4-D024, zero call sites re-confirmed before removal.)
  // P4-R013a-fix2: Description/Notes label+box are now each wrapped in a
  // single container div, so .tee-field-group's own gap (a single flex
  // "gap" between direct children) is the only space between a row above
  // and the label — the label-to-box distance is controlled purely by the
  // label's own small margin-bottom, instead of the two compounding
  // (gap + margin) as in r013a-fix1. This is what "tighten gap between
  // Description/Notes label and its box" actually required.
  const detailsContent = [
    dateTimeRow,
    timeframeRow,
    item.desc ? `<div><div style="margin:0 0 3px;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.6px">Description</div>
      <div style="font-size:13px;color:var(--text2);line-height:1.6;padding:8px 10px;background:var(--glass);border:1px solid var(--border);border-radius:10px">${item.desc}</div></div>` : ''
  ].join('');

  // P4-R013b: Assign section now shows read-only people chips instead of
  // the plain formatAssigneesDisplay() text (discovery basis P4-D023, owner
  // go-ahead) — see _buildDetailPeopleChips above. Always returns non-empty
  // HTML (a muted "No assignees"/"No participants" fallback when there are
  // none), matching -fix5's existing always-render-the-Assign-card behavior
  // (formatAssigneesDisplay likewise always returned at least '—' before).
  // P4-R014: passes isArchived through so a clickable chip's Person Detail
  // "return to this TEE Detail" closure reopens with the correct
  // active/archived state (discovery basis P4-D025).
  const assignContent = _buildDetailPeopleChips(item, isArchived);

  // P4-R013a-fix3: Context order corrected per owner visual review
  // (discovery basis P4-D023) — Department, Project, Category, Tags, Notes,
  // Links (was Category, Project, Department, Tags, Notes, Links). Tags
  // stays between Category and Notes, unchanged behavior/position relative
  // to Notes/Links; only Department/Project/Category were reordered.
  const contextContent = [
    row('Department', item.dept),
    row('Project', item.project),
    row('Category', item.category),
    _buildDetailTagRow(item.tags, `openTEEDetail('${item.id}')`),
    item.notes ? `<div><div style="margin:0 0 3px;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.6px">Notes</div>
      <div style="font-size:13px;color:var(--text2);line-height:1.6;padding:8px 10px;background:var(--glass);border:1px solid var(--border);border-radius:10px">${item.notes}</div></div>` : '',
    _buildTEELinksDetailSection(item.links)
  ].join('');

  // P4-R013c: the archived branch used to hand-inline a duplicate of
  // _buildSubtaskSection/_buildSubtaskRows' own markup directly here
  // (discovery basis P4-D024) — that duplicate put onclick="toggleSubtask(...)"
  // on the *entire* row (wider than the active path's checkbox-only handler)
  // even though toggleSubtask() always silently no-ops for an archived item
  // (its STATE.items.find(...) lookup can never match one), producing a row
  // that visually hovered/looked clickable but did nothing. Both branches now
  // call the same shared helper — active unchanged (`_buildSubtaskSection(item,
  // false)`, still 2 args, still exactly the interactive/editable rendering
  // it always was), archived now genuinely read-only via the new third
  // argument (`_buildSubtaskSection(item, false, true)`): no row/checkbox
  // onclick, no delete button, no add-row, zero subtasks still renders
  // nothing (identical to the prior archived empty-state), and checked/done
  // visuals, text, and doneAt timestamps all render exactly as before.
  const executionContent = _buildSubtaskSection(item, false, isArchived);

  // P4-R013a-fix1: TEE Detail shell/spacing correction (discovery basis
  // P4-D023, owner visual review of P4-R013a) — header and footer now sit
  // outside a dedicated scrollable body region (.tee-detail-shell/
  // .tee-detail-body, Detail-specific, no shared selectors with Add/Edit's
  // .tee-modal-shell/.tee-modal-form-scroll/.tee-modal-footer). The footer
  // itself is still the exact same .modal-actions markup/behavior as
  // before (Back/Archive/Edit/Restore, identical onclick handlers) — only
  // its position in the DOM (sibling after .tee-detail-body, instead of
  // inline within the scrolling flow) changed, via a narrow
  // `.tee-detail-shell > .modal-actions` CSS selector that does not touch
  // .modal-actions' own base rule (see CSS block).
  openModal(`
    <div class="tee-detail-shell">
      ${buildModalDetailHeader(item, typeIcon, typeLabel, pri)}

      <div class="tee-detail-body">
        ${section('Details', detailsContent)}
        ${section('Assign', assignContent)}
        ${section('Context', contextContent)}
        ${section('Execution', executionContent)}

        ${item.archivedDate ? `<div style="margin-bottom:12px;padding:8px 12px;background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.2);border-radius:10px;font-size:12px;color:var(--yellow)">Archived ${fmtDisplayDate(item.archivedDate)} · ${item.archivedBy || 'auto'}</div>` : ''}
      </div>

      <div class="modal-actions" style="margin-top:18px">
        ${_backBtn()}
        ${isArchived
          ? `<button class="btn-primary" onclick="restoreFromArchive('${item.id}')">Restore to Active</button>`
          : `<div style="display:flex;gap:8px">
               <button class="btn-ghost" onclick="archiveItem('${item.id}')">Archive</button>
               <button class="btn-primary" onclick="_navTo(()=>openTEEDetail('${item.id}'),()=>openTEEModal('${item.id}'))">Edit</button>
             </div>`
        }
      </div>
    </div>`);
}

// ── TEE type-zone helpers (P4-R004) — extracted from _renderTEEModal and switchTEEType ──
function _buildTEEIdentityFields(type, item, defaultStatus) {
  // P4-R008b: Relocated from the former _buildTEEDetailsTop into the unified top
  // "identity bar" (Title → Type/Priority/Status → Details) per P4-D017, replacing
  // the r008a grid-based exploration (unaccepted). Status and Priority no longer
  // render inside the Details group, and their visible triggers are now restyled
  // as compact pill-shaped dropdown buttons (.tee-identity-pill, matching the
  // app's existing subfilter-pill visual language, e.g. .kb-dropdown-btn's "All
  // Dates ▼") instead of full-width .form-select-styled buttons. Markup/IDs/
  // value-holder contract is otherwise unchanged from P4-R006-fix1/P4-R007-fix1:
  // the hidden #tee-status/#tee-priority inputs remain the real value-bearing
  // elements saveTEEModal() reads via document.getElementById(...)?.value — only
  // visual styling and DOM position changed, plus the internal order swapped to
  // Priority-then-Status (was Status-then-Priority) to match the owner-approved
  // Type / Priority / Status bar order from P4-D017.
  // P4-R006-fix1: default Task status is now 'To Do' (owner request; was 'Backlog'),
  // and the resolved status is normalized for `type` via _normalizeTEEStatusForType
  // — this is what stops an Entry's 'Open' (or any other type's status) from
  // silently surviving a type switch as an invalid Task status, and vice versa.
  if (type === 'task') {
    const _rawStatus = parseStatus(item?.status || defaultStatus || 'To Do').state || 'To Do';
    const _curStatus = _normalizeTEEStatusForType('task', _rawStatus);
    return `
    <input type="hidden" id="tee-priority" value="${item?.priority||'Medium'}">
    <div class="tee-identity-group">
      <span class="tee-side-label">Priority</span>
      <button type="button" id="tee-priority-trigger" class="tee-identity-pill tee-priority-trigger" onclick="openTEEPriorityDropdown(this, event)">
        <span class="tee-identity-pill-main">
          <span class="status-dot" id="tee-priority-trigger-dot" style="background:${getPri(item?.priority||'Medium').bar}"></span>
          <span id="tee-priority-trigger-label" class="tee-identity-pill-label">${item?.priority||'Medium'}</span>
        </span>
        <span class="tee-identity-pill-chevron">&#9660;</span>
      </button>
    </div>
    <input type="hidden" id="tee-status" value="${_curStatus}">
    <div class="tee-identity-group">
      <span class="tee-side-label">Status</span>
      <button type="button" id="tee-status-trigger" class="tee-identity-pill tee-status-trigger" onclick="openTEEStatusDropdown('${type}', this, event)">
        <span class="tee-identity-pill-main">
          <span class="status-dot" id="tee-status-trigger-dot" style="background:${getStatusColor(_curStatus)}"></span>
          <span id="tee-status-trigger-label" class="tee-identity-pill-label">${_curStatus}</span>
        </span>
        <span class="tee-identity-pill-chevron">&#9660;</span>
      </button>
    </div>`;
  }
  const _rawStatus = parseStatus(item?.status||defaultStatus||'Open').state||'Open';
  const _curStatus = _normalizeTEEStatusForType(type, _rawStatus);
  return `
    <input type="hidden" id="tee-priority" value="${item?.priority||'Medium'}">
    <div class="tee-identity-group">
      <span class="tee-side-label">Priority</span>
      <button type="button" id="tee-priority-trigger" class="tee-identity-pill tee-priority-trigger" onclick="openTEEPriorityDropdown(this, event)">
        <span class="tee-identity-pill-main">
          <span class="status-dot" id="tee-priority-trigger-dot" style="background:${getPri(item?.priority||'Medium').bar}"></span>
          <span id="tee-priority-trigger-label" class="tee-identity-pill-label">${item?.priority||'Medium'}</span>
        </span>
        <span class="tee-identity-pill-chevron">&#9660;</span>
      </button>
    </div>
    <input type="hidden" id="tee-status" value="${_curStatus}">
    <div class="tee-identity-group">
      <span class="tee-side-label">Status</span>
      <button type="button" id="tee-status-trigger" class="tee-identity-pill tee-status-trigger" onclick="openTEEStatusDropdown('${type}', this, event)">
        <span class="tee-identity-pill-main">
          <span class="status-dot" id="tee-status-trigger-dot" style="background:${getStatusColor(_curStatus)}"></span>
          <span id="tee-status-trigger-label" class="tee-identity-pill-label">${_curStatus}</span>
        </span>
        <span class="tee-identity-pill-chevron">&#9660;</span>
      </button>
    </div>`;
}

function _buildTEEAssignFields(type, item, assignees) {

    </div>`;
}
