    if (col && direction) {
      const outClass = direction === 'up' ? 'sliding-up' : 'sliding-down';
      const inClass  = direction === 'up' ? 'sliding-in-down' : 'sliding-in-up';
      col.classList.add(outClass);
      window._gtCooldown = true;
      setTimeout(() => {
        col.classList.remove(outClass);
        renderOverview();
        // Apply slide-in after render
        const col2 = document.getElementById('gt-main-col');
        if (col2) {
          col2.classList.add(inClass);
          setTimeout(() => col2.classList.remove(inClass), 160);
        }
        setTimeout(() => { window._gtCooldown = false; }, 800);
      }, 150);
    } else {
      renderOverview();
    }
  };

  window._toggleGtSub = (subKey) => {
    if (window._gtSubs.has(subKey)) {
      window._gtSubs.delete(subKey);
    } else {
      window._gtSubs.add(subKey);
    }
    renderOverview();
  };

  // ── OVERSCROLL CAROUSEL HANDLER ──────────────────────────────────────────
  // Carousel order: today (middle) ↔ alltasks (above) ↔ upcoming (below)
  // Scrolling up past top → go to alltasks; scrolling down past bottom → go to upcoming
  // Wraps: alltasks ↔ upcoming when at boundaries of those groups
  const carouselOrder = ['alltasks', 'today', 'upcoming'];
  window._gtOverscroll = (direction) => {
    if (window._gtCooldown) return;
    const idx = carouselOrder.indexOf(window._gtGroup);
    if (direction === 'up' && idx > 0) {
      window._setGtGroup(carouselOrder[idx - 1], 'up');
    } else if (direction === 'up' && idx === 0) {
      // Wrap: alltasks → upcoming (going up from alltasks wraps to upcoming)
      window._setGtGroup('upcoming', 'up');
    } else if (direction === 'down' && idx < carouselOrder.length - 1) {
      window._setGtGroup(carouselOrder[idx + 1], 'down');
    } else if (direction === 'down' && idx === carouselOrder.length - 1) {
      // Wrap: upcoming → alltasks
      window._setGtGroup('alltasks', 'down');
    }
  };

  // ── Helper: navigate to planner tab ─────────────────────────────────────────
  window._goPlanner = () => {
    const btn = document.querySelector('.sidebar-btn[data-page="page-planner"]');
    if (btn) btn.click();
  };

  // ── PRIMARY PILL BUILDER ──────────────────────────────────────────────────
  const _isLightTheme = !isDarkTheme();
  const mkPrimaryPill = (key, count, label, hex) => {
    const active = group === key;
    const bgAlpha = _isLightTheme ? '20' : '18';
    return `<button class="gt-primary-pill${active ? ' active' : ''}"
      style="${active ? `border-color:${hex};color:${hex};background:${hex}${bgAlpha};` : ''}"
      onclick="window._setGtGroup('${key}', null)">
      <span class="gt-primary-pill-num" style="color:${active ? hex : 'var(--text2)'}">${count}</span>
      <span>${label}</span>
    </button>`;
  };

  // ── SUB-FILTER PILL BUILDER ───────────────────────────────────────────────
  const mkSubPill = (key, count, label, hex) => {
    if (count === 0) return ''; // hide if no items
    const active = subs.has(key);
    const bgAlpha = _isLightTheme ? '20' : '18';
    return `<button class="gt-sub-pill${active ? ' active' : ''}"
      style="${active ? `border-color:${hex};color:${hex};background:${hex}${bgAlpha};` : ''}"
      onclick="window._toggleGtSub('${key}')">
      <span class="gt-sub-pill-num" style="color:${active ? hex : 'var(--text2)'}">${count}</span>
      <span>${label}</span>
    </button>`;
  };

  // ── PILL STRIP HTML ───────────────────────────────────────────────────────
  const _pillHex = {
    today:    _isLightTheme ? '#0F766E' : '#4F9AB5',
    done:     _isLightTheme ? '#166534' : '#34D399',
    alltasks: _isLightTheme ? '#0E7490' : '#38BDF8',
    upcoming: _isLightTheme ? '#166534' : '#34D399',
    tasks:    _isLightTheme ? '#0F766E' : '#4F9AB5',
    events:   _isLightTheme ? '#0891B2' : '#22D3EE',
    entries:  _isLightTheme ? '#B45309' : '#FBBF24',
    hipri:    _isLightTheme ? '#DC2626' : '#F87171',
    inprog:   _isLightTheme ? '#7C3AED' : '#C084FC',
    overdue:  _isLightTheme ? '#DC2626' : '#F87171',
  };

  // Sub-filters per group
  let subPillsHTML = '';
  if (group === 'today') {
    const _doneDivider = cTodayDone > 0
      ? `<span style="width:1px;height:16px;background:var(--border);margin:0 2px;display:inline-block;vertical-align:middle;flex-shrink:0"></span>`
      : '';
    subPillsHTML =
      mkSubPill('tasks',   cTodayTasks,   'TASKS',   _pillHex.tasks)   +
      mkSubPill('events',  cTodayEvents,  'EVENTS',  _pillHex.events)  +
      mkSubPill('entries', cTodayEntries, 'ENTRIES', _pillHex.entries) +
      _doneDivider +
      mkSubPill('done', cTodayDone, 'DONE', _pillHex.done);
  } else if (group === 'alltasks') {
    subPillsHTML =
      mkSubPill('hipri',   cHiPri,  'HIGH PRIORITY', _pillHex.hipri)  +
      mkSubPill('inprog',  cInProg, 'IN PROGRESS',   _pillHex.inprog) +
      mkSubPill('overdue', cOverdue,'OVERDUE',        _pillHex.overdue);
  } else if (group === 'upcoming') {
    subPillsHTML =
      mkSubPill('tasks',   cUpTasks,   'TASKS',   _pillHex.tasks)   +
      mkSubPill('events',  cUpEvents,  'EVENTS',  _pillHex.events)  +
      mkSubPill('entries', cUpEntries, 'ENTRIES', _pillHex.entries);
  }
  // If all sub-pills returned empty string (all zeros), hide the sub strip
  const hasSubPills = subPillsHTML.trim().length > 0;

  const pillStripHTML = `
    <div class="gt-pill-strip">
      ${mkPrimaryPill('today',    cTodayAll,  'TODAY',    _pillHex.today)}
      ${mkPrimaryPill('alltasks', cAllTasks,  'OPEN TASKS',_pillHex.alltasks)}
      ${mkPrimaryPill('upcoming', cUpcoming,  'UPCOMING', _pillHex.upcoming)}
    </div>
    <div class="gt-subpill-strip visible">
      ${subPillsHTML}
      <button class="gt-new-btn" onclick="openTEEModal(null,'task','${todayStr}')">+ New Task</button>
    </div>`;

  // ── DAY DIVIDER BUILDER ───────────────────────────────────────────────────
  const buildDayDivider = (dateStr, count, isWeekBoundary) => {
    if (count === 0) return ''; // hide if no items
    const d = new Date(dateStr + 'T00:00:00');
    const label = d.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});
    const countBadge = `<span class="${isWeekBoundary?'gt-week-boundary-count':'gt-day-hdr-count'}">${count} item${count!==1?'s':''}</span>`;
    return `<div class="${isWeekBoundary?'gt-week-boundary':'gt-day-hdr'}">
      <span>${isWeekBoundary ? '📅 ' : ''}${label}</span>
      ${countBadge}
    </div>`;
  };

  // ── SORT HELPERS ──────────────────────────────────────────────────────────
  const PRIORITY_ORDER = { Critical:0, High:1, Medium:2, Low:3 };
  const STATUS_ORDER   = { 'In Progress':0, Review:1, 'To Do':2, Backlog:3 };
  const sortByProximityThenPriority = (a, b) => {
    const da = a.dueDate || a.startDate || '9999-99-99';
    const db = b.dueDate || b.startDate || '9999-99-99';
    if (da !== db) return da < db ? -1 : 1;
    const pa = PRIORITY_ORDER[a.priority] ?? 99;
    const pb = PRIORITY_ORDER[b.priority] ?? 99;
    if (pa !== pb) return pa - pb;
    const sa = STATUS_ORDER[a.status] ?? 99;
    const sb = STATUS_ORDER[b.status] ?? 99;
    return sa - sb;
  };
  const sortForToday = (a, b) => {
    // Type order: task first, then event, then entry
    const typeOrd = {task:0, event:1, entry:2};
    const ta = typeOrd[a.type] ?? 3, tb = typeOrd[b.type] ?? 3;
    if (ta !== tb) return ta - tb;
    // Time within type
    const tma = a.time || '99:99', tmb = b.time || '99:99';
    if (tma !== tmb) return tma < tmb ? -1 : 1;
    // Priority last
    return (PRIORITY_ORDER[a.priority]??99) - (PRIORITY_ORDER[b.priority]??99);
  };

  // ── BUILD CARD ─────────────────────────────────────────────────────────────
  const buildGtCard = (item) => {
    // Unified chip/badge system
    const evBorder      = _buildAccentBorder(item.priority);
    const priorityBadge = _buildPriorityBadge(item);
    const statusBadge   = _buildStatusBadge(item);
    const typeBadge2    = _buildTypeBadge(item.type);
    const dueChip       = item.type === 'task' ? _buildCounterChip(item.dueDate) : '';
    const ctxChips      = item.type === 'task' ? _buildContextChips(item) : '';
    // Tags
    const allTags  = (item.tags||[]).slice(0,6);
    const tagsRow1 = allTags.slice(0,3);
    const tagsRow2 = allTags.slice(3);
    const mkTag    = tag => _buildTagChip(tag);
    // Subtask chip
    const subtaskChip = _subtaskChip(item);
    // Category badge (Today tab specific)

    // Meta right — done time or date/time
    const dateDisplay = item.type==='task' ? (item.dueDate||'') : (item.date||'');
    const timeDisplay = item.time ? fmtTime(item.time) : '';
    const { state: _mState, doneAt: _doneAt } = parseStatus(item.status);
    let metaRight;
    if ((_mState === 'Completed' || _mState === 'Done') && _doneAt) {
      const _dp = _doneAt.split(' ');
      metaRight = 'Done at ' + (_dp[1] ? fmtTime(_dp[1]) : _doneAt);
    } else {
      metaRight = [timeDisplay, dateDisplay].filter(Boolean).join(' · ');
    }
    return `<div class="gt-card" onclick="openTEEDetail('${item.id}')" style="${evBorder}">
      <div class="gt-card-row1">
        ${typeBadge2}${priorityBadge}${statusBadge}
        <span class="gt-card-row1-right" style="display:flex;align-items:center;gap:4px">
          ${ctxChips}${subtaskChip}
        </span>
      </div>
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin:4px 0 2px">
        <div class="gt-card-title" style="margin:0;flex:1;min-width:0">${item.title}</div>
        ${tagsRow1.length ? `<div style="display:flex;gap:3px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;max-width:50%">${tagsRow1.map(mkTag).join('')}</div>` : ''}
      </div>
      ${(!!item.desc||tagsRow2.length) ? `<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px">
        ${item.desc ? `<div class="gt-card-desc-sm" style="flex:1;min-width:0">${item.desc}</div>` : '<div></div>'}
        ${tagsRow2.length ? `<div style="display:flex;gap:3px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;max-width:50%">${tagsRow2.map(mkTag).join('')}</div>` : ''}
      </div>` : ''}
      <div class="gt-card-footer">
        <div class="gt-card-footer-left">${renderAssigneeStack(item.assignees||'', false, item.type)}</div>
        <div class="gt-card-footer-right">
          ${dueChip}${metaRight ? `<span class="gt-card-meta">${metaRight}</span>` : ''}
        </div>
      </div>
    </div>`;
  };
  // ── MAIN CONTENT ──────────────────────────────────────────────────────────
  let mainHTML = '';
  const emptyToday    = `<div class="today-empty"><div style="font-size:40px;margin-bottom:10px">☀️</div><div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px">All Clear For Today!</div><div style="font-size:13px;color:var(--text2)">Enjoy the Day</div></div>`;
  const emptyOpenTasks = `<div class="today-empty"><div style="font-size:40px;margin-bottom:10px">👍</div><div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px">No Open Tasks!</div><div style="font-size:13px;color:var(--text2)">Jobs A Good'un</div></div>`;
  const emptyUpcoming  = `<div class="today-empty"><div style="font-size:40px;margin-bottom:10px">🔮</div><div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px">I Foresee Your Next 14 Days</div><div style="font-size:13px;color:var(--text2)">Are Clear</div></div>`;

  if (group === 'today') {
    // Sub-filter: if subs empty → show all; else show union of selected types
    let allTodayItems = [
      ...dueTasks.map(t =>    ({...t, _badge:'DUE Today', _badgeClass:'gt-badge-today'})),
      ...startTasks.map(t =>  ({...t, _badge:'Starting',  _badgeClass:'gt-badge-start'})),
      ...todayEvents.map(e => ({...e, _badge:'Event',     _badgeClass:'gt-badge-event'})),
      ...todayEntries.map(e =>({...e, _badge:'Entry',     _badgeClass:'gt-badge-entry'})),
    ];

    // Separate active and done
    const doneItems   = allTodayItems.filter(i => isCompletedToday(i, todayStr));
    let   activeItems = allTodayItems.filter(i => !isCompletedToday(i, todayStr));

    // Apply sub-filters to active list (type filters)
    // 'done' sub-pill controls done section visibility, not active list
    if (subs.size > 0 && !( subs.size === 1 && subs.has('done') )) {
      const typeFilters = new Set([...subs].filter(s => s !== 'done'));
      if (typeFilters.size > 0) {
        activeItems = activeItems.filter(i => {
          if (typeFilters.has('tasks')   && i.type === 'task')  return true;
          if (typeFilters.has('events')  && i.type === 'event') return true;
          if (typeFilters.has('entries') && i.type === 'entry') return true;
          return false;
        });
      }
    }
    activeItems.sort(sortForToday);

    // Build active cards
    const activeCards = activeItems.map(i => buildGtCard(i));

    // Done section — expanded when 'done' sub-pill is active
    const showDone = subs.has('done');
    let doneSectionHTML = '';
    if (doneItems.length > 0) {
      const doneCards = doneItems.map(i => {
        const { doneAt } = parseStatus(i.status);
        const doneLabel  = doneAt ? ('Done at ' + fmtTime(doneAt.split(' ')[1] || doneAt)) : 'Done';
        return `<div style="opacity:0.55">
          ${buildGtCard(i)}
        </div>`;
      }).join('');

      if (showDone) {
        doneSectionHTML = `
          <div class="gt-day-hdr" style="margin-top:14px;cursor:pointer"
            onclick="window._toggleGtSub('done')" title="Click to collapse">
            <span>✓ Completed today</span>
            <div style="display:flex;align-items:center;gap:6px">
              <span class="gt-day-hdr-count">${doneItems.length} item${doneItems.length!==1?'s':''}</span>
              <span style="font-size:11px;color:var(--muted)">‹ hide</span>
            </div>
          </div>
          <div class="gt-task-list">${doneCards}</div>`;
      } else {
        doneSectionHTML = `
          <div onclick="window._toggleGtSub('done')"
            style="display:flex;align-items:center;gap:8px;padding:10px 14px;margin-top:10px;
              border-radius:var(--radius-sm);border:1px dashed var(--border);
              background:var(--glass);cursor:pointer;font-size:12px;color:var(--text2)">
            <span style="font-size:14px">›</span>
            <span>${doneItems.length} completed today</span>
          </div>`;
      }
    }

    mainHTML = `<div class="gt-task-list">${activeCards.length ? activeCards.join('') : emptyToday}</div>${doneSectionHTML}`;

  } else if (group === 'alltasks') {
    // All incomplete tasks, sorted by proximity → priority → status
    let items = [...incompleteTasks];
    if (subs.size > 0) {
      items = items.filter(t => {
        if (subs.has('hipri')   && (t.priority==='Critical'||t.priority==='High')) return true;
        if (subs.has('inprog')  && (parseStatus(t.status).state==='In Progress'||parseStatus(t.status).state==='Review')) return true;
        if (subs.has('overdue') && t.dueDate && daysUntil(t.dueDate)<0) return true;
        return false;
      });
    }
    items.sort(sortByProximityThenPriority);

    // Group by proximity bucket with day dividers
    const buckets = new Map(); // dateStr → items[]
    items.forEach(t => {
      const key = t.dueDate || t.startDate || 'no-date';
      if (!buckets.has(key)) buckets.set(key, []);
      buckets.get(key).push(t);
    });
    // Overdue bucket
    const overdueBucket = items.filter(t => t.dueDate && daysUntil(t.dueDate)<0);
    const restBuckets   = new Map();
    items.filter(t => !t.dueDate || daysUntil(t.dueDate) >= 0).forEach(t => {
      const key = t.dueDate || t.startDate || 'no-date';
      if (!restBuckets.has(key)) restBuckets.set(key, []);
      restBuckets.get(key).push(t);
    });

    let blocks = '';
    if (overdueBucket.length) {
      const isDark = !_isLightTheme;
      const ovHex = isDark ? '#F87171' : '#DC2626';
      blocks += `<div class="gt-day-hdr" style="border-bottom-color:${ovHex}44;color:${ovHex}">
        <span>⚠ Overdue</span>
        <span class="gt-day-hdr-count" style="color:${ovHex};border-color:${ovHex}44;background:${ovHex}18">${overdueBucket.length} item${overdueBucket.length!==1?'s':''}</span>
      </div>`;
      blocks += `<div class="gt-task-list" style="margin-bottom:16px">${overdueBucket.map(t=>buildGtCard(t)).join('')}</div>`;
    }
    restBuckets.forEach((dayItems, dateStr) => {
      if (!dayItems.length) return;
      const badge = dateStr === todayStr ? 'DUE Today' : dateStr === 'no-date' ? '' : 'Due';
      const badgeClass = dateStr === todayStr ? 'gt-badge-today' : 'gt-badge-start';
      blocks += buildDayDivider(dateStr === 'no-date' ? null : dateStr, dayItems.length, false);
      if (dateStr === 'no-date') {
        blocks = blocks.replace(buildDayDivider(null, dayItems.length, false), '');
      }
      blocks += `<div class="gt-task-list" style="margin-bottom:12px">${dayItems.map(t=>buildGtCard(t)).join('')}</div>`;
    });
    mainHTML = blocks || (group === 'alltasks' ? emptyOpenTasks : emptyUpcoming);

  } else if (group === 'upcoming') {
    // Rolling 14 days, grouped by date with week boundary dividers
    let blocks = '';
    upcomingDays.forEach(dateStr => {
      let dayTasks   = incompleteTasks.filter(t => t.dueDate===dateStr || t.startDate===dateStr);
      let dayEvents  = allEvents.filter(e => e.date===dateStr);
      let dayEntries = allEntries.filter(e => e.date===dateStr);

      // Apply sub-filters
      if (subs.size > 0) {
        if (!subs.has('tasks'))   dayTasks   = [];
        if (!subs.has('events'))  dayEvents  = [];
        if (!subs.has('entries')) dayEntries = [];
      }

      const dayCount = dayTasks.length + dayEvents.length + dayEntries.length;
      if (dayCount === 0) return; // skip empty days

      // Check if this date is a Monday (week boundary — Sunday just passed)
      const d = new Date(dateStr + 'T00:00:00');
      const isMonday = d.getDay() === 1;

      blocks += buildDayDivider(dateStr, dayCount, isMonday);

      // Sort: tasks → events → entries, then time, then priority
      const items = [
        ...dayTasks.sort(sortByProximityThenPriority).map(t => ({...t, _badge: t.dueDate===dateStr?'Due':'Starting', _bc: 'gt-badge-start'})),
        ...dayEvents.sort((a,b) => (a.time||'99:99') < (b.time||'99:99') ? -1 : 1).map(e => ({...e, _badge:'Event', _bc:'gt-badge-event'})),
        ...dayEntries.map(e => ({...e, _badge:'Entry', _bc:'gt-badge-entry'})),
      ];
      blocks += `<div class="gt-task-list" style="margin-bottom:12px">${items.map(i => buildGtCard(i)).join('')}</div>`;
    });
    mainHTML = blocks || (group === 'alltasks' ? emptyOpenTasks : emptyUpcoming);
  }

  // ── OVERSCROLL: re-attach listeners after every render ─────────────────
  // gt-main-col is recreated each render — use rAF to attach after DOM settles
  // Clone node to cleanly remove any stale listeners before re-attaching
  requestAnimationFrame(() => {
    const col = document.getElementById('gt-main-col');
    if (!col) return;
    // Replace node with clone to strip stale event listeners
    const fresh = col.cloneNode(true);
    col.parentNode.replaceChild(fresh, col);
    const c = document.getElementById('gt-main-col');
    if (!c) return;

    // Desktop — wheel boundary detection
    c.addEventListener('wheel', (e) => {
      if (window._gtCooldown) return;
      const atTop    = c.scrollTop <= 0;
      const atBottom = c.scrollTop + c.clientHeight >= c.scrollHeight - 2;
      if (atTop && e.deltaY < 0) {
        e.preventDefault(); window._gtOverscroll('up');
      } else if (atBottom && e.deltaY > 0) {
        e.preventDefault(); window._gtOverscroll('down');
      }
    }, { passive: false });

    // Mobile — touch boundary detection (60px threshold)
    let _ty = 0, _ts = 0;
    c.addEventListener('touchstart', (e) => {
      _ty = e.touches[0].clientY; _ts = c.scrollTop;
    }, { passive: true });
    c.addEventListener('touchend', (e) => {
      if (window._gtCooldown) return;
      const dy = _ty - e.changedTouches[0].clientY;
      if (_ts <= 0 && dy < -60)
        window._gtOverscroll('up');
      else if (_ts + c.clientHeight >= c.scrollHeight - 2 && dy > 60)
        window._gtOverscroll('down');
    }, { passive: true });
  });

     // ── Pinned notes panel ──
  const buildPinnedNotesPanel = () => {
    const pinnedNotes = [...STATE.stickies].filter(s=>s.pinned)
      .sort((a,b)=>(parseInt((b.id||'').replace(/\D/g,''),10)||0)-(parseInt((a.id||'').replace(/\D/g,''),10)||0));

    return `<div class="gt-panel-card gt-notes-card">
    <div class="gt-panel-hdr" style="flex-shrink:0">
      <span class="gt-panel-title">📌 Pinned Notes</span>
      <button class="btn-ghost" style="height:24px;padding:0 8px;font-size:11px" onclick="openPinnedNoteModal()">+ Pinned Note</button>
    </div>
    <div class="gt-notes-list">
    ${pinnedNotes.length===0
      ? `<div style="text-align:center;padding:16px 8px;color:var(--muted);font-size:12px">No pinned notes yet.<br><button class="btn-ghost" style="margin-top:8px;height:26px;padding:0 10px;font-size:11px" onclick="openPinnedNoteModal()">+ Add Note</button></div>`
      : pinnedNotes.map((s,idx)=>{
          const c = getStickyColor(s.colorIdx);
          const noteId = `gpn-${idx}`;
          return `<div class="gt-pin-note" style="background:${c.bg};color:${c.text}">
            <button class="gt-pin-unpin" onclick="toggleNotePin('${s.id}',false)">📌</button>
            <div id="${noteId}" style="font-size:11px;line-height:1.55;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden">${s.text}</div>
            ${s.text.length>120?`<button onclick="togglePinExpand('${noteId}',this)" style="background:none;border:none;font-size:10px;color:${c.text};opacity:0.65;cursor:pointer;padding:2px 0;font-family:var(--font);display:block;margin-top:3px">▼ more</button>`:''}
          </div>`;
        }).join('')
    }
    </div>
  </div>`;
  };
  const pinnedPanelHTML = buildPinnedNotesPanel();

  // ── Mini calendar ──
  const buildMiniCalendar = () => {
    const yr = TODAY.getFullYear(), mo = TODAY.getMonth();
    const firstDay  = new Date(yr,mo,1).getDay();
    const daysInMo  = new Date(yr,mo+1,0).getDate();
    const prevDays  = new Date(yr,mo,0).getDate();
    const moLabel   = TODAY.toLocaleDateString('en-US',{month:'long',year:'numeric'});
    const dayLabels = ['S','M','T','W','T','F','S'].map(d=>`<div class="gt-mc-dlbl">${d}</div>`).join('');
    // Build activity map — single blue dot only
    const actMap = {};
    STATE.items.forEach(item=>{
      const d = item.dueDate||item.startDate||item.date||'';
      if(!d||!d.startsWith(`${yr}-${String(mo+1).padStart(2,'0')}`)) return;
      const day = parseInt(d.split('-')[2],10);
      actMap[day] = true;
    });
    let cells = '';
    for(let i=firstDay-1;i>=0;i--) cells+=`<div class="gt-mc-cell other">${prevDays-i}</div>`;
    for(let d=1;d<=daysInMo;d++){
      const isToday=d===TODAY.getDate();
      const has=actMap[d];
      const cls=['gt-mc-cell',isToday?'today-mc':'',has?'has-items':''].filter(Boolean).join(' ');
      const dateStr=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      cells+=`<div class="${cls}" onclick="openDayList('${dateStr}')" title="${dateStr}">${d}</div>`;
    }
    const total=Math.ceil((firstDay+daysInMo)/7)*7;
    for(let i=1;i<=total-firstDay-daysInMo;i++) cells+=`<div class="gt-mc-cell other">${i}</div>`;
    return `<div class="gt-panel-card gt-mini-cal">
      <div class="gt-panel-hdr">
        <span class="gt-panel-title">📅 ${moLabel}</span>
        <button class="btn-ghost" style="height:22px;padding:0 8px;font-size:11px" onclick="window._goPlanner()">Full →</button>
      </div>
      <div class="gt-mc-grid">${dayLabels}${cells}</div>
      <div class="gt-mc-legend"><span><i style="background:var(--accent2)"></i>Has items</span></div>
    </div>`;
  };
  const miniCalHTML = buildMiniCalendar();

  // ── Today header: bold title left, date right ──
  const todayDateStr = TODAY.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});

  document.getElementById('overviewSection').innerHTML = `
    <div class="gt-hero">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap">
        <div class="gt-hero-title">${
          group==="today"
            ? 'Today Overview'
            : group==="alltasks"
              ? '<span>Open Tasks</span><em> · Full List</em>'
              : '<span>Upcoming</span><em> · Next 14 Days</em>'
        }</div>
        <div style="font-size:15px;color:var(--text2);font-weight:500;white-space:nowrap;letter-spacing:-0.01em">${todayDateStr}</div>
      </div>
    </div>
    <div class="gt-layout">
      <div class="gt-main-col" id="gt-main-col">
        ${pillStripHTML}
        ${mainHTML}
      </div>
      <div class="gt-right-col">
        <div class="gt-notes-section">${pinnedPanelHTML}</div>
        <div class="gt-cal-section">${miniCalHTML}</div>
      </div>
    </div>`;
}

// ═══════════════════════════════════════════════════════════
// PLANNER — Weekly grid view + Monthly calendar view
// Supports sort (Default / Priority / By Time) and archive mode
// ═══════════════════════════════════════════════════════════
function getWeekStart(offset) {
  const now = new Date();
  const weekStart = new Date(now);
  weekStart.setDate(now.getDate() - ((now.getDay()+6)%7) + (offset * 7));
  weekStart.setHours(0,0,0,0);
  return weekStart;
}

// plannerView is now part of STATE directly

/* Sort items for planner display according to STATE.plannerSort:
   'default' → Due tasks first, then time-based (events+entries by time), then start-date tasks
   'priority' → All items by priority (Critical→Low), time-based still uses time within same priority
   'time'     → All items with a time sorted by time; due/start tasks at bottom */

function sortPlannerItems(dueTasks, startTasks, timedItems) {
  const sort = STATE.plannerSort || 'default';

  if (sort === 'default') {
    // Due → timed (events+entries by time) → start
    const timed = timedItems.slice().sort((a,b) => (a.time||'').localeCompare(b.time||''));
    return [...dueTasks, ...timed, ...startTasks];
  }
  if (sort === 'priority') {
    const all = [...dueTasks, ...timedItems, ...startTasks];
    return all.sort((a,b) => {
      const pd = (PRIORITY_ORDER[a.priority]??3) - (PRIORITY_ORDER[b.priority]??3);
      if (pd !== 0) return pd;
      return (a.time||'').localeCompare(b.time||'');
    });
  }
  if (sort === 'time') {
    // Time-based items first sorted by time, due/start at bottom
    const timed = timedItems.slice().sort((a,b) => (a.time||'').localeCompare(b.time||''));
    return [...timed, ...dueTasks, ...startTasks];
  }
  return [...dueTasks, ...timedItems, ...startTasks];
}

// ── Planner navigation helpers ──────────────────────────────────────
function _plannerPrev() {
  const v = STATE.plannerView;
  if (v === 'month') calNav(-1);
  else if (v === 'week') changeWeek(-1);
  else { STATE.plannerDayOffset -= 1; renderPlanner(); }
}

function _plannerNext() {
  const v = STATE.plannerView;
  if (v === 'month') calNav(1);
  else if (v === 'week') changeWeek(1);
  else { STATE.plannerDayOffset += 1; renderPlanner(); }
}

function _plannerToday() {
  // Always navigate to Day View of today regardless of current view
  STATE.plannerView      = 'day';
  STATE.plannerDayOffset = 0;
  renderPlanner();
}

function _plannerGoDay(dateStr) {
  // Navigate to Day view for a specific date string (YYYY-MM-DD)
  const today    = new Date(fmtDate(TODAY) + 'T00:00:00');
  const target   = new Date(dateStr + 'T00:00:00');
  const diffMs   = target - today;
  const diffDays = Math.round(diffMs / 86400000);
  STATE.plannerView      = 'day';
  STATE.plannerDayOffset = diffDays;
  renderPlanner();
}

function changePlannerDay(dir) {
  STATE.plannerDayOffset = (STATE.plannerDayOffset || 0) + dir;
  renderPlanner();
}


function _plannerOpenItem(id) {
  openTEEDetail(id);
}

function _plannerSetView(v) {
  STATE.plannerView = v;
  STATE._plannerCellH = null; // reset on view change so height is re-measured
  renderPlanner();
}


function renderPlanner() {
  const container = document.getElementById('plannerSection');
  if (!container) return;
  try {

  // ── State defaults ─────────────────────────────────────────────────
  if (!STATE.plannerView)    STATE.plannerView    = 'month';
  if (!STATE.plannerFilter)  STATE.plannerFilter  = { tasks:true, events:true, entries:true };
  if (STATE.plannerDayOffset  == null) STATE.plannerDayOffset  = 0;
  if (STATE.plannerWeekOffset == null) STATE.plannerWeekOffset = 0;

  const view = STATE.plannerView;
  const pf   = STATE.plannerFilter;

  // ── Priority CSS class helper ───────────────────────────────────────
  // ── Theme + shared values ────────────────────────────────────────
  const _isLT = !isDarkTheme();
  const _bgA  = _isLT ? '20' : '18';

  const ppClass = p =>
    p==='Critical' ? 'pp-crit' :
    p==='High'     ? 'pp-high' :
    p==='Medium'   ? 'pp-med'  : 'pp-low';

// Priority sort order: Critical=0, High=1, Medium=2, Low=3, other=4
  const priOrder = p =>
    p==='Critical' ? 0 : p==='High' ? 1 : p==='Medium' ? 2 : p==='Low' ? 3 : 4;
  const sortByPriority = arr =>
    arr.slice().sort((a,b) => priOrder(a.priority) - priOrder(b.priority));

  // ── Nav label (adapts per view) ────────────────────────────────────
  let navLabel = '';
  if (view === 'month') {
    navLabel = MONTHS[STATE.calMonth] + ' ' + STATE.calYear;
  } else if (view === 'week') {
    const ws = getWeekStart(STATE.plannerWeekOffset);
    const we = new Date(ws); we.setDate(ws.getDate() + 6);
    const fmt = d => d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
    navLabel = fmt(ws) + ' — ' + fmt(we) + ', ' + ws.getFullYear();
  } else {
    const d = new Date(TODAY);
    d.setDate(d.getDate() + (STATE.plannerDayOffset || 0));
    navLabel = d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
  }

  // ── Filter pill counts (scoped to current view range) ──────────────
  let allInScope = [];
  if (view === 'month') {
    const y = STATE.calYear, m = STATE.calMonth;
    allInScope = STATE.items.filter(i => {
      const d = i.type === 'task' ? (i.dueDate || i.startDate) : i.date;
      if (!d) return false;
      const dt = new Date(d + 'T00:00:00');
      return dt.getFullYear() === y && dt.getMonth() === m;
    });
  } else if (view === 'week') {
    const ws    = getWeekStart(STATE.plannerWeekOffset);
    const we    = new Date(ws); we.setDate(ws.getDate() + 6);
    const wsStr = fmtDate(ws), weStr = fmtDate(we);
    allInScope = STATE.items.filter(i => {
      const d = i.type === 'task' ? (i.dueDate || i.startDate) : i.date;
      return d && d >= wsStr && d <= weStr;
    });
  } else {
    const d   = new Date(TODAY);
    d.setDate(d.getDate() + (STATE.plannerDayOffset || 0));
    const ds  = fmtDate(d);
    allInScope = STATE.items.filter(i => {
      const id = i.type === 'task' ? (i.dueDate || i.startDate) : i.date;
      return id === ds;
    });
  }
  const cntT  = allInScope.filter(i => i.type === 'task').length;
  const cntEv = allInScope.filter(i => i.type === 'event').length;
  const cntEn = allInScope.filter(i => i.type === 'entry').length;

  // ── Build shared header ─────────────────────────────────────────────
  const buildPlannerHeader = () => {
    const viewSubLabel = view === 'month' ? 'Month View'
                       : view === 'week'  ? 'Week View' : 'Day View';

    const _fHex = {
      tasks:   _isLT ? '#0F766E' : '#4F9AB5',
      events:  _isLT ? '#0891B2' : '#22D3EE',
      entries: _isLT ? '#B45309' : '#FBBF24',
    };
    const mkFP = (type, label, count) => {
      const active  = pf[type];
      const hex     = _fHex[type];
      const actSty  = active ? 'border-color:' + hex + ';color:' + hex + ';background:' + hex + _bgA + ';' : '';
      const cls     = active ? ' active ' + type : '';
      const oc      = 'STATE.plannerFilter[\''+type+'\']=!STATE.plannerFilter[\''+type+'\'];renderPlanner()';
      return '<button class="planner-fpill' + cls + '" style="' + actSty + '" onclick="' + oc + '">'
        + '<span class="planner-fpill-num" style="color:' + (active ? hex : 'var(--text2)') + '">' + count + '</span>'
        + ' ' + label.toUpperCase()
        + '</button>';
    };

    let hdr = '<div class="planner-hero">';

    // Hero title row
    hdr += '<div class="planner-hero-row">';
    hdr += '<span class="planner-hero-title">Planner</span>';
    hdr += '<span class="planner-hero-sub"> · ' + viewSubLabel + '</span>';
    hdr += '<button class="btn-primary" style="margin-left:auto;padding:6px 16px;'
         + 'border-radius:20px;font-size:11px;font-weight:600"'
         + ' onclick="openTEEModal(null,null,null)">+ Add item</button>';
    hdr += '</div>';

    // Nav row — [Month Week Day] [label] [‹ › Today]
    hdr += '<div class="planner-nav-row">';

    // Left: view pills
    hdr += '<div class="planner-view-pills">';
    const _vHex  = {
      month: _isLT ? '#0F766E' : '#4F9AB5',
      week:  _isLT ? '#0E7490' : '#38BDF8',
      day:   _isLT ? '#166534' : '#34D399',
    };
    const _vSty  = (v) => view === v
      ? 'border-color:' + _vHex[v] + ';color:' + _vHex[v] + ';background:' + _vHex[v] + _bgA + ';'
      : '';
    hdr += '<button class="planner-vpill' + (view === 'month' ? ' active' : '') + '"'
         + ' style="' + _vSty('month') + '"'
         + ' onclick="_plannerSetView(\'month\')">MONTH</button>';
    hdr += '<button class="planner-vpill' + (view === 'week'  ? ' active' : '') + '"'
         + ' style="' + _vSty('week') + '"'
         + ' onclick="_plannerSetView(\'week\')">WEEK</button>';
    hdr += '<button class="planner-vpill' + (view === 'day'   ? ' active' : '') + '"'
         + ' style="' + _vSty('day') + '"'
         + ' onclick="_plannerSetView(\'day\')">DAY</button>';
    hdr += '</div>';

    // Center: date label
    hdr += '<div class="planner-nav-center">' + navLabel + '</div>';

    // Right: arrows + Today
    hdr += '<div class="planner-nav-right">';
    hdr += '<button class="planner-nav-btn" onclick="_plannerPrev()" title="Previous">‹</button>';
    hdr += '<button class="planner-nav-btn" onclick="_plannerNext()" title="Next">›</button>';
    hdr += '<button class="planner-today-btn" onclick="_plannerToday()">TODAY</button>';
    hdr += '</div>';

    hdr += '</div>'; // end nav-row

    // Filter pills row
    // Open Tasks pill — Day view only, hidden when 0
    let openTasksPill = '';
    if (view === 'day') {
      const _dayOffset2 = STATE.plannerDayOffset || 0;
      const _dDay2 = new Date(TODAY); _dDay2.setDate(_dDay2.getDate() + _dayOffset2);
      const _dayDate2 = fmtDate(_dDay2);
      const _openStatuses2 = ['Backlog','To Do','In Progress','Review'];
      const _openCount = getTasks().filter(t => {
        const st = parseStatus(t.status).state;
        if (st === 'Completed') return false;
        if (t.dueDate === _dayDate2) return false;
        if (t.startDate === _dayDate2 && t.dueDate !== _dayDate2) return false;
        const isOverdue2 = t.dueDate && daysUntil(t.dueDate) < 0;
        return _openStatuses2.includes(st) || isOverdue2;
      }).length;
      if (_openCount > 0) {
        const _isOpen = STATE.plannerActiveTasksOpen;
        const _oc = 'STATE.plannerActiveTasksOpen=!STATE.plannerActiveTasksOpen;renderPlanner()';
        const _actSty = _isOpen
          ? 'border-color:#38BDF8;color:#38BDF8;background:rgba(56,189,248,0.12);'
          : '';
        openTasksPill = '<button class="planner-fpill" style="' + _actSty + '" onclick="' + _oc + '">'
          + '<span class="planner-fpill-num" style="color:' + (_isOpen?'#38BDF8':'var(--text2)') + '">' + _openCount + '</span>'
          + ' OPEN TASKS</button>';
      }
    }
    hdr += '<div class="planner-filter-row">';
    hdr += mkFP('tasks',   'Tasks',   cntT);
    hdr += mkFP('events',  'Events',  cntEv);
    hdr += mkFP('entries', 'Entries', cntEn);
    hdr += openTasksPill;
    hdr += '</div>';

    hdr += '</div>'; // end planner-hero

    return hdr;
  };
  const hdr = buildPlannerHeader();

  // ── MONTH VIEW ────────────────────────────────────────────────────
  if (view === 'month') {
    const yr = STATE.calYear;
    const mo = STATE.calMonth;
    const firstDay    = new Date(yr, mo, 1).getDay();
    const daysInMonth = new Date(yr, mo + 1, 0).getDate();
    const daysInPrev  = new Date(yr, mo, 0).getDate();
    const archiveMode = isArchivePeriod(yr + '-' + String(mo + 1).padStart(2,'0') + '-01');
    const archKey     = yr + '-' + String(mo + 1).padStart(2,'0');

    // If archive month not yet loaded, fetch then re-render
    if (archiveMode && !STATE.archiveCache[archKey] && !STATE.archiveCache._fetched) {
      container.innerHTML = hdr
        + '<div style="padding:24px;color:var(--muted);font-size:13px;text-align:center">'
        + '<i class="ti ti-loader" style="font-size:24px;opacity:0.4;display:block;margin-bottom:8px"></i>'
        + 'Loading archived month…</div>';
      fetchArchiveMonth(yr, mo).then(() => renderPlanner());
      return;
    }

    // Item source — archive cache or live STATE
    const itemsForDate = dateStr => {
      if (!archiveMode) return itemsOnDate(dateStr);
      return (STATE.archiveCache[archKey] || []).filter(i =>
        i.type === 'task' ? i.dueDate === dateStr : i.date === dateStr
      );
    };

    // Build a single cal-label chip — returns '' if filtered out
    const mkLabel = item => {
      if (!pf.tasks   && item.type === 'task')  return '';
      if (!pf.events  && item.type === 'event') return '';
      if (!pf.entries && item.type === 'entry') return '';
      const cls   = ppClass(item.priority);
      const title = (item.title || '').replace(/"/g, '&quot;');
      return '<span class="planner-cal-label ' + cls + '"'
           + ' onclick="event.stopPropagation();_plannerOpenItem(\''+item.id+'\');"'
           + ' title="' + title + '">' + title + '</span>';
    };

    // Build calendar cells
    let cellsHTML = '';
    let cellCount = 0;

    // Previous month overflow
    for (let i = firstDay - 1; i >= 0; i--) {
      cellsHTML += '<div class="planner-cal-cell other-month">'
        + '<div class="planner-cal-date-row">'
        + '<span class="planner-cal-date">' + (daysInPrev - i) + '</span>'
        + '</div></div>';
      cellCount++;
    }

    // Current month days
    for (let dd = 1; dd <= daysInMonth; dd++) {
      const dateStr  = yr + '-' + String(mo + 1).padStart(2,'0') + '-' + String(dd).padStart(2,'0');
      const isToday  = dateStr === fmtDate(TODAY);
      const dayItems = itemsForDate(dateStr);


      // Filter by active pills
      const _filtered = dayItems.filter(i =>
        (i.type === 'task'  && pf.tasks)   ||
        (i.type === 'event' && pf.events)  ||
        (i.type === 'entry' && pf.entries)
      );
      // Sort: priority first, then type (task→event→entry), then time
      const typeOrder = t => t.type === 'task' ? 0 : t.type === 'event' ? 1 : 2;
      const visItems = _filtered.slice().sort((a,b) => {
        const pd = priOrder(a.priority) - priOrder(b.priority);
        if (pd !== 0) return pd;
        const td = typeOrder(a) - typeOrder(b);
        if (td !== 0) return td;
        return (a.time||'').localeCompare(b.time||'');
      });

      // Dynamic item count — based on actual measured cell height
      const _storedH = STATE._plannerCellH || Math.max(72, window.innerHeight * 0.12);
      // Usable height = cell - date row (26px) - potential +more row (16px)
      // Each label chip is ~18px tall
      const _usableH  = Math.max(0, _storedH - 26 - 16);
      const maxItems  = Math.max(1, Math.floor(_usableH / 18));
      const shown     = visItems.slice(0, maxItems);
      const extra     = visItems.length - maxItems;

      let labelsHTML = shown.map(mkLabel).join('');
      if (extra > 0) {
        labelsHTML += '<span class="planner-cal-more">+' + extra + ' more</span>';
      }


      const todayCls  = isToday ? ' is-today' : '';
      const archiveCls = archiveMode ? ' archived-col' : '';

      cellsHTML += '<div class="planner-cal-cell' + todayCls + archiveCls + '"'
        + ' onclick="_plannerGoDay(\''+dateStr+'\');">'
        + '<div class="planner-cal-date-row">'
        + '<span class="planner-cal-date">' + dd + '</span>'
        + '</div>'
        + labelsHTML
        + '</div>';
      cellCount++;
    }

    // Fill to nearest complete row (5 rows = 35, 6 rows = 42)
    // Only add a 6th row if the month actually needs it
    const totalNeeded = cellCount <= 35 ? 35 : 42;
    for (let dd = 1; dd <= totalNeeded - cellCount; dd++) {
      cellsHTML += '<div class="planner-cal-cell other-month">'
        + '<div class="planner-cal-date-row">'
        + '<span class="planner-cal-date">' + dd + '</span>'
        + '</div></div>';
    }

    // Day-of-week header row
    const dowHTML = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']
      .map(d => '<div class="planner-dow">' + d + '</div>')
      .join('');

    // Archive badge
    let archiveHTML = '';
    if (archiveMode) {
      archiveHTML = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">'
        + '<span class="planner-archive-badge">'
        + '<i class="ti ti-archive" style="font-size:11px"></i>'
        + 'Archived · read only'
        + '</span>'
        + '<button class="planner-archive-link"'
        + ' onclick="STATE.calYear=new Date().getFullYear();STATE.calMonth=new Date().getMonth();renderPlanner()">'
        + 'Back to current month ›'
        + '</button>'
        + '</div>';
    }

    container.innerHTML = hdr + archiveHTML
      + '<div class="planner-month-wrap">'
      + '<div class="planner-dow-row">' + dowHTML + '</div>'
      + '<div class="planner-cal-grid" id="plannerCalGrid">' + cellsHTML + '</div>'
      + '</div>';

    // Attach ResizeObserver to the grid — fires on any size change
    // (initial render, window resize, monitor change, sidebar collapse)
    requestAnimationFrame(() => {
      const grid = document.getElementById('plannerCalGrid');
      if (!grid) return;

      // Disconnect any previous observer
      if (STATE._plannerRO) { STATE._plannerRO.disconnect(); STATE._plannerRO = null; }

      STATE._plannerRO = new ResizeObserver(() => {
        const firstCell = grid.querySelector('.planner-cal-cell:not(.other-month)');
        if (!firstCell) return;
        const actualH = firstCell.offsetHeight;
        if (actualH < 10) return;
        const newMax = Math.max(3, Math.floor((actualH - 28) / 18));
        const oldMax = Math.max(3, Math.floor(((STATE._plannerCellH || 0) - 28) / 18));
        if (actualH !== STATE._plannerCellH) {
          const prevH  = STATE._plannerCellH || actualH;
          STATE._plannerCellH = actualH;
          // Re-render if item count changes OR cell shrank/grew by more than 4px
          if (newMax !== oldMax || Math.abs(actualH - prevH) > 4) {
            STATE._plannerRO.disconnect();
            STATE._plannerRO = null;
            renderPlanner();
          }
        }
      });
      STATE._plannerRO.observe(grid);
    });
    return;
  }

  // ── WEEK VIEW ─────────────────────────────────────────────────────
  if (view === 'week') {
    const ws         = getWeekStart(STATE.plannerWeekOffset);
    const archiveMode = isArchivePeriod(fmtDate(ws));
    const archY      = ws.getFullYear();
    const archM      = ws.getMonth();
    const archKey    = archY + '-' + String(archM + 1).padStart(2,'0');

    // Load archive if needed
    if (archiveMode && !STATE.archiveCache[archKey] && !STATE.archiveCache._fetched) {
      container.innerHTML = hdr
        + '<div style="padding:24px;color:var(--muted);font-size:13px;text-align:center">'
        + '<i class="ti ti-loader" style="font-size:24px;opacity:0.4;display:block;margin-bottom:8px"></i>'
        + 'Loading archived week…</div>';
      fetchArchiveMonth(archY, archM).then(() => renderPlanner());
      return;
    }

    // Build a chip — returns '' if filtered out
    const mkChip = (item, fallbackLabel) => {
      if (item.type === 'task'  && !pf.tasks)   return '';
      if (item.type === 'event' && !pf.events)  return '';
      if (item.type === 'entry' && !pf.entries) return '';
      const cls      = ppClass(item.priority);
      const timeLabel = item.time ? fmtTime(item.time) : fallbackLabel;
      const title     = (item.title || '').replace(/"/g, '&quot;');
      return '<div class="planner-chip ' + cls + '"'
           + ' onclick="_plannerOpenItem(\''+item.id+'\');">'
           + '<span class="planner-chip-lbl">' + timeLabel + '</span>'
           + '<span class="planner-chip-title">' + title + '</span>'
           + '</div>';
    };

    let dayColsHTML = '';
    let hasAnyItems = false;

    // Sort: due tasks, start tasks, events by time, entries by time
    const sortByTime = arr => arr.slice().sort((a,b) => (a.time||'').localeCompare(b.time||''));

    for (let i = 0; i < 7; i++) {
      const d       = new Date(ws); d.setDate(ws.getDate() + i);
      const dayDate = fmtDate(d);
      const isToday = dayDate === fmtDate(TODAY);
      const dayName = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i];

      let dueT, startT, evts, ents;
      if (archiveMode) {
        const src = STATE.archiveCache[archKey] || [];
        dueT   = src.filter(t => t.type === 'task'  && t.dueDate    === dayDate);
        startT = src.filter(t => t.type === 'task'  && t.startDate  === dayDate && t.dueDate !== dayDate);
        evts   = src.filter(e => e.type === 'event' && e.date       === dayDate);
        ents   = src.filter(e => e.type === 'entry' && e.date       === dayDate);
      } else {
        dueT   = getTasks().filter(t => t.dueDate   === dayDate && parseStatus(t.status).state !== 'Completed');
        startT = getTasks().filter(t => t.startDate === dayDate && t.dueDate !== dayDate && parseStatus(t.status).state !== 'Completed');
        evts   = getEvents().filter(e => e.date === dayDate);
        ents   = getEntries().filter(e => e.date === dayDate);
      }

      if (dueT.length || startT.length || evts.length || ents.length) hasAnyItems = true;

      // Sort: due tasks by priority, start tasks by priority,
      // then events + entries merged and sorted by time
      const timedEvtsEnts = sortByTime([...evts, ...ents]);
      const chips = sortByPriority(dueT).map(t => mkChip(t, 'DUE')).join('')
        + sortByPriority(startT).map(t => mkChip(t, 'START')).join('')
        + timedEvtsEnts.map(e => mkChip(e, '')).join('');

      const todayCls   = isToday ? ' is-today' : '';
      const archiveCls = archiveMode ? ' archived-col' : '';
      const todayDot   = isToday ? '<div class="planner-today-dot"></div>' : '';
      const addBtn     = !archiveMode
        ? '<div class="planner-day-add"><button onclick="openTEEModal(null,null,\''+dayDate+'\')">+ Add</button></div>'
        : '';

      dayColsHTML += '<div class="planner-day-col' + todayCls + archiveCls + '">'
        + '<div class="planner-day-hdr">'
        + '<span class="planner-day-name">' + dayName + '</span>'
        + '<span class="planner-day-num">' + d.getDate() + '</span>'
        + todayDot
        + '</div>'
        + '<div class="planner-day-items">' + chips + '</div>'
        + addBtn
        + '</div>';
    }

    // Archive badge
    let archiveBadge = '';
    if (archiveMode) {
      archiveBadge = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">'
        + '<span class="planner-archive-badge">'
        + '<i class="ti ti-archive" style="font-size:11px"></i>'
        + 'Archived · read only</span>'
        + '<button class="planner-archive-link" onclick="changeWeek(0)">'
        + 'Back to current week ›</button>'
        + '</div>';
    }

    // Empty state
    let emptyHTML = '';
    if (!hasAnyItems) {
      emptyHTML = '<div class="planner-empty-week">'
        + '<i class="ti ti-calendar" style="font-size:32px;opacity:0.35"></i>'
        + '<span>Nothing scheduled this week</span>'
        + '</div>';
    }

    container.innerHTML = hdr + archiveBadge
      + '<div class="planner-week-grid">' + dayColsHTML + '</div>'
      + emptyHTML;
    return;
  }

  // ── DAY VIEW ─────────────────────────────────────────────────────
  if (view === 'day') {
    const dayOffset  = STATE.plannerDayOffset || 0;
    const dDay       = new Date(TODAY); dDay.setDate(dDay.getDate() + dayOffset);
    const dayDate    = fmtDate(dDay);
    const archiveMode = isArchivePeriod(dayDate);
    const archKey    = dayDate.substring(0, 7);

    if (archiveMode && !STATE.archiveCache[archKey] && !STATE.archiveCache._fetched) {
      container.innerHTML = hdr
        + '<div style="padding:24px;color:var(--muted);font-size:13px;text-align:center">'
        + 'Loading…</div>';
      fetchArchiveMonth(dDay.getFullYear(), dDay.getMonth()).then(() => renderPlanner());
      return;
    }

    let dueT, startT, evts, ents;
    if (archiveMode) {
      const src = STATE.archiveCache[archKey] || [];
      dueT   = src.filter(t => t.type === 'task'  && t.dueDate   === dayDate);
      startT = src.filter(t => t.type === 'task'  && t.startDate === dayDate && t.dueDate !== dayDate);
      evts   = src.filter(e => e.type === 'event' && e.date === dayDate);
      ents   = src.filter(e => e.type === 'entry' && e.date === dayDate);
    } else {
      // On today: hide completed tasks (they show in Today tab Done section)
      // On other dates: show all tasks including completed
      const isViewingToday = dayDate === fmtDate(TODAY);
      dueT   = getTasks().filter(t => t.dueDate   === dayDate && (isViewingToday ? parseStatus(t.status).state !== 'Completed' : true));
      startT = getTasks().filter(t => t.startDate === dayDate && t.dueDate !== dayDate && (isViewingToday ? parseStatus(t.status).state !== 'Completed' : true));
      evts   = getEvents().filter(e => e.date === dayDate);
      ents   = getEntries().filter(e => e.date === dayDate);
    }

    // ── Shared day-card builder (unscheduled + open-tasks sections) ──
    const buildPlannerDayCard = (t, dayDate) => {
      // ── Priority border color ──────────────────────────────────
      const bc = ppClass(t.priority).replace('pp-','');
      const cm = {crit:'#F87171', high:'#FB923C', med:'#0891B2', low:'var(--border2)'};
      const lc = cm[bc] || 'var(--border2)';

      // ── Priority badge (reuses PRIORITY object) ────────────────
      const priBadge = _buildPriorityBadge(t);
      const stBadge = _buildStatusBadge(t);

      // ── Subtask chip ───────────────────────────────────────────
      const stChip = _subtaskChip(t);

      // ── Due chip + date ─────────────────────────────────────────
      const dueChipHTML = _buildCounterChip(t.dueDate, dayDate);
      const ctxChipHTML  = _buildContextChips(t, dayDate);
      const dateLabel = t.dueDate
        ? '<span class="planner-day-card-date">' + t.dueDate + '</span>'
        : '';

      // ── Build card ─────────────────────────────────────────────
      return '<div class="planner-day-card" style="border-left-color:' + lc + '"'
        + ' onclick="_plannerOpenItem(\''+t.id+'\');">'
        // Line 1: priority + status left, subtask chip right
        + '<div class="planner-day-card-row1">'
        + priBadge + stBadge
        + '<span style="margin-left:auto">' + ctxChipHTML + stChip + '</span>'
        + '</div>'
        // Line 2: title left, due chip + date right
        + '<div class="planner-day-card-row2">'
        + '<span class="planner-day-card-title">' + (t.title||'') + '</span>'
        + '<div class="planner-day-card-due">' + dueChipHTML + dateLabel + '</div>'
        + '</div>'
        + '</div>';
    };

    // ── Unscheduled tasks at top ──────────────────────────────────
    const unscheduled = pf.tasks ? sortByPriority([...dueT, ...startT]) : [];
    let unschHTML = '';
    if (unscheduled.length > 0) {
      unschHTML += '<div class="planner-day-cards">';
      unscheduled.forEach(t => {
        unschHTML += buildPlannerDayCard(t, dayDate);
      });
      unschHTML += '</div>';
    }

    // ── Time grid 7am – 9pm ───────────────────────────────────────
    // hours calculated after timedItems below
    const timedItems = [
      ...(pf.events  ? evts : []),
      ...(pf.entries ? ents : []),
    ].filter(i => i.time);

    // Hours: 7am to latest item hour + 1 (min 9pm) — no dead space
    // Default window: 8am–6pm. Extends if items fall outside.
    const earliestHour = timedItems.reduce((min, i) => {
      const h = parseInt((i.time||'').split(':')[0], 10);
      return isNaN(h) ? min : Math.min(min, h);
    }, 8);
    const latestHour = timedItems.reduce((max, i) => {
      const h = parseInt((i.time||'').split(':')[0], 10);
      return isNaN(h) ? max : Math.max(max, h);
    }, 16); // default 16 so endHour = 17 (5pm) when no late items
    const startHour = Math.min(8, earliestHour);
    const endHour   = Math.max(17, latestHour + 1);
    const hours     = Array.from({length: endHour - startHour + 1}, (_, i) => i + startHour);

    let timeHTML = '';
    hours.forEach(h => {
      const hLabel   = h === 12 ? '12 pm' : h < 12 ? (h + ' am') : ((h - 12) + ' pm');
      const atHour   = timedItems.filter(i => parseInt((i.time||'').split(':')[0], 10) === h);
      let rowContent = '';
      atHour.forEach(i => {
        const cls = ppClass(i.priority);
        rowContent += '<div class="planner-time-event ' + cls + '"'
          + ' onclick="_plannerOpenItem(\''+i.id+'\');">'
          + fmtTime(i.time) + ' · ' + (i.title||'')
          + '</div>';
      });
      timeHTML += '<div class="planner-time-row">'
        + '<div class="planner-time-label">' + hLabel + '</div>'
        + '<div class="planner-time-content">' + rowContent + '</div>'
        + '</div>';
    });

    // Schedule section header + scrollable time grid
    const schedHTML = '<div class="planner-day-schedule">'
      + (timedItems.length > 0
        ? '<div class="planner-time-grid">' + timeHTML + '</div>'
        : '<div class="planner-empty-week" style="padding:32px 16px">'
          + '<i class="ti ti-calendar" style="font-size:28px;opacity:0.3"></i>'
          + '<span>No scheduled items</span></div>')
      + '</div>';

    // Empty state (nothing at all)
    const isEmpty = unscheduled.length === 0 && timedItems.length === 0;
    const emptyHTML = isEmpty
      ? '<div class="planner-empty-week">'
        + '<i class="ti ti-calendar" style="font-size:32px;opacity:0.35"></i>'
        + '<span>Nothing scheduled for this day</span>'
        + '</div>'
      : '';

    // Archive badge
    let archiveBadge = '';
    if (archiveMode) {
      archiveBadge = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:0 24px">'
        + '<span class="planner-archive-badge">'
        + '<i class="ti ti-archive" style="font-size:11px"></i>'
        + 'Archived · read only</span>'
        + '<button class="planner-archive-link" onclick="_plannerToday()">'
        + 'Back to today ›</button>'
        + '</div>';
    }

    // ── Open Tasks section (collapsed by default) ────────────────
    let openTasksHTML = '';
    if (!archiveMode && pf.tasks) {
      const _openSt = ['Backlog','To Do','In Progress','Review'];
      const _openTasks = getTasks().filter(t => {
        if (parseStatus(t.status).state === 'Completed') return false;
        if (t.dueDate === dayDate) return false;
        if (t.startDate === dayDate && t.dueDate !== dayDate) return false;
        const isOverdue = t.dueDate && daysUntil(t.dueDate) < 0;
        return _openSt.includes(parseStatus(t.status).state) || isOverdue;
      });
      _openTasks.sort((a, b) => {
        const da = daysUntil(a.dueDate), db = daysUntil(b.dueDate);
        const aOver = da !== null && da < 0;
        const bOver = db !== null && db < 0;
        if (aOver && !bOver) return -1;
        if (!aOver && bOver) return 1;
        if (aOver && bOver) return da - db;
        if (a.dueDate && b.dueDate && a.dueDate !== b.dueDate) return a.dueDate.localeCompare(b.dueDate);
        if (a.dueDate && !b.dueDate) return -1;
        if (!a.dueDate && b.dueDate) return 1;
        return priOrder(a.priority) - priOrder(b.priority);
      });
      if (_openTasks.length > 0) {
        const _isOpen = STATE.plannerActiveTasksOpen;
        const _oc2 = 'STATE.plannerActiveTasksOpen=!STATE.plannerActiveTasksOpen;renderPlanner()';
        openTasksHTML = '<div class="planner-open-hdr" onclick="' + _oc2 + '">'
          + '<i class="ti ti-layout-list" style="font-size:13px"></i>'
          + ' Open Tasks (' + _openTasks.length + ')'
          + '<span class="planner-open-hdr-chevron' + (_isOpen?' open':'') + '">›</span>'
          + '</div>';
        if (_isOpen) {
          openTasksHTML += '<div class="planner-open-cards">';
          _openTasks.forEach(t => {
            openTasksHTML += buildPlannerDayCard(t, dayDate);
          });
          openTasksHTML += '</div>';
        }
      }
    }

    // ── Assemble final Day View ───────────────────────────────────
    // Task List section — frozen header + scrollable cards
    const taskListHTML = (isEmpty && !openTasksHTML)
      ? emptyHTML
      : '<div class="planner-day-section planner-day-section-tasks">'
        + '<div class="planner-day-sec-hdr">'
        + '<i class="ti ti-clipboard-list" style="font-size:13px"></i> Task List</div>'
        + '<div class="planner-day-tasklist">' + unschHTML + openTasksHTML + '</div>'
        + '</div>';

    // Schedule section — frozen header + scrollable time grid
    const schedSectionHTML = '<div class="planner-day-section planner-day-section-sched">'
      + '<div class="planner-day-sec-hdr">'
      + '<i class="ti ti-clock" style="font-size:13px"></i> Schedule</div>'
      + schedHTML
      + '</div>';

    container.innerHTML = hdr + archiveBadge
      + '<div class="planner-day-view" style="margin:0 24px 28px;flex:1;min-height:0">'
      + taskListHTML + schedSectionHTML
      + '</div>';
    return;
  }

  } catch(e) {
    console.error('renderPlanner failed:', e);
    container.innerHTML = '<div style="padding:24px;color:var(--muted);font-size:13px">'
      + 'Planner failed to load. <button onclick="renderPlanner()" '
      + 'style="color:var(--accent2);background:none;border:none;cursor:pointer;'
      + 'font-size:13px;text-decoration:underline">Retry</button></div>';
  }
}


function changeWeek(dirOrReset) {
  if (dirOrReset === 0) STATE.plannerWeekOffset = 0;
  else STATE.plannerWeekOffset += dirOrReset;
  renderPlanner();
}

/* Show all items on a given date — primary click handler for all monthly calendar cells */
function openDayList(dateStr, archiveMode) {
  let items;
  if (archiveMode) {
    const key = dateStr.substring(0, 7);
    const src = STATE.archiveCache[key] || [];
    items = src.filter(i => i.type === 'task' ? i.dueDate === dateStr : i.date === dateStr);
  } else {
    items = itemsOnDate(dateStr);
  }
  const d = new Date(dateStr + 'T00:00:00');
  const label = d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
  const isToday = dateStr === fmtDate(TODAY);

  const dueTasks   = items.filter(i => i.type === 'task' && i._dateRole === 'due');
  const startTasks = items.filter(i => i.type === 'task' && i._dateRole === 'start');
  const timedItems = items.filter(i => i.type !== 'task');
  const sorted = sortPlannerItems(dueTasks, startTasks, timedItems);

  const listHTML = sorted.length === 0
    ? `<div style="text-align:center;padding:28px 0;color:var(--muted)">
         <div style="font-size:28px;margin-bottom:8px">📭</div>
         <div style="font-size:13px">Nothing scheduled for this day</div>
       </div>`
    : sorted.map(i => {
        const typeIcon  = { task:'📋', event:'📆', entry:'📝' }[i.type] || '📄';
        const pri       = getPri(i.priority);
        const timeStr   = i.time ? fmtTimeRange(i.time, i.endTime) : '';
        const statusBit = i.type === 'task'
          ? `<span style="font-size:10px;padding:1px 7px;border-radius:20px;background:var(--glass2);color:var(--text2);border:1px solid var(--border)">${parseStatus(i.status).state||i.status}</span>`
          : '';
        return `<div class="day-list-item" onclick="_navTo(()=>openDayList('${dateStr}',${archiveMode}),()=>openTEEDetail('${i.id}'))">
          <span style="font-size:18px;flex-shrink:0">${typeIcon}</span>
          <div style="flex:1;min-width:0">
            <div style="font-size:16px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--text)">${i.title}</div>
            <div style="display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap">
              ${timeStr ? `<span style="font-size:11px;font-family:var(--mono);color:var(--muted)">🕐 ${timeStr}</span>` : ''}
              ${i.category ? `<span style="font-size:10px;color:var(--text2)">${i.category}</span>` : ''}
              ${statusBit}
            </div>
          </div>
          <div style="flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px">
            <span style="font-size:10px;padding:2px 7px;border-radius:20px;background:${pri.bg};color:${pri.text};font-weight:600">${i.priority}</span>
          </div>
        </div>`;
      }).join('');

  openModal(`
    <div class="modal-title">
      <div>
        <div style="font-size:17px;font-weight:700">${label}</div>
        ${isToday ? '<div style="font-size:11px;color:var(--accent2);font-weight:600;margin-top:2px">Today</div>' : ''}
      </div>
      ${_modalCloseBtn()}
    </div>
    ${sorted.length > 0 ? `<div style="font-size:11px;color:var(--muted);margin-bottom:12px">${sorted.length} item${sorted.length>1?'s':''} — tap to view details</div>` : ''}
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px">${listHTML}</div>
    <div class="modal-actions">
      ${_backBtn()}
      ${!archiveMode ? `<button class="btn-primary" onclick="clearNav();openTEEModal(null,'entry','${dateStr}')">+ Add Item</button>` : ''}
    </div>`);
}

// ═══════════════════════════════════════════════════════════
// REMINDERS TAB — Shows all notes, sorted pinned-first then newest
// Each note has independent Pin (📌) and Float (📍) toggles
// ═══════════════════════════════════════════════════════════
function renderReminders() {
  const el = document.getElementById('remindersSection');
  if (!el) return;
  const isSmallScreen = window.innerWidth < 600;
  const f  = STATE.reminderFilter;
  const todayStr = fmtDate(TODAY);

  // ── Filter stickies ──────────────────────────────────────────
  let filtered = STATE.stickies;

  // Context pill filter
  if (f.context === 'pinned') filtered = filtered.filter(s => s.pinned && !s.done);
  else if (f.context === 'open') filtered = filtered.filter(s => !s.done);
  else if (f.context === 'done') filtered = filtered.filter(s => s.done);

  // Date float filter
  if (f.date !== 'All') {
    if (f.date === 'overdue')  filtered = filtered.filter(s => s.date && s.date < todayStr && !s.done);
    else if (f.date === 'today')    filtered = filtered.filter(s => s.date === todayStr);
    else if (f.date === 'upcoming') filtered = filtered.filter(s => s.date && s.date > todayStr);
    else if (f.date === 'nodate')   filtered = filtered.filter(s => !s.date);
  }

  // Tag float filter
  if (f.tag !== 'All') {
    filtered = filtered.filter(s => (s.tags||[]).includes(f.tag));
  }

  // Search filter
  if (f.search.trim()) {
    const q = f.search.toLowerCase();
    filtered = filtered.filter(s =>
      s.text.toLowerCase().includes(q) ||
      (s.tags||[]).some(t => t.toLowerCase().includes(q))
    );
  }

  // ── Counts for pills (unfiltered base, only context-aware) ───
  const all    = STATE.stickies;
  const cAll    = all.length;
  const cPinned = all.filter(s => s.pinned && !s.done).length;
  const cOpen   = all.filter(s => !s.done).length;
  const cDone   = all.filter(s => s.done).length;

  // ── Date float counts (respect tag + search + context) ───────
  const _baseForDate = filtered;
  const dateCounts = {
    overdue:  _baseForDate.filter(s => s.date && s.date < todayStr && !s.done).length,
    today:    _baseForDate.filter(s => s.date === todayStr).length,
    upcoming: _baseForDate.filter(s => s.date && s.date > todayStr).length,
    nodate:   _baseForDate.filter(s => !s.date).length,
  };

  // ── Tag float counts (respect date + search + context) ───────
  const _baseForTag = filtered;
  const tagNames = new Set();
  _baseForTag.forEach(s => (s.tags||[]).forEach(t => tagNames.add(t)));
  const tagCounts = {};
  tagNames.forEach(t => { tagCounts[t] = _baseForTag.filter(s => (s.tags||[]).includes(t)).length; });

  // ── Date label + color ───────────────────────────────────────
  const dateActive = f.date !== 'All';
  const _dateLabels = { overdue:'Past', today:'Today', upcoming:'Upcoming', nodate:'No Date' };
  const dateLabel  = dateActive ? (_dateLabels[f.date] || f.date) : 'All Dates';
  const dateCount  = dateActive ? _baseForDate.filter(s => {
    if (f.date === 'overdue')  return s.date && s.date < todayStr && !s.done;
    if (f.date === 'today')    return s.date === todayStr;
    if (f.date === 'upcoming') return s.date && s.date > todayStr;
    if (f.date === 'nodate')   return !s.date;
    return true;
  }).length : 0;
  const dateFullLabel = dateActive ? `${dateLabel} (${dateCount})` : 'All Dates';

  // ── Tag label ────────────────────────────────────────────────
  const tagActive = f.tag !== 'All';
  const tagCount  = tagActive ? (_baseForTag.filter(s => (s.tags||[]).includes(f.tag)).length) : 0;
  const tagFullLabel = tagActive ? `#${f.tag} (${tagCount})` : 'All Tags';

  // ── Build float HTML ─────────────────────────────────────────
  const dateOptions = [
    { key:'overdue',  label:'Past',     count: dateCounts.overdue  },
    { key:'today',    label:'Today',    count: dateCounts.today    },
    { key:'upcoming', label:'Upcoming',  count: dateCounts.upcoming },
    { key:'nodate',   label:'No Date',   count: dateCounts.nodate   },
  ];
  const dateFloatHTML = `<div style="padding:4px 0">
    <div class="kb-float-item${f.date==='All'?' active':''}" onclick="_rmSetDate('All')">All Dates</div>
    ${dateOptions.map(o => `<div class="kb-float-item${f.date===o.key?' active':''}" onclick="_rmSetDate('${o.key}')">${o.label}<span class="kb-float-count">${o.count}</span></div>`).join('')}
  </div>`;
  STATE._rmDateFloatHTML = dateFloatHTML;

  const tagFloatHTML = `<div style="padding:4px 0">
    <div class="kb-float-item${f.tag==='All'?' active':''}" onclick="_rmSetTag('All')">All Tags</div>
    ${[...tagNames].sort().map(t => `<div class="kb-float-item${f.tag===t?' active':''}" onclick="_rmSetTag('${t}')">#${t}<span class="kb-float-count">${tagCounts[t]}</span></div>`).join('')}
  </div>`;
  STATE._rmTagFloatHTML = tagFloatHTML;

  // ── Sort filtered: pinned first then by newest ────────────────
  const byNewest = (a, b) => {
    const na = parseInt((a.id||'').replace(/\D/g,''), 10) || 0;
    const nb = parseInt((b.id||'').replace(/\D/g,''), 10) || 0;
    return nb - na;
  };
  const pinnedF = filtered.filter(s => s.pinned && !s.done).sort(byNewest);
  const activeF = filtered.filter(s => !s.pinned && !s.done).sort(byNewest);
  const doneF   = filtered.filter(s => s.done).sort(byNewest);
  if (STATE._remindersDoneExpanded === undefined) STATE._remindersDoneExpanded = false;

  // ── Build card ───────────────────────────────────────────────
  const buildReminderMeta = s => {
    // Parse date — handle ISO format from sheet
    const _rawDate   = s.date || '';
    const _cleanDate = _rawDate.includes('T') ? _rawDate.split('T')[0] : _rawDate;

    // Meta text
    let metaText = '';
    if (s.done && s.doneAt) {
      const _raw = s.doneAt.includes('T') ? s.doneAt.replace('T',' ').split('.')[0] : s.doneAt;
      const _dp  = _raw.split(' ');
      metaText = 'Done ' + [_dp[0], _dp[1] ? fmtTime(_dp[1]) : ''].filter(Boolean).join(' ');
    } else if (s.done) {
      metaText = 'Completed';
    } else if (_cleanDate) {
      metaText = _cleanDate + (s.time ? ' · ' + fmtTime(s.time) : '');
    }
    return metaText;
  };

  const buildReminderTags = s => {
    // Tag chips
    return (s.tags||[]).length
      ? `<div style="display:flex;flex-wrap:wrap;gap:4px">${(s.tags||[]).map(t => _buildTagChip(t)).join('')}</div>`
      : '';
  };

  const buildColorSwatches = s => {
    return STICKY_COLORS.map((col,i) => `<button onclick="changeStickyColor('${s.id}',${i})"
            style="width:14px;height:14px;border-radius:50%;background:${col.bg};border:${s.colorIdx===i?'2px solid rgba(255,255,255,0.85)':'1px solid rgba(0,0,0,0.2)'};cursor:pointer;outline:none;flex-shrink:0"></button>`).join('');
  };

  const buildCard = s => {
    const c          = getStickyColor(s.colorIdx);
    const isFloating = !!s.float && !isSmallScreen;
    const isPinned   = !!s.pinned;
    const isDone     = !!s.done;

    const metaText = buildReminderMeta(s);
    const tagsHTML = buildReminderTags(s);

    // Pin/Float active state colors from config (light/dark aware)
    const _pac       = getNoteActionColor('pin');
    const _fac       = getNoteActionColor('float');
    const pinStyle   = isPinned   ? `background:${_pac.bg};color:${_pac.color};border:1px solid ${_pac.border};border-radius:20px` : '';
    const floatStyle = isFloating ? `background:${_fac.bg};color:${_fac.color};border:1px solid ${_fac.border};border-radius:20px` : '';
    const pinTitle   = isPinned   ? 'Pinned — click to unpin' : 'Pin note';
    const floatTitle = isFloating ? 'Floating — click to stop' : 'Float note';

    return `<div class="reminder-card${isPinned?' reminder-pinned':''}${isDone?' reminder-done':''}"
        style="background:${c.bg};color:${c.text}${isDone?';opacity:0.65;':''}">

      <div class="reminder-card-top" style="margin-bottom:6px">
        <div style="flex:1;min-width:0">
          <div class="reminder-card-body" style="${isDone?'text-decoration:line-through;opacity:0.8':''}">
            ${s.text}
          </div>
        </div>
      </div>

      ${metaText ? `<div style="font-size:10px;opacity:0.7;margin-bottom:2px">${metaText}</div>` : ''}
      ${tagsHTML ? `<div style="margin-bottom:8px">${tagsHTML}</div>` : ''}

      <div class="reminder-card-footer" style="margin-top:auto">
        <div style="display:flex;gap:4px;align-items:center">
          ${buildColorSwatches(s)}
        </div>
        <div style="display:flex;align-items:center;gap:2px">
          ${!isDone ? `
            <button class="reminder-action-btn" style="${pinStyle}" onclick="toggleNotePin('${s.id}',${!isPinned})" title="${pinTitle}">
              <i class="ti ti-pin" style="font-size:15px"></i>
            </button>
            ${!isSmallScreen ? `<button class="reminder-action-btn" style="${floatStyle}" onclick="toggleNoteFloat('${s.id}',${!isFloating})" title="${floatTitle}"><i class="ti ti-layout-navbar" style="font-size:15px"></i></button>` : ''}
            <span style="width:1px;height:16px;background:var(--border);margin:0 3px;flex-shrink:0"></span>
          ` : ''}
          ${isDone ? `<button class="reminder-action-btn" onclick="archiveStickyItem('${s.id}')"
            title="Archive note">
            <i class="ti ti-archive" style="font-size:15px"></i>
          </button>` : ''}
          <button class="reminder-action-btn" onclick="toggleStickyDone('${s.id}',${!isDone})"
            title="${isDone?'Mark as not done':'Mark as done'}">
            <i class="ti ${isDone?'ti-checkbox':'ti-square'}" style="font-size:15px"></i>
          </button>
          <button class="reminder-action-btn" onclick="openStickyModal('${s.id}')"
            title="Edit">
            <i class="ti ti-pencil" style="font-size:15px"></i>
          </button>
          <button class="reminder-action-btn" onclick="removeStickyItem('${s.id}')"
            title="Delete">
            <i class="ti ti-trash" style="font-size:15px"></i>
          </button>
        </div>
      </div>
    </div>`;
  };

  // ── Hoisted "done" grid markup (used in both done-section branches) ──
  const doneGridHTML = `<div class="reminders-grid" style="margin-top:8px">${doneF.map(buildCard).join('')}</div>`;

  // ── Hero subtitle ────────────────────────────────────────────
  const ctxSubtitle = f.context === 'pinned' ? 'Pinned'
    : f.context === 'open' ? 'Open Notes'
    : f.context === 'done' ? 'Done Notes'
    : 'All Notes';

  // ── Render ───────────────────────────────────────────────────
  const _wasSearchFocused = _captureSearchFocus('rm-search-input');

  el.innerHTML = `
    <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:12px;flex-shrink:0">
      <span style="font-size:26px;font-weight:800;letter-spacing:-0.03em;line-height:1.1;color:var(--text);font-family:var(--font-disp)">Reminders &amp; Notes</span>
      <span style="font-size:26px;font-weight:400;color:var(--muted);font-family:var(--font-disp)"> · ${ctxSubtitle}</span>
      <div style="display:flex;gap:8px;margin-left:auto">
        <button class="btn-ghost" onclick="openStickyArchiveDrawer()"><i class="ti ti-archive" style="font-size:13px;margin-right:4px"></i>View Archive</button>
        <button class="btn-primary" onclick="openStickyModal(null)">+ Add Note</button>
      </div>
    </div>

    <div class="kb-pill-strip" style="margin-bottom:8px">
      <button class="kb-pill${f.context==='all'?' active':''}" onclick="_rmSetContext('all')">
        <span class="kb-pill-num">${cAll}</span> ALL NOTES
      </button>
      ${cPinned > 0 ? `<button class="kb-pill${f.context==='pinned'?' active':''}" onclick="_rmSetContext('pinned')"><span class="kb-pill-num">${cPinned}</span> PINNED</button>` : ''}
      <button class="kb-pill${f.context==='open'?' active':''}" onclick="_rmSetContext('open')">
        <span class="kb-pill-num">${cOpen}</span> OPEN
      </button>
      ${cDone > 0 ? `<button class="kb-pill done${f.context==='done'?' active':''}" onclick="_rmSetContext('done')"><span class="kb-pill-num">${cDone}</span> DONE NOTES</button>` : ''}
    </div>

    <div class="kb-pill-strip" style="margin-bottom:16px">
      <div class="kb-search-wrap">
        <i class="ti ti-search" style="font-size:12px;color:var(--muted)"></i>
        <input id="rm-search-input" placeholder="Search notes…" value="${f.search}"
          oninput="STATE.reminderFilter.search=this.value;renderReminders();">
      </div>
      <button class="kb-dropdown-btn${dateActive?' active':''}" onclick="_rmOpenDateFloat(this)">
        ${dateFullLabel} &nbsp;&#9660;
      </button>
      <button class="kb-dropdown-btn${tagActive?' active':''}" onclick="_rmOpenTagFloat(this)">
        ${tagFullLabel} &nbsp;&#9660;
      </button>
    </div>

    ${filtered.length === 0 ? `
      <div style="text-align:center;padding:60px 20px;color:var(--muted)">
        <div style="font-size:13px">No notes match your filters</div>
      </div>` : `

      ${pinnedF.length > 0 ? `
        <div class="reminders-section-label">
          <i class="ti ti-pin" style="font-size:13px"></i> Pinned
          <span class="reminders-section-count">${pinnedF.length}</span>
        </div>
        <div class="reminders-grid reminders-grid-pinned">${pinnedF.map(buildCard).join('')}</div>
      ` : ''}

      ${(pinnedF.length > 0 && activeF.length > 0) ? `<div class="reminders-divider"></div>` : ''}

      ${activeF.length > 0 ? `
        <div class="reminders-grid">${activeF.map(buildCard).join('')}</div>
      ` : ''}

      ${doneF.length > 0 ? `
        <div class="reminders-divider"></div>
        ${f.context === 'done' ? `
          ${doneGridHTML}
        ` : `
          <div style="display:flex;align-items:center;gap:6px">
            <button class="reminders-done-toggle" style="flex:1" onclick="STATE._remindersDoneExpanded=!STATE._remindersDoneExpanded;renderReminders()">
              <span style="display:flex;align-items:center;gap:6px">
                <i class="ti ti-checkbox" style="font-size:13px"></i>
                Done
                <span class="reminders-section-count">${doneF.length}</span>
              </span>
              <i class="ti ${STATE._remindersDoneExpanded?'ti-chevron-up':'ti-chevron-down'}" style="font-size:13px"></i>
            </button>
            <button class="btn-ghost" style="font-size:11px;height:32px;padding:0 10px;white-space:nowrap"
              onclick="archiveAllDoneStickies()" title="Archive all done notes">
              <i class="ti ti-archive" style="font-size:12px;margin-right:3px"></i>Archive All
            </button>
          </div>
          ${STATE._remindersDoneExpanded ? `
            ${doneGridHTML}
          ` : ''}
        `}
      ` : ''}
    `}
  `;

  // Restore search focus
  _restoreSearchFocus('rm-search-input', _wasSearchFocused);

  // Apply pinned accent from config
  requestAnimationFrame(() => {
    const pa = getPinnedAccent();
    document.querySelectorAll('.reminder-card.reminder-pinned').forEach(el => {
      el.style.setProperty('--pinned-border', pa.border);
      el.style.setProperty('--pinned-shadow', pa.shadow);
    });
  });

  _updateRemindersBadge(STATE.stickies.length);
}

function unfloatSticky(id) {
  const s = STATE.stickies.find(x => x.id === id);
  if (!s) return;
  s.float = false;
  saveSticky(s).catch(()=>{});
  renderStickyLayer();
  renderReminders();
}

function toggleNoteFloat(id, enabled) {
  if (window.innerWidth < 600) return;
  const s = STATE.stickies.find(x => x.id === id);
  if (!s) return;
  s.float = enabled;
  saveSticky(s).catch(()=>{});
  renderStickyLayer();
  renderReminders();
}

function _updateRemindersBadge(count) {
  // Find the Reminders sidebar button and add/update badge
  const btn = document.querySelector('.sidebar-btn[data-page="page-reminders"]');
  if (!btn) return;
  let badge = btn.querySelector('.sidebar-badge');
  if (count === 0) { if (badge) badge.remove(); return; }
  if (!badge) {
    badge = document.createElement('span');
    badge.className = 'sidebar-badge';
    btn.appendChild(badge);
  }
  badge.textContent = count;
}

// ── FLOATING STICKY LAYER ────────────────────────────────────
// Renders notes with float:true as draggable overlays on screen
// Only shown on screens >= 600px wide
function renderStickyLayer() {
  const layer = document.getElementById('sticky-layer');
  if (!layer) return;
  const isSmall = window.innerWidth < 600;
  // Only show notes that have float:true, and never on small screens
  const floaters = isSmall ? [] : STATE.stickies.filter(s => s.float);
  if (floaters.length === 0) {
    layer.innerHTML = '';
    layer.style.display = 'none';
    return;
  }
  layer.style.display = 'block';
  layer.innerHTML = floaters.map(s => {
    const c = getStickyColor(s.colorIdx);
    const sidebarW = _sidebarWidth();
    const x = Math.min(Math.max(s.x || sidebarW + 20, sidebarW + 8), window.innerWidth  - 248);
    const y = Math.min(Math.max(s.y || 120, 62),                      window.innerHeight - 128);
    return `<div class="sticky-note" id="sticky-${s.id}"
          style="background:${c.bg};color:${c.text};left:${x}px;top:${y}px"
          data-id="${s.id}">
      <div class="sticky-label" onmousedown="startDragSticky(event,'${s.id}')">📌 Note <span style="opacity:0.4;font-size:8px">drag me</span></div>
      <div class="sticky-text">${s.text}</div>
