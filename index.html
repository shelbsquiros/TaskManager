<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jhov's Task Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Public+Sans:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS — Dark Mode
   ============================================================ */
:root {
  /* ── FONTS ── */
  --font:      'Public Sans', sans-serif;
  --font-disp: 'Plus Jakarta Sans', sans-serif;
  --mono:      'Geist Mono', monospace;

  /* ── CHARCOAL TEAL — Dark Mode ── */
  --bg:        #1E2023;
  --bg2:       #252829;
  --glass:     rgba(44,48,51,0.75);
  --glass2:    rgba(44,48,51,0.9);
  --glassh:    rgba(55,60,64,0.95);
  --glow:      rgba(40,92,112,0.18);
  --text:      #E8EDEF;
  --text2:     #8FA3AC;
  --muted:     #4A5A62;
  --border:    rgba(40,92,112,0.3);
  --border2:   rgba(79,154,181,0.35);
  --bordera:   rgba(79,154,181,0.5);
  --accent:    #285C70;
  --accent2:   #4F9AB5;
  --green:     #34D399;
  --yellow:    #FBBF24;
  --red:       #F87171;
  --orange:    #FB923C;
  --purple:    #C084FC;
  --cyan:      #22D3EE;
  --pink:      #F472B6;
  --nav-h:     62px;
  --radius:    16px;
  --radius-sm: 10px;
  --blur:      blur(20px);
  --blur-sm:   blur(12px);
  --shadow:    0 8px 32px rgba(0,0,0,0.5);
  --shadow-sm: 0 4px 16px rgba(0,0,0,0.3);
  --glow-card: 0 0 0 1px rgba(79,154,181,0.2), 0 8px 24px rgba(40,92,112,0.15);
}
/* ============================================================
   DESIGN TOKENS — Light Mode
   ============================================================ */
[data-theme="light"] {
  /* ── WARM PAPER+ — Light Mode ── */
  --green:     #16A34A;
  --red:       #DC2626;
  --orange:    #EA580C;
  --purple:    #7C3AED;
  --bg:        #F5F0E8;
  --bg2:       #FAF6EF;
  --glass:     rgba(255,255,255,0.75);
  --glass2:    rgba(255,255,255,0.88);
  --glassh:    rgba(255,255,255,0.97);
  --glow:      rgba(13,148,136,0.08);
  --text:      #1C1612;
  --text2:     #6B5A48;
  --muted:     #A8967E;
  --border:    #E8E0D5;
  --border2:   #D4C8B8;
  --bordera:   rgba(13,148,136,0.4);
  --accent:    #0D9488;
  --accent2:   #0F766E;
  --shadow:    0 4px 16px rgba(160,120,80,0.1);
  --shadow-sm: 0 2px 8px rgba(160,120,80,0.07);
  --glow-card: 0 0 0 1px rgba(13,148,136,0.15), 0 4px 16px rgba(13,148,136,0.08);
}

/* ============================================================
   RESET & BASE STYLES
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font);
  font-size: 16px;          /* Base body text */
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
}
[data-theme="dark"] body {
  /* Diagonal atmosphere — Charcoal Teal */
  background-image: linear-gradient(135deg,#505153 0%,#1E2023 45%,#0e0e10 100%);
  background-attachment: scroll;
}
[data-theme="light"] body {
  /* Diagonal atmosphere — Warm Paper+ */
  background-image: linear-gradient(135deg,#f6f4f1 0%,#F5F0E8 45%,#c4c2bf 100%);
  background-attachment: scroll;
}
/* Hover-reveal scrollbar — hidden by default, appears on container hover */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: transparent; border-radius: 4px; transition: background 0.2s; }
*:hover::-webkit-scrollbar-thumb { background: rgba(40,92,112,0.4); }
[data-theme="light"] *:hover::-webkit-scrollbar-thumb { background: rgba(13,148,136,0.35); }
/* Firefox */
* { scrollbar-width: thin; scrollbar-color: transparent transparent; }
*:hover { scrollbar-color: rgba(40,92,112,0.4) transparent; }
[data-theme="light"] *:hover { scrollbar-color: rgba(13,148,136,0.35) transparent; }
button { font-family: var(--font); cursor: pointer; }
input, select, textarea { font-family: var(--font); }
/* Display font for headings and titles */
h1,h2,h3,h4,.section-title,.page-title,.h2-title,.sidebar-brand,
.section-sub,.nav-name,.today-strip-daynum,
.task-title,.modal-title,.detail-title { font-family: var(--font-disp); }

/* ============================================================
   GLASSMORPHISM BASE
   ============================================================ */
.glass-card {
  /* Hybrid surface: near-solid, picks up a hint of background atmosphere */
  background: rgba(44,48,51,0.92);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
  /* Neumorphic depth — dark mode */
  box-shadow: 8px 8px 20px rgba(6,8,10,0.7), -4px -4px 10px rgba(58,66,72,0.32);
}
.glass-card:hover {
  border-color: var(--border2);
  box-shadow:
    var(--glow-card),
    10px 10px 28px rgba(6,8,10,0.75),
    -4px -4px 12px rgba(62,70,76,0.35);
  transform: translateY(-4px);
}
.glass-card:active {
  transform: translateY(1px);
  box-shadow:
    inset 5px 5px 12px rgba(0,0,0,0.35),
    inset -3px -3px 8px rgba(255,255,255,0.06);
  transition: transform 0.08s ease, box-shadow 0.08s ease;
}
/* Light mode hybrid — near-solid warm white */
[data-theme="light"] .modal-content { background: #FDFCFA; backdrop-filter: none; -webkit-backdrop-filter: none; }
[data-theme="light"] .modal { background: #FDFCFA; backdrop-filter: none; -webkit-backdrop-filter: none; box-shadow: 0 20px 60px rgba(0,0,0,0.12), 0 0 0 1px rgba(13,148,136,0.1); }
[data-theme="light"] .glass-card {
  background: #FFFFFF;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  /* Strong neumorphic — white cards visibly float above the cream body */
  box-shadow:
    10px 10px 28px rgba(130,100,60,0.22),
    -5px -5px 14px rgba(255,255,255,1),
    0 2px 4px rgba(130,100,60,0.08);
  border-color: rgba(215,200,180,0.5);
}
[data-theme="light"] .glass-card:hover {
  box-shadow:
    var(--glow-card),
    14px 14px 32px rgba(130,100,60,0.25),
    -6px -6px 16px rgba(255,255,255,1),
    0 4px 8px rgba(130,100,60,0.1);
  transform: translateY(-3px);
}
[data-theme="light"] .glass-card:active {
  transform: translateY(1px);
  box-shadow:
    inset 5px 5px 12px rgba(130,100,60,0.18),
    inset -3px -3px 8px rgba(255,255,255,0.9);
  transition: transform 0.08s ease, box-shadow 0.08s ease;
}


/* ============================================================
   LAYOUT & SIDEBAR
   ============================================================ */
:root {
  --sidebar-w: 240px;
  --sidebar-collapsed-w: 64px;
}
/* ── Sidebar width tokens above; full sidebar + layout rules below ── */

.app-container {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  position: fixed;
  top: 0; left: 0;
  width: var(--sidebar-w);
  height: 100vh;
  /* Split dark glass — dark mode: near-black with teal tint */
  background: rgba(8,10,12,0.72);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-right: 1px solid rgba(255,255,255,0.07);
  box-shadow: 2px 0 24px rgba(0,0,0,0.6), inset -1px 0 0 rgba(255,255,255,0.05);
  display: flex; flex-direction: column;
  padding: 20px 12px;
  z-index: 1000;
  transition: width 0.3s ease, transform 0.3s ease;
  overflow: hidden;
}
/* Light mode: warm cream glass sidebar */
[data-theme="light"] .sidebar {
  background: rgba(196,192,185,0.82);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-right: 1px solid rgba(160,140,110,0.25);
  box-shadow: 2px 0 16px rgba(140,120,90,0.12), inset -1px 0 0 rgba(255,255,255,0.5);
}

/* Collapsed state */
.sidebar.collapsed {
  width: var(--sidebar-collapsed-w);
}

.sidebar-brand {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 32px; padding: 0 4px;
  overflow: hidden; white-space: nowrap;
  min-height: 34px;
  font-family: var(--font-disp);
  color: rgba(232,237,239,0.92);
}
[data-theme="light"] .sidebar-brand { color: rgba(28,22,18,0.88); }
.sidebar-brand .nav-name {
  transition: opacity 0.2s, width 0.3s;
  opacity: 1;
}
.sidebar.collapsed .sidebar-brand .nav-name {
  opacity: 0; width: 0; overflow: hidden;
}
.sidebar.collapsed .sidebar-brand {
  justify-content: center;  /* center the J logo when name is hidden */
  padding: 0;               /* symmetric padding for true centering */
  gap: 0;
}

/* collapse btn is now its own full-width row at the bottom */
.sidebar-collapse-row-btn {
  display: flex; align-items: center; gap: 8px;
  width: 100%; padding: 0 10px; border-radius: var(--radius-sm);
  background: var(--glass); border: 1px solid var(--border);
  color: var(--text2); font-size: 13px; cursor: pointer;
  transition: all 0.2s; margin-top: 0;
  height: 44px; box-sizing: border-box;    /* same height as other elements */
  font-family: var(--mono); font-weight: 600;;
  overflow: hidden white-space: nowrap; overflow: hidden;
}
.sidebar-collapse-row-btn:hover { background: var(--glass2); color: var(--text); border-color: var(--border2); }
.sidebar.collapsed .sidebar-collapse-row-btn {
  justify-content: center;
  padding: 0;    /* symmetric — icon only */
}
.sidebar.collapsed .sidebar-collapse-row-btn .btn-label { display: none; }

.sidebar-links {
  display: flex; flex-direction: column; gap: 4px; flex: 1;
}

.sidebar-btn {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 12px; border-radius: var(--radius-sm);
  border: 1px solid transparent; background: transparent; color: var(--text2);
  font-size: 14px; font-weight: 500;
  transition: all 0.2s; cursor: pointer; text-align: left;
  white-space: nowrap; overflow: hidden;
  min-height: 44px; position: relative;
}
/* When collapsed: center the icon with equal padding */
.sidebar.collapsed .sidebar-btn {
  justify-content: center;
  padding: 0;
  height: 44px;
}

.sidebar-btn .btn-label {
  transition: opacity 0.2s, width 0.2s;
  opacity: 1; flex: 1;
}
.sidebar.collapsed .sidebar-btn .btn-label { display: none; }

.sidebar-btn .ico {
    font-size: 18px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    line-height: 1; width: 22px; height: 22px;
  }

/* Tooltip on collapsed state */
.sidebar.collapsed .sidebar-btn::after {
  content: attr(data-label);
  position: absolute; left: calc(var(--sidebar-collapsed-w) - 4px);
  background: var(--bg2); color: var(--text);
  border: 1px solid var(--border2);
  padding: 5px 10px; border-radius: 8px;
  font-size: 12px; font-weight: 500;
  white-space: nowrap; pointer-events: none;
  opacity: 0; transform: translateX(4px);
  transition: opacity 0.15s, transform 0.15s;
  z-index: 100;
  box-shadow: var(--shadow-sm);
}
.sidebar.collapsed .sidebar-btn:hover::after {
  opacity: 1; transform: translateX(8px);
}

.sidebar-btn:hover { background: var(--glass2); color: var(--text); }
.sidebar-btn.active {
  background: rgba(79,154,181,0.18); color: var(--accent2);
  border-color: rgba(79,154,181,0.25);
}
/* Light mode: warm teal active state */
[data-theme="light"] .sidebar-btn.active {
  background: rgba(255,255,255,0.45); color: var(--accent2);
  border-color: rgba(13,148,136,0.3);
}
/* Sidebar text on dark glass: override to always be light */
.sidebar-btn { color: rgba(143,163,172,0.85); }
.sidebar-btn:hover { background: rgba(255,255,255,0.08); color: #E8EDEF; }
/* Light mode sidebar text: warm dark */
[data-theme="light"] .sidebar-btn { color: rgba(90,70,50,0.8); }
[data-theme="light"] .sidebar-btn:hover { background: rgba(255,255,255,0.45); color: #1C1612; }

.sidebar-bottom {
  margin-top: auto;
  display: flex; flex-direction: column;
  gap: 8px;          /* consistent gap between all 3 bottom elements */
  padding: 0 4px 8px; /* 4px sides match nav buttons, 8px bottom breathing room */
  overflow: hidden;
}

/* Sync status block */
.sync-block {
  background: rgba(8,10,12,0.5); border: 1px solid rgba(255,255,255,0.06);
  border-radius: var(--radius-sm); padding: 8px 10px;
  display: flex; flex-direction: column; gap: 4px;
  transition: border-color 0.2s;
  overflow: hidden;
  cursor: pointer;  min-height: 44px;
}

[data-theme="light"] .sync-block {
  background: rgba(196,192,185,0.6); border-color: rgba(160,140,110,0.2);
}
.sync-block:hover { border-color: var(--border2); }
.sync-block-top {
  display: flex; align-items: center; gap: 6px;
  min-width: 0;
}
.sync-status-label {
  font-size: 11px; font-weight: 700; color: var(--text2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: opacity 0.2s;
}
.sync-time-line {
  font-size: 10px; color: var(--muted);
  font-family: var(--mono); line-height: 1.4;
  white-space: normal; word-break: break-word;
  transition: opacity 0.2s;
}

/* Collapsed sidebar: sync block becomes dot + ↻ centered */
.sidebar.collapsed .sync-block {
  align-items: center; justify-content: center;
  padding: 8px 4px; flex-direction: row; gap: 0;
}
.sidebar.collapsed .sync-block-top  { display: none; }
.sidebar.collapsed .sync-time-line  { display: none; }
.sidebar.collapsed .sync-collapsed-view { display: flex; }

/* Collapsed view element — hidden by default */
.sync-collapsed-view {
  display: none;
  align-items: center; justify-content: center; gap: 5px;
}

/* Bottom controls row */
.sidebar-controls {
  display: flex; align-items: center; gap: 8px;  min-height: 44px; box-sizing: border-box;
}

.sidebar.collapsed .sidebar-controls {
  justify-content: center;
  padding: 0;
  width: 100%;
}
.sidebar.collapsed .nav-date-small { display: none; }
/* Theme toggle stays centered when collapsed */
.sidebar.collapsed .icon-toggle { margin: 0 auto; }

.main-content {
  margin-left: var(--sidebar-w); flex: 1;
  padding: 0;
  /* Fixed-height panel layout — only inner columns scroll */
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: margin-left 0.3s ease;
}
.main-content.collapsed { margin-left: var(--sidebar-collapsed-w); overflow: hidden; }


/* Bulletproof Page Hiding for JS Data */
.main-content {
  position: relative;
}

.page {
  position: absolute;
  visibility: hidden;
  opacity: 0;
  pointer-events: none;
  z-index: 0;
  width: 100%;
  transition: opacity 0.3s ease;
  top: 0; left: 0;
  /* height:0 prevents hidden pages adding scroll height */
  height: 0; overflow: hidden;
}

.page.active {
  position: relative;
  visibility: visible;
  opacity: 1;
  pointer-events: auto;
  z-index: 1;
  height: auto; overflow: visible;
}
/* Override .page.active for the Today tab — it is a flex child, not a document */
#page-overview.active, #page-overview.page.active {
  height: unset;
  overflow: hidden;
}
/* Today tab — fixed-height panel layout */
/* #page-overview is a flex child of .main-content (flex column, 100vh) */
/* flex:1 + min-height:0 fills the remaining space without exceeding parent */
#page-overview,
#page-planner {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* overviewSection is the renderOverview output — must propagate flex height */
#overviewSection {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}


/* ── Status Indicators, Sync, Navigation Utilities ── */
/* Offline state for the status dot */
.nav-dot.offline {
  background: var(--muted);
  box-shadow: none;
  animation: none;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============================================================
   RESPONSIVE MOBILE VIEW
   ============================================================ */
.mobile-header {
  display: none; position: fixed; top: 0; left: 0; right: 0;
  height: var(--nav-h); background: var(--glass);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  border-bottom: 1px solid var(--border);
  align-items: center; padding: 0 24px; z-index: 999; gap: 16px;
}
.mobile-menu-btn {
  background: transparent; border: none; color: var(--text);
  font-size: 24px; cursor: pointer;
}

@media (max-width: 900px) {
  .sidebar { transform: translateX(-100%); width: var(--sidebar-w) !important; }
  .sidebar.open { transform: translateX(0); }
  .sidebar-collapse-row-btn { display: none; }
  .main-content, .main-content.collapsed { margin-left: 0; padding: 0; width: 100%; }
  .mobile-header { display: flex; }
  /* CRIT-001 (revised): offset every active page below the fixed 62px mobile header.
     Targeting .page.active (position:relative, in flex flow) rather than .main-content
     so that flex:1 pages (Overview, Planner) and height:100vh pages (Board, People,
     Resources, Reminders) all shift their top content down correctly. */
  .page.active { padding-top: var(--nav-h); }
}

/* Restored Status & Toggle Styles */
.nav-status { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--muted); padding: 4px 8px; border-radius: 20px; background: var(--glass); border: 1px solid var(--border); }
.nav-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.nav-dot.live    { background: var(--green);  box-shadow: 0 0 6px var(--green);  animation: pulse 2s infinite; }
.nav-dot.syncing { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); animation: spin-dot 0.8s linear infinite; }
@keyframes spin-dot { 0%,100%{opacity:1}50%{opacity:0.25} }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
.icon-toggle { width: 34px; height: 34px; border-radius: var(--radius-sm); background: transparent; border: none; color: var(--text2); font-size: 17px; display: flex; align-items: center; justify-content: center; transition: all 0.18s; flex-shrink: 0; }
.icon-toggle:hover { background: var(--glassh); color: var(--text); }

/* ============================================================
   NAVIGATION & PAGE SECTION LAYOUT
   ============================================================ */
.section { padding: 36px 28px 48px; min-height: unset; }
.section-title { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 4px; display: flex; align-items: center; gap: 10px; line-height: 1.3; }
.section-sub   { font-size: 12px; color: var(--text2); margin-bottom: 28px; }
.section-divider { height: 1px; background: var(--border); }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 20px;
  background: rgba(40,92,112,0.15); color: var(--accent2); border: 1px solid rgba(79,154,181,0.25);
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px;
  margin-bottom: 10px;
}


/* ── Typography scale ── */
.page-title   { font-size: 32px; font-weight: 800; line-height: 1.2; color: var(--text); margin-bottom: 4px; }
.h2-title     { font-size: 22px; font-weight: 700; color: var(--text); }
/* Captions and small text */
.caption-text { font-size: 12px; color: var(--muted); }
/* Chip label stays small for UI density */

/* ============================================================
   TODAY / OVERVIEW TAB
   ============================================================ */

/* Side-by-side layout: date card | schedule | pinned notes */
.today-layout {
  display: grid;
  grid-template-columns: 200px 1fr 320px;
  gap: 16px;
  margin-bottom: 24px;
  align-items: stretch;
}
/* Tablet: drop pinned notes below */
@media (max-width: 1024px) {
  .today-layout { grid-template-columns: 200px 1fr; }
  .today-layout-pinned { grid-column: 1 / -1; }
}
/* Mobile: stack all */
@media (max-width: 767px) {
  .today-layout { grid-template-columns: 1fr; }
  .today-layout-pinned { grid-column: 1; }
}

/* Date card — left column */
.today-date-card {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; padding: 20px 16px;
  background: var(--glass); border: 1px solid var(--border);
  border-radius: var(--radius); text-align: center;
}
.today-strip-dayname { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--accent2); }
.today-strip-daynum  { font-size: 72px; font-weight: 800; color: var(--text); line-height: 1; margin: 2px 0; }
.today-strip-month   { font-size: 13px; color: var(--muted); margin-bottom: 20px; }

/* Clickable type bubbles inside date card */
.today-date-bubbles {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: auto auto;
  gap: 6px; width: 100%;
}
/* Task bubble spans both columns — always biggest, always on top */
.today-bubble-task  { grid-column: 1 / -1; }
.today-bubble {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--glass2); cursor: pointer; transition: all 0.15s;
}
.today-bubble:hover { border-color: var(--border2); transform: translateY(-2px); }
.today-bubble-task  { border-color: rgba(248,113,113,0.35); }
.today-bubble-task:hover  { background: rgba(248,113,113,0.08); border-color: var(--red); }
.today-bubble-event { border-color: rgba(34,211,238,0.35); }
.today-bubble-event:hover { background: rgba(34,211,238,0.08); border-color: var(--cyan); }
.today-bubble-entry { border-color: rgba(251,191,36,0.35); }
.today-bubble-entry:hover { background: rgba(251,191,36,0.08); border-color: var(--yellow); }
/* Task bubble gets bigger number since it spans full width */
.today-bubble-task  .today-bubble-num  { font-size: 32px; color: var(--red); }
.today-bubble-event .today-bubble-num  { font-size: 22px; color: var(--cyan); }
.today-bubble-entry .today-bubble-num  { font-size: 22px; color: var(--yellow); }
.today-bubble-num   { font-weight: 800; line-height: 1; }
.today-bubble-label { font-size: 10px; color: var(--muted); white-space: nowrap; }

/* Pinned notes column in Today tab */
.today-pinned-col {
  background: var(--glass); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 14px 10px;
  display: flex; flex-direction: column; gap: 8px;
  overflow-y: auto; max-height: 420px;
}
.today-pinned-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 4px; flex-shrink: 0;
}
.today-pinned-note {
  border-radius: 10px; padding: 10px 12px;
  font-size: 12px; line-height: 1.55;
  display: flex; flex-direction: column; gap: 6px;
  flex-shrink: 0;
}
.today-pinned-text {
  font-size: 12px; line-height: 1.55; font-weight: 500;
  /* 4-line clamp before expanding */
  display: -webkit-box; -webkit-box-orient: vertical;
  -webkit-line-clamp: 4; overflow: hidden;
}
.today-pinned-text.expanded {
  display: block; overflow: visible; -webkit-line-clamp: unset;
}
.today-pinned-expand {
  font-size: 10px; font-weight: 600; cursor: pointer;
  background: none; border: none; padding: 0;
  opacity: 0.65; align-self: flex-start;
  transition: opacity 0.15s;
}
.today-pinned-expand:hover { opacity: 1; }

/* Pinned bar at top of reminder card */
.reminder-pinned-bar {
  font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
  color: var(--accent2); margin-bottom: 6px; opacity: 0.8;
}
.reminder-card.reminder-pinned {
  border-top: 2px solid var(--pinned-border, #4F9AB5);
  box-shadow: var(--pinned-shadow, 0 4px 20px rgba(79,154,181,0.25));
}
  background: var(--glass); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 18px;
  overflow-y: auto; max-height: 400px;
}
.today-view-section {
  background: var(--glass); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 18px;
}
.today-items-list { display: flex; flex-direction: column; gap: 6px; }

.today-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 10px;
  background: var(--glass2); border: 1px solid var(--border);
  border-left: 3px solid var(--border2);
  cursor: pointer; transition: border-color 0.15s, background 0.15s;
}
.today-item:hover { background: var(--glassh); border-color: var(--border2); }
.today-item-task  { border-left-color: var(--red); }
.today-item-start { border-left-color: #34D399; }
.today-item-event { border-left-color: var(--cyan); }
.today-item-entry { border-left-color: var(--accent); }

.today-item-time  { font-size: 10px; font-weight: 700; font-family: var(--mono); color: var(--muted); min-width: 36px; text-align: center; flex-shrink: 0; }
.today-item-icon  { font-size: 15px; flex-shrink: 0; }
.today-item-body  { flex: 1; min-width: 0; }
.today-item-title { font-size: 14px; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.today-item-meta  { font-size: 11px; color: var(--text2); margin-top: 2px; }

.today-empty { text-align: center; padding: 28px 20px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; }

/* ============================================================
   PEOPLE TAB & PERSON DETAIL MODAL
   ============================================================ */
.person-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(285px, 1fr)); gap: 16px; }
.person-card {
  background: var(--glass);
  backdrop-filter: var(--blur-sm);
  -webkit-backdrop-filter: var(--blur-sm);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
}
.person-card:hover { border-color: var(--border2); box-shadow: var(--glow-card); transform: translateY(-2px); }
.person-header { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.person-avatar {
  width: 48px; height: 48px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700; color: #fff; flex-shrink: 0;
  box-shadow: 0 4px 14px rgba(0,0,0,0.3);
}
.person-name  { font-size: 15px; font-weight: 700; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 100%; line-height: 1.2; }
.person-role  { font-size: 11px; color: var(--text2); line-height: 1.2; margin-top: 1px; }
.person-actions { margin-left: auto; display: flex; gap: 4px; flex-shrink: 0; }
/* P4-R018e (discovery basis P4-D030 SS8-10): People card overflow-menu trigger.
   Dedicated class, NOT a modification of .dir-action-btn (shared with Resources) —
   keeps Resources' own edit/delete icons completely unaffected by this checkpoint. */
.card-action-trigger {
  background: transparent; border: none; cursor: pointer;
  font-size: 15px; color: var(--text2); transition: background 0.15s;
  width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.card-action-trigger:hover, .card-action-trigger.active { background: rgba(128,128,128,0.28); color: var(--text); }
.person-action-btn {
  width: 24px; height: 24px; border-radius: 6px;
  background: transparent; border: 1px solid var(--border);
  color: var(--muted); font-size: 11px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; cursor: pointer; flex-shrink: 0;
}
.person-action-btn:hover { background: var(--glass2); color: var(--text); border-color: var(--border2); }
.person-action-btn.danger:hover { background: rgba(248,113,113,0.1); color: var(--red); border-color: rgba(248,113,113,0.3); }
.icon-btn { width: 28px; height: 28px; border-radius: 8px; background: transparent; border: 1px solid var(--border2); color: var(--text2); font-size: 12px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.icon-btn:hover { background: var(--glass2); color: var(--text); }
.icon-btn.danger:hover { background: rgba(248,113,113,0.1); color: var(--red); border-color: rgba(248,113,113,0.3); }
/* P4-R018a: gap tightened 8px->6px (discovery basis P4-D030 SS12-14) — People
   card Today/This Week chips were wrapping awkwardly at the grid's own
   285px-minimum card width; this mirrors the same tightening precedent
   P4-R017b-fix2 already used for Schedule's own count pills. */
.person-stats { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
/* P4-R018a: padding tightened 3px/9px -> 2px/7px, same rationale as above. */
.stat-pill { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 20px; }
/* P4-R018c: compact clickable shortcut chips replacing the old Task/
   Event/Entry/Overdue type-breakdown chips inside .person-stats
   (discovery basis P4-D030/P4-D031/P4-D033/P4-D034) — real <button>
   elements for accessibility, smaller/more compact than the P4-R018b-redo
   .person-shortcut-pill this supersedes (font-size 9px vs 10px, padding
   2px/6px vs 3px/8px, matching .stat-pill's own compact baseline), since
   product validation found the larger "Active Today"/"Active This Week"
   labels/pills too visually heavy. Reuses this same rgba(40,92,112,...)/
   amber/red color language the removed chips (and .person-viewall)
   already used, so no new theme-readability risk is introduced. */
.person-shortcut-chip {
  font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 20px;
  border: 1px solid transparent; cursor: pointer; font-family: var(--font);
  transition: all 0.15s;
}
.person-shortcut-chip.today { background: rgba(40,92,112,0.15); color: var(--accent2); }
.person-shortcut-chip.today:hover { background: rgba(40,92,112,0.28); border-color: rgba(40,92,112,0.35); }
.person-shortcut-chip.week { background: rgba(251,191,36,0.10); color: #FBBF24; }
.person-shortcut-chip.week:hover { background: rgba(251,191,36,0.20); border-color: rgba(251,191,36,0.35); }
.person-shortcut-chip.overdue { background: rgba(248,113,113,0.12); color: var(--red); }
.person-shortcut-chip.overdue:hover { background: rgba(248,113,113,0.22); border-color: rgba(248,113,113,0.35); }
.person-progress-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text2); margin-bottom: 6px; }
.person-bar { height: 4px; background: var(--border2); border-radius: 4px; overflow: hidden; }
.person-bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
.person-tasks { margin-top: 14px; display: flex; flex-direction: column; gap: 5px; }
.person-tasks { margin-top: 14px; display: flex; flex-direction: column; gap: 4px; }
/* Clickable item row in person card */
.person-task-item {
  display: flex; align-items: center; gap: 8px; font-size: 11px;
  padding: 6px 10px; border-radius: 8px;
  background: var(--glass); border: 1px solid var(--border);
  color: var(--text2); cursor: pointer; transition: all 0.15s;
  text-decoration: none;
}
.person-task-item:hover { background: var(--glassh); border-color: var(--border2); color: var(--text); }
/* Lead: full weight, full color */
.person-task-item.is-lead { color: var(--text); font-weight: 600; }
/* Contributor: muted */
.person-task-item.is-contrib { opacity: 0.70; }
/* Completed: strikethrough + check, very muted regardless of role */
.person-task-item.is-done { opacity: 0.45; }
.person-task-item.is-done .pti-title { text-decoration: line-through; }
.person-task-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.pti-check { font-size: 10px; flex-shrink: 0; color: var(--green); }
.pti-title { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.pti-status { flex-shrink: 0; font-family: var(--mono); font-size: 9px; opacity: 0.6; }
.pti-type { flex-shrink: 0; font-size: 11px; }
/* Group label inside person tasks */
.person-group-lbl {
  font-size: 9px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.8px; color: var(--muted); margin-top: 8px; margin-bottom: 2px;
  padding-left: 2px;
}
.person-group-lbl:first-child { margin-top: 2px; }
/* P4-R018a: "View details ->" renamed "View Activities" and moved above the
   Today/This Week chips (see buildPersonCard) — label/placement/click
   behavior unchanged since (discovery basis P4-D030 SS6).
   P4-R018a-fix1: owner manual review found R018a's original full-solid
   var(--accent)/#fff fill too visually strong when repeated across every
   card in the People grid (reads as a page-level primary CTA, not a
   card-level action) — discovery basis P4-D031 SS12/SS16. Restyled to the
   same soft tinted-pill treatment .pdm-filter-pill.active already uses
   (rgba(40,92,112,0.2) background / var(--accent2) text / matching tinted
   border) instead of inventing a new color language — this is the exact,
   already-shipped, already-theme-proven "calm selected/actionable" look
   used throughout Person Detail's own filter pills and Schedule's count
   pills, so no new light/dark-theme readability risk is introduced. Class
   name and compact footprint (font-size/padding/width) are unchanged from
   R018a — only background/color/border/hover differ. */
.person-viewall {
  font-size: 11px; font-weight: 700; color: var(--accent2); cursor: pointer;
  padding: 6px 10px; text-align: center; border-radius: 8px;
  border: 1px solid rgba(40,92,112,0.35); margin-bottom: 4px;
  transition: all 0.15s; background: rgba(40,92,112,0.2);
  font-family: var(--font); width: 100%;
}
.person-viewall:hover { background: rgba(40,92,112,0.32); border-color: var(--accent2); }

/* ── PERSON DETAIL MODAL ─────────────────────────────────────── */
/* P4-R015a: shell/scroll polish (discovery basis P4-D026) — adapts the
   idea behind TEE Detail's .tee-detail-shell/.tee-detail-body (stable top
   area, one clear scrolling region, footer outside the scroll) under a
   dedicated .pdm-* namespace only. Does not reuse any .tee-detail-* class
   and does not introduce Details/Assign/Context/Execution section-card
   language — Person Detail remains an activity/relationship view, not a
   field-display view (see P4-D025/P4-D026). .pdm-shell's max-height is the
   same `calc(90vh - 60px)` budget math .tee-detail-shell already uses
   (matching .modal's own 90vh max-height + 28px top/bottom padding). Only
   #pdm-list/.pdm-list-wrap scrolls — pills and tabs stay always-visible
   above it, exactly as before; this replaces the prior fixed inline
   `max-height:50vh` with a `flex:1` region that adapts to whatever space
   is actually available. */
.pdm-shell { display: flex; flex-direction: column; max-height: calc(90vh - 60px); }
.pdm-top { flex-shrink: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.pdm-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.pdm-body > .pdm-pills, .pdm-body > .pdm-tabs { flex-shrink: 0; }
.pdm-list-wrap { flex: 1; min-height: 0; overflow-y: auto; scrollbar-gutter: stable; padding-right: 4px; }
/* P4-R015a: header status signal (discovery basis P4-D026) — mirrors
   .person-active-badge/.person-active-week-badge/.person-idle-badge's
   colors/meaning (People page) under a dedicated .pdm-status-* namespace,
   since this modal's avatar size/header layout differ from the People
   card. Driven by the same unchanged isPersonActiveToday()/
   isPersonActiveThisWeek() calls. */
.pdm-avatar-wrap { position: relative; flex-shrink: 0; }
/* P4-R015a-fix1: dot inset from 0/0 to 2px/2px (matching .person-active-dot's
   own inset on the People card) so the dot's circular edge overlaps the
   avatar's curved edge instead of sitting out at the empty square-corner
   past the circle — owner review found the previous flush 0/0 corner
   placement read as visually separated from the avatar. Dot enlarged
   14px → 16px to stay proportional to the avatar's 56px → 64px increase. */
.pdm-status-dot {
  position: absolute; bottom: 2px; right: 2px;
  width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid var(--bg2);
}
.pdm-status-dot.today { background: var(--green); }
.pdm-status-dot.week  { background: #FBBF24; }
.pdm-status-dot.idle  { background: var(--muted); }
.pdm-header-info { min-width: 0; }
.pdm-person-name { font-size: 18px; font-weight: 800; color: var(--text); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
/* P4-R015a-fix1: role/badge spacing tightened slightly (1px→0, 5px→4px) so
   the 3-line identity stack reads more compact against the larger avatar —
   a small adjustment, not a rewrite of the stack's spacing. */
.pdm-person-role { font-size: 12px; color: var(--text2); margin-top: 0; }
.pdm-status-badge {
  display: inline-flex; align-items: center; margin-top: 4px;
  font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
  padding: 1px 6px; border-radius: 20px; white-space: nowrap; line-height: 1.5;
}
.pdm-status-badge.today { color: var(--green); background: rgba(52,211,153,0.12); border: 1px solid rgba(52,211,153,0.3); }
.pdm-status-badge.week  { color: #FBBF24; background: rgba(251,191,36,0.12); border: 1px solid rgba(251,191,36,0.3); }
.pdm-status-badge.idle  { color: var(--muted); background: rgba(127,138,167,0.10); border: 1px solid rgba(127,138,167,0.20); }
/* P4-R015a-fix1: header gap tightened 14px→12px, matching the slightly
   larger avatar against a slightly tighter text stack. */
.pdm-header { display: flex; align-items: center; gap: 12px; min-width: 0; }
.pdm-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.pdm-pill { font-size: 11px; font-weight: 600; padding: 4px 12px; border-radius: 20px; }
.pdm-tabs { display: flex; gap: 5px; margin-bottom: 14px; }
.pdm-tab { padding: 5px 14px; border-radius: 9px; font-size: 12px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: var(--glass); color: var(--text2); transition: all 0.15s; font-family: var(--font); }
.pdm-tab.active { background: rgba(40,92,112,0.2); color: var(--accent2); border-color: rgba(40,92,112,0.35); }
/* P4-R015b: two-tier filter panel (discovery basis P4-D026) — replaces
   the old .pdm-tabs/.pdm-tab single-row tabs in the rendered markup
   (those classes are left in place, unused, since removing them is
   dead-code cleanup outside this checkpoint's scope). Visual language is
   inspired by .pdm-tab/.kb-pill (rounded pill, border, tinted active
   state) but scoped entirely to its own .pdm-filter-* namespace — does
   not touch .kb-pill, Today/Overview's .gt-primary-pill/.gt-sub-pill, or
   any Planner filter CSS. Subfilter pills are visually subordinate
   (smaller) to the always-visible primary row. */
.pdm-filter-panel { margin-bottom: 14px; }
.pdm-primary-filters { display: flex; gap: 6px; flex-wrap: wrap; }
.pdm-subfilters { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.pdm-filter-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 12px; border-radius: 20px; cursor: pointer;
  border: 1px solid var(--border); background: var(--glass);
  font-size: 11px; font-weight: 600; color: var(--text2);
  white-space: nowrap; transition: all 0.15s; font-family: var(--font);
  letter-spacing: 0.02em;
}
.pdm-filter-pill:hover { background: var(--glass2); color: var(--text); }
.pdm-filter-pill.active { background: rgba(40,92,112,0.2); color: var(--accent2); border-color: rgba(40,92,112,0.35); font-weight: 700; }
/* P4-R015b-fix1: owner review found the active primary pill wasn't visually
   distinct enough from an active subfilter pill — primary pill is now the
   stronger of the two (deeper tint, brighter border, subtle glow), while the
   subfilter's existing .pdm-filter-pill.active rule above still applies for
   its own selected state. */
.pdm-primary-filters .pdm-filter-pill.active {
  background: rgba(40,92,112,0.34);
  border-color: rgba(79,154,181,0.7);
  color: var(--accent2);
  font-weight: 800;
  box-shadow: 0 0 0 1px rgba(79,154,181,0.3) inset, 0 2px 8px rgba(40,92,112,0.28);
}
.pdm-filter-pill-sub { font-size: 10px; padding: 4px 10px; }
.pdm-filter-count { font-size: 10px; font-weight: 800; opacity: 0.85; }
/* P4-R017a: LIST | SCHEDULE view switch (discovery basis P4-D029) —
   full-width, evenly-split segmented toggle, placed below .pdm-top and
   above whichever content region (LIST filter panel, or SCHEDULE date-nav)
   is currently selected. Visually derived from the app's existing
   full-width segmented-tab pattern (.tee-type-tabs/.tee-type-btn) for the
   even 50/50 split, using .pdm-filter-pill's own tinted-active-state
   language for color — kept in its own .pdm-view-* namespace so neither
   source pattern is touched. */
.pdm-view-switch {
  display: flex; gap: 4px; margin-bottom: 14px; padding: 4px; width: 100%;
  background: var(--glass); border: 1px solid var(--border); border-radius: 999px;
  flex-shrink: 0;
}
.pdm-view-btn {
  flex: 1; height: 32px; padding: 0 8px; border-radius: 999px;
  border: 1px solid transparent; background: transparent; color: var(--text2);
  font-family: var(--font); font-size: 11px; font-weight: 700; cursor: pointer;
  transition: all 0.18s; text-align: center; text-transform: uppercase;
  letter-spacing: 0.03em;
}
.pdm-view-btn:hover { background: var(--glass2); color: var(--text); }
.pdm-view-btn.active {
  background: rgba(40,92,112,0.2); color: var(--accent2);
  border-color: rgba(40,92,112,0.35); font-weight: 800;
}
/* P4-R017a: #pdm-view-body wraps whichever content is currently selected
   (LIST's filter panel + #pdm-list, or SCHEDULE's date-nav + empty-state
   panel) — re-derives the same flex column / flex:1 / min-height:0 /
   overflow:hidden shape .pdm-body itself used to provide directly, so
   #pdm-list's existing flex:1/overflow-y:auto scrolling behavior is
   preserved unchanged now that it's nested one level deeper. */
.pdm-view-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
/* P4-R017a: Schedule date-nav row + empty-state skeleton panel — no real
   agenda content yet (P4-D029 §14 staging). .pdm-schedule-panel reuses the
   same flex:1/min-height:0/overflow-y:auto scroll-region shape
   .pdm-list-wrap already uses, so a future real agenda list drops in
   without a layout change. */
.pdm-schedule-panel { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow-y: auto; }
.pdm-schedule-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-shrink: 0; }
.pdm-schedule-nav-btn {
  flex-shrink: 0; width: 28px; height: 28px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--glass); color: var(--text2);
  font-size: 14px; line-height: 1; cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; justify-content: center;
}
.pdm-schedule-nav-btn:hover { background: var(--glass2); color: var(--text); }
.pdm-schedule-date { flex: 1; text-align: center; font-size: 13px; font-weight: 700; color: var(--text); }
.pdm-schedule-today-btn {
  flex-shrink: 0; padding: 5px 12px; border-radius: 20px;
  border: 1px solid var(--border); background: var(--glass); color: var(--text2);
  font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.15s;
  font-family: var(--font);
}
.pdm-schedule-today-btn:hover { background: var(--glass2); color: var(--text); }
.pdm-schedule-empty { padding: 32px 16px; text-align: center; color: var(--text2); font-size: 12px; line-height: 1.5; }
/* P4-R017b (relabeled P4-R017b-fix1, sized down by P4-R017b-fix2 per owner
   review): Schedule count pills — SCHEDULED/UNSCHEDULED/DUE/ONGOING/OVERDUE.
   P4-R017b-fix2 shrank the box (padding/font-size/gaps) relative to fix1's
   .pdm-filter-pill-derived sizing, since fix1's owner review found five
   full-size pills too bulky and prone to wrapping onto a second row even
   with only a couple of non-zero counts visible — deliberately smaller than
   .pdm-filter-pill rather than matching it, and combined with only
   rendering non-zero pills (see _pdmBuildScheduleAgenda), the common case
   is a single short row. Kept in the .pdm-schedule-* namespace rather than
   reusing .pdm-filter-pill directly, so nothing here is ever mistaken for a
   second, differently-scoped filter row.
   P4-R017c: pills became clickable filter controls (previously
   informational-only, cursor:default, no onclick) — cursor:pointer plus a
   hover/.active state reusing .pdm-filter-pill's own tinted-active-state
   language (same rgba(40,92,112,...) accent tint) at the compact fix2 size,
   so Schedule's active-filter visual reads as the same "selected pill"
   idiom already established by the LIST filter panel, without reusing
   .pdm-filter-pill's class itself (dimensions stay independently owned by
   .pdm-schedule-count-pill, per the fix2 sizing rationale above). */
.pdm-schedule-counts { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; flex-shrink: 0; }
.pdm-schedule-count-pill {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 3px 8px; border-radius: 20px; cursor: pointer;
  border: 1px solid var(--border); background: var(--glass);
  font-size: 10px; font-weight: 600; color: var(--text2);
  white-space: nowrap; font-family: var(--font); letter-spacing: 0.02em;
  transition: all 0.15s; user-select: none;
}
.pdm-schedule-count-pill:hover { background: var(--glass2); color: var(--text); }
.pdm-schedule-count-pill.active {
  background: rgba(40,92,112,0.2); color: var(--accent2);
  border-color: rgba(40,92,112,0.35); font-weight: 800;
}
/* P4-R017b: SCHEDULED/UNSCHEDULED/DUE/ONGOING/OVERDUE agenda content —
   Schedule cards reuse the existing .pdm-activity-* classes
   (.pdm-activity-card/-row/-title/-role/-badge/-tag/-date) verbatim, the
   same ones _pdmList's own LIST cards already use, so no new card CSS is
   needed here. Non-collapsible section headers (SCHEDULED/UNSCHEDULED/DUE)
   reuse the existing .pdm-group-divider rule (defined since P4-R015c,
   previously unused dead CSS after that checkpoint's flat-list redesign
   removed group headers from LIST — now genuinely used again by
   Schedule). */
.pdm-schedule-agenda { display: flex; flex-direction: column; }
/* P4-R017b-fix1: ONGOING/OVERDUE are collapsible, collapsed by default —
   a plain local class toggle on click (no STATE tracking, no re-render),
   so collapse state is intentionally not preserved across a date change or
   modal reopen, per the owner's explicit "acceptable to reset" direction.
   The header itself reuses .pdm-group-divider's own look (via the combined
   class list below) plus cursor:pointer and a small ▸/▾ indicator — static
   directional glyphs via `content` on a dedicated child span's own
   `::before` (not `.pdm-group-divider`'s own `::after`, which already
   renders that class's divider line — reusing `::after` here would replace
   the line with the glyph instead of showing both), and not a rotated `›`,
   since a rotated chevron read as an illegible flat dash at this row's 9px
   scale during live verification. .pdm-group-divider itself is untouched,
   only extended with this additional selector. */
.pdm-schedule-section-hdr { cursor: pointer; user-select: none; }
.pdm-schedule-section-chevron::before { content: '▾'; font-size: 8px; opacity: 0.7; }
.pdm-schedule-section.collapsed .pdm-schedule-section-chevron::before { content: '▸'; }
.pdm-schedule-section.collapsed .pdm-schedule-section-body { display: none; }
.pdm-item {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 12px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--border); background: var(--glass);
  margin-bottom: 5px; transition: all 0.15s;
}
.pdm-item:hover { background: var(--glassh); border-color: var(--border2); }
.pdm-item.is-lead { border-left: 3px solid; }
.pdm-item.is-contrib { opacity: 0.72; }
.pdm-item.is-done { opacity: 0.42; }
.pdm-item.is-done .pdm-item-title { text-decoration: line-through; }
.pdm-item-icon { font-size: 14px; flex-shrink: 0; }
.pdm-item-body { flex: 1; min-width: 0; }
.pdm-item-title { font-size: 13px; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.pdm-item-meta { font-size: 10px; color: var(--text2); margin-top: 2px; font-family: var(--mono); }
.pdm-item-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0; }
.pdm-role-lbl { font-size: 9px; color: var(--muted); font-weight: 600; }
.pdm-group-divider { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); padding: 8px 4px 4px; display: flex; align-items: center; gap: 8px; }
.pdm-group-divider::after { content:''; flex:1; height:1px; background: var(--border); }
/* P4-R018c: collapsed "DONE" section for LIST view's TODAY/THIS WEEK/
   UPCOMING grouped views (discovery basis P4-D033/P4-D034). The header
   reuses the existing shared .pdm-group-divider look directly (same reuse
   Schedule's own collapsible section headers already make, combining it
   with their own .pdm-schedule-section-hdr) — only the chevron/collapse-
   toggle mechanics get new, dedicated classes below, copying the visual
   *values* .pdm-schedule-section* already uses rather than sharing those
   selectors themselves. Starts collapsed (`.pdm-list-section.collapsed`),
   toggled via a plain DOM classList.toggle on the header's own onclick —
   same static ▸/▾ glyph-on-child-span technique as Schedule's own chevron.
   TODAY/THIS WEEK/UPCOMING's own static (non-collapsible) sub-dividers
   (TODAY/THIS WEEK/UPCOMING/OVERDUE/ACTIVE/DONE-under-ALL) need no new
   CSS at all — they reuse bare .pdm-group-divider, unmodified. */
.pdm-list-section-hdr { cursor: pointer; user-select: none; }
.pdm-list-section-chevron::before { content: '▾'; font-size: 8px; opacity: 0.7; }
.pdm-list-section.collapsed .pdm-list-section-chevron::before { content: '▸'; }
.pdm-list-section.collapsed .pdm-list-section-body { display: none; }
/* P4-R015c: Person Detail activity-row modernization (discovery basis
   P4-D026, stage C) — replaces the old flat `.pdm-item` row (still defined
   above, left in place as dead code, not removed) with a compact card that
   surfaces relationship/date/status/priority context at a glance. Visual
   language borrows the app's existing pill/chip vocabulary (`.due-chip`'s
   own color variants are reused unchanged) but is not a transplant of
   Today's `.gt-card` or Planner's `.planner-day-card` — this namespace
   (`.pdm-activity-*`) is entirely local to Person Detail and does not
   touch either of those. Badges/tags here are deliberately plain `<span>`s
   with no `onclick`, not the shared `_buildStatusBadge`/`_buildPriorityBadge`/
   `_buildTagChip`/`_subtaskChip` (those are real buttons that open edit
   dropdowns / the tag list / the editable subtask panel) — Person Detail
   must stay fully read-only, so only their color logic is reused, not
   their interactive markup. */
.pdm-activity-card {
  display: flex; flex-direction: column; gap: 4px;
  padding: 9px 12px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--border); border-left-width: 3px;
  background: var(--glass);
  margin-bottom: 6px; transition: all 0.15s;
}
.pdm-activity-card:hover { background: var(--glassh); border-color: var(--border2); }
/* P4-R015c-fix1: owner review — relationship (Lead/Contributor/Participant)
   must never mute the whole card or change its opacity; the old
   `.is-lead`/`.is-contrib` opacity/border rules below are no longer emitted
   by renderItem (left in place as dead code, not removed) — relationship
   is shown only via `.pdm-activity-role` below. The left border is now
   always colored by Priority instead (set inline per card, via the same
   `getPri(item.priority)` color logic already used elsewhere — see
   `border-left-width` above and the inline `border-left-color` style set
   by renderItem for every card, not just Lead cards). `.is-done` opacity
   is unrelated to relationship (it reflects completion, not who's involved)
   and is preserved unchanged. */
.pdm-activity-card.is-lead { border-left: 3px solid; }
.pdm-activity-card.is-contrib { opacity: 0.78; }
.pdm-activity-card.is-done { opacity: 0.5; }
.pdm-activity-card.is-done .pdm-activity-title { text-decoration: line-through; }
/* P4-R015c-fix2: owner review — done cards read as too muted while the
   DONE primary filter is active (every visible card is done anyway there,
   so the same 0.5 opacity fights the very view the user chose). The old
   `.pdm-primary-done` trigger is left in place, unused, not removed — no
   markup emits it anymore now that DONE moved from primary to a state
   subfilter (P4-R015c-fix3). */
.pdm-primary-done .pdm-activity-card.is-done { opacity: 0.88; }
/* P4-R015c-fix3: DONE is now a single-select state subfilter, not a
   primary filter — `_pdmList` wraps its own returned markup in
   `.pdm-state-done` only when the DONE state subfilter is selected;
   outside that, done cards keep the normal 0.5 opacity above. Three-class
   specificity beats the two-class rule above regardless of source order. */
.pdm-state-done .pdm-activity-card.is-done { opacity: 0.88; }
.pdm-activity-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
.pdm-activity-main { flex: 1; min-width: 0; }
.pdm-activity-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-top: 3px; }
.pdm-activity-chiprow { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
/* P4-R015c-fix1: locked 3-row card layout (owner-approved) — row1 is
   Type/Priority/Status (left) + strongest context chip/subtask count
   (right); row2 is Title (left) + relationship chip (right); row3 is tag
   chips (left) + date-pressure chip(s) + actual date/time text (right).
   `.pdm-activity-row-left`/`.pdm-activity-row-right` both wrap so a long
   title or many chips reflow rather than overflow. */
.pdm-activity-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pdm-activity-row-left, .pdm-activity-row-right { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; min-width: 0; }
.pdm-activity-row-right { flex-shrink: 0; justify-content: flex-end; }
/* P4-R015c-fix2: title bumped 13px/600 → 14px/700 per owner review ("title
   text should be slightly larger/stronger"). */
.pdm-activity-title { font-size: 14px; font-weight: 700; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; }
.pdm-activity-role { font-size: 9px; font-weight: 700; padding: 2px 8px; border-radius: 20px; white-space: nowrap; }
.pdm-activity-role.role-lead        { background: rgba(40,92,112,0.2);   color: var(--accent2); border: 1px solid rgba(79,154,181,0.35); }
.pdm-activity-role.role-contrib     { background: rgba(0,0,0,0.12);     color: var(--text2);    border: 1px solid var(--border); }
.pdm-activity-role.role-participant { background: rgba(127,138,167,0.12); color: var(--muted);  border: 1px solid rgba(127,138,167,0.24); }
.pdm-activity-date { font-size: 10px; color: var(--text2); font-family: var(--mono); white-space: nowrap; }
.pdm-activity-badge { font-size: 9px; font-weight: 700; padding: 2px 8px; border-radius: 20px; cursor: default; white-space: nowrap; }
.pdm-activity-tag { font-size: 9px; font-weight: 600; padding: 2px 7px; border-radius: 20px; cursor: default; white-space: nowrap; }
.pdm-activity-tag.clickable { cursor: pointer; transition: all 0.15s; }
.pdm-activity-tag.clickable:hover { opacity: 0.75; transform: translateY(-1px); filter: brightness(1.2); }
.pdm-activity-subtask { font-size: 9px; font-weight: 600; padding: 2px 7px; border-radius: 20px; cursor: default; white-space: nowrap; background: rgba(0,0,0,0.12); color: var(--text2); border: 1px solid var(--border); }
/* Row1-right "strongest context" chip — same color values as the existing
   .ctx-chip-overdue/.ctx-chip-due-today/.ctx-chip-starts-today rules
   (copied, not shared, to keep this namespace Person-Detail-scoped). */
.pdm-activity-chip { font-size: 9px; font-weight: 700; padding: 2px 8px; border-radius: 20px; cursor: default; white-space: nowrap; }
.pdm-activity-chip.ctx-overdue      { background: rgba(248,113,113,0.18); color: #F87171;        border: 1px solid rgba(248,113,113,0.35); }
.pdm-activity-chip.ctx-due-today    { background: rgba(40,92,112,0.18);   color: var(--accent2); border: 1px solid rgba(79,154,181,0.35); }
.pdm-activity-chip.ctx-starts-today { background: rgba(52,211,153,0.15);  color: #34D399;        border: 1px solid rgba(52,211,153,0.35); }
/* P4-R015c-fix2 introduced state-based group headers (OVERDUE/ACTIVE/DONE)
   with click-to-collapse behavior via a `_pdmToggleGroup` helper. P4-R015c-
   fix3 removed all group headers/collapse behavior per owner review (the
   list is now one flat sorted list — see _pdmList) and removed the now-
   unreferenced `_pdmToggleGroup` function entirely. The rules below are
   left in place, unused, not removed — no markup renders them anymore
   (same for the older type-based `.pdm-group-divider` header above it). */
.pdm-group { margin-bottom: 2px; }
.pdm-group-header {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 4px 4px; cursor: pointer; user-select: none;
  font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px;
  color: var(--muted); transition: color 0.15s;
}
.pdm-group-header:hover { color: var(--text2); }
.pdm-group-header::after { content:''; flex:1; height:1px; background: var(--border); }
.pdm-group-caret { font-size: 9px; flex-shrink: 0; width: 8px; }
.pdm-group-count { font-weight: 800; opacity: 0.85; }
.pdm-group-header.group-overdue .pdm-group-count { color: #F87171; opacity: 1; }

/* ============================================================
   TODAY REDESIGN LAYOUT — G.TAKE (pill strip, right panel, mini-calendar)
   ============================================================ */
.gt-layout {
  display: flex;
  flex-direction: row;
  gap: 0;
  flex: 1;           /* fills remaining height after hero + pills */
  overflow: hidden;  /* children manage their own scroll */
  min-height: 0;     /* required for flex children to shrink below content size */
}
/* ── Today tab panel columns ── */
.gt-main-col {
  flex: 1;
  overflow-y: auto;
  min-width: 0;
  min-height: 0;
  padding: 0 18px 32px 24px;
  display: flex;
  flex-direction: column;
  scrollbar-gutter: stable; /* always reserve scrollbar space — prevents layout jitter */
}
.gt-right-col {
  width: 340px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  /* P1-BUG002 (R001c): overflow:hidden is correct and required here.
     The column is a flex child of .gt-layout (itself overflow:hidden, 100vh-bounded),
     so it already has a bounded height — it cannot grow taller than the viewport.
     The calendar must stay inside this bounded box, not overflow it.
     The fix is in how notes and calendar share the available height (see below). */
  overflow: hidden;
  gap: 12px;
  padding: 0 24px 40px 16px;
  /* bottom:40px = one calendar row height (~40px) so the last row
     sits fully above the FAB zone — FAB only overlaps the border below */
  border-left: 1px solid var(--border);
}
/* Notes section — fills remaining space above calendar; notes scroll internally */
.gt-notes-section {
  /* P1-BUG002 (R001c): was flex:none (natural height, max-height capped).
     flex:none let the notes section grow with content until the max-height cap,
     but max-height:calc(100% - 320px) requires the parent to have an explicit
     height for % to resolve — it did not, so the cap was ineffective with many
     notes, pushing the calendar out of the bounded column.
     Fix: flex:1 + min-height:0 makes notes fill all available space in the column
     after the calendar takes its flex-shrink:0 min-height:300px. Notes then
     scroll internally via .gt-notes-list (overflow-y:auto, already in place).
     The calendar is always anchored at the bottom within the bounded column. */
  flex: 1;
  min-height: 80px;               /* minimum even when empty; flex:1 fills the rest */
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
/* Pinned notes card — fills the section, rounds correctly, notes scroll inside */
.gt-notes-card {
  flex: 1;             /* fills gt-notes-section */
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.gt-notes-list {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
  padding-bottom: 8px;
}

/* Calendar section — always anchored, never scrolls away */
.gt-cal-section {
  flex-shrink: 0;
  /* min-height guarantees calendar is always fully visible even on short screens */
  min-height: 300px;
  /* P1-BUG002: overflow:visible allows click events on calendar cells that fall
     near the bottom of .gt-right-col (which has overflow:hidden) to register
     correctly. Without this, bottom calendar rows are visually present but
     outside the parent hit-test zone. Pinned notes clipping is unaffected
     because notes live in .gt-notes-section, a sibling of .gt-cal-section. */
  overflow: visible;
}

@media (max-width: 1099px) {
  .gt-right-col { display: none; }
  .gt-main-col { padding-right: 24px; border-right: none; }
}
@media (max-width: 767px) {
  .gt-right-col { display: none; }
  .gt-main-col { padding-right: 14px; }
}

/* Hero header */
.gt-hero { margin-bottom: 14px; padding: 24px 24px 0; flex-shrink: 0; }
.gt-hero-sm { font-size: 11px; color: var(--muted); font-weight: 500; margin-bottom: 2px; }
.gt-hero-title { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; color: var(--text); }
.gt-hero-title em { color: var(--muted); font-style: normal; font-weight: 400; }
.gt-hero-title span { font-weight: 700; color: var(--text); }

/* KPI pill strip */
/* ── Clickable tag ── */
.tag-btn {
  font-size: 9px; font-weight: 600; padding: 2px 7px; border-radius: 20px;
  cursor: pointer; border: 1px solid transparent;
  font-family: var(--font); transition: all 0.15s; display: inline-flex;
  align-items: center;
}
.tag-btn:hover { opacity: 0.75; transform: translateY(-1px); filter: brightness(1.2); }

/* ============================================================
   FLOATING ACTION BUTTON (FAB)
   ============================================================ */
.fab-wrap {
  position: fixed; bottom: 28px; right: 28px;
  z-index: 8000; display: flex; flex-direction: column;
  align-items: flex-end; gap: 10px;
  /* P1-BUG002 (R001d): .fab-wrap has no explicit width and its layout box extends
     leftward far enough to overlap the right columns of the mini-calendar
     (Thu/Fri/Sat area). With pointer-events defaulting to auto, the transparent
     wrapper was intercepting clicks intended for calendar cells beneath it.
     Fix: pointer-events:none on the wrap passes all clicks through to elements
     below. The interactive children (.fab-main button and .fab-options.open)
     restore pointer-events:auto for themselves and remain fully clickable. */
  pointer-events: none;
}
.fab-wrap.hidden { display: none; }
.fab-main {
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(40,92,112,0.55); backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid rgba(79,154,181,0.4);
  box-shadow: 0 4px 16px rgba(40,92,112,0.4);
  color: #E8EDEF; font-size: 26px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; font-family: var(--font);
  line-height: 1;
  pointer-events: auto; /* restored: parent .fab-wrap has pointer-events:none */
}
.fab-main:hover { background: rgba(40,92,112,1); transform: scale(1.08); }
.fab-main.open { transform: rotate(45deg); background: rgba(40,92,112,1); }
[data-theme="light"] .fab-main { background: rgba(13,148,136,0.9); border-color: rgba(13,148,136,0.5); box-shadow: 0 4px 16px rgba(13,148,136,0.35); color: #fff; }
[data-theme="light"] .fab-main:hover { background: rgba(13,148,136,1); }
.fab-options {
  display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
  opacity: 0; pointer-events: none; transform: translateY(12px);
  transition: all 0.2s ease;
}
.fab-options.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
.fab-option {
  display: flex; align-items: center; gap: 10px; cursor: pointer;
  background: rgba(15,20,40,0.82); backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--border2); border-radius: 24px;
  padding: 8px 14px 8px 10px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  transition: all 0.15s; white-space: nowrap; font-family: var(--font);
}
.fab-option:hover { background: rgba(40,92,112,0.2); border-color: var(--accent); transform: translateX(-3px); }
.fab-option-icon { font-size: 16px; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--glass2); flex-shrink: 0; }
.fab-option-label { font-size: 12px; font-weight: 600; color: var(--text); }

/* ── Tag List Modal ── */
.tag-list-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--border); background: var(--glass);
  margin-bottom: 6px; transition: all 0.15s;
}
.tag-list-item:hover { background: var(--glassh); border-color: var(--border2); }
.tag-list-type  { font-size: 14px; flex-shrink: 0; }
.tag-list-body  { flex: 1; min-width: 0; }
.tag-list-title { font-size: 13px; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tag-list-meta  { font-size: 10px; color: var(--text2); margin-top: 2px; font-family: var(--mono); }

/* ============================================================
   SUBTASKS
   ============================================================ */
.subtask-section { margin-top: 16px; }
.subtask-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
}
.subtask-header-lbl { font-size: 11px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: 0.6px; }
.subtask-summary { font-size: 11px; color: var(--muted); }
.subtask-list { display: flex; flex-direction: column; gap: 4px; }
.subtask-row {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 10px; border-radius: 8px;
  background: var(--glass); border: 1px solid var(--border);
  transition: all 0.15s;
}
.subtask-row:hover { background: var(--glassh); }
.subtask-check {
  width: 16px; height: 16px; border-radius: 4px; flex-shrink: 0;
  border: 2px solid var(--border2); background: transparent;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; font-size: 10px; color: #fff;
}
.subtask-check.checked { background: var(--green); border-color: var(--green); }
.subtask-check.checked::after { content: '✓'; }
.subtask-text { flex: 1; font-size: 12px; color: var(--text2); cursor: pointer; }
.subtask-text.done { text-decoration: line-through; opacity: 0.5; }
.subtask-ts {
  font-size: 10px; color: var(--muted); margin-left: auto;
  flex-shrink: 0; white-space: nowrap; padding-left: 8px;
}
.subtask-ts-edit { font-size: 9px; color: var(--muted); }
.subtask-del { width: 18px; height: 18px; border-radius: 4px; border: none;
  background: none; color: var(--muted); cursor: pointer; font-size: 12px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  opacity: 0; transition: opacity 0.15s;
}
.subtask-row:hover .subtask-del { opacity: 1; }
.subtask-del:hover { background: rgba(248,113,113,0.15); color: var(--red); }
/* P4-R013c: archived TEE Detail Subtasks now render via _buildSubtaskRows'
   readOnly mode (discovery basis P4-D024) — these rows carry no onclick at
   all, but without this override they would still visually hover/cursor
   exactly like an interactive row (misleading, since clicking does nothing
   by design). Narrow, additive-only: does not touch .subtask-row/-check/
   -text's own base rules above, so active TEE Detail rows and the Kanban
   openSubtaskPanel rows (neither of which ever render `.is-readonly`) are
   completely unaffected. */
.subtask-row.is-readonly:hover { background: var(--glass); }
.subtask-row.is-readonly .subtask-check,
.subtask-row.is-readonly .subtask-text { cursor: default; }
.subtask-edit-input {
  flex: 1; background: transparent; border: none; outline: none;
  font-size: 12px; color: var(--text); font-family: var(--font);
  padding: 0;
}
.subtask-add-row {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px; border-radius: 8px;
  border: 1px dashed var(--border2); margin-top: 4px;
  background: transparent; cursor: text; transition: all 0.15s;
}
.subtask-add-row:focus-within { border-color: var(--accent); background: var(--glass); }
.subtask-add-input {
  flex: 1; background: transparent; border: none; outline: none;
  font-size: 12px; color: var(--text); font-family: var(--font);
  padding: 0;
}
.subtask-add-input::placeholder { color: var(--muted); }

/* Subtask indicator on cards — compact ☐ X/Y */
.subtask-chip {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 9px; font-weight: 700; color: var(--muted);
  white-space: nowrap; cursor: pointer; flex-shrink: 0;
  padding: 2px 6px; border-radius: 20px;
  border: 1px solid var(--border); background: var(--glass);
  transition: all 0.15s;
}
.subtask-chip:hover { border-color: var(--border2); color: var(--text2); }
.subtask-chip.all-done { color: var(--green); border-color: rgba(52,211,153,0.3); background: rgba(52,211,153,0.08); }

/* Subtask floating panel (Kanban) */
.subtask-panel {
  position: fixed; z-index: 9999;
  background: var(--glass2); backdrop-filter: var(--blur);
  border: 1px solid var(--border2); border-radius: 13px;
  padding: 12px; min-width: 240px; max-width: 300px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  animation: slideUp 0.15s ease;
}
.subtask-panel-hdr { font-size: 11px; font-weight: 700; color: var(--text2); margin-bottom: 8px; display: flex; justify-content: space-between; }

/* ── G.Take card redesign ── */
.gt-card {
  background: var(--glass); border: 1px solid var(--border);
  border-radius: 13px; padding: 12px 14px; cursor: pointer;
  transition: all 0.18s;
}
.gt-card:hover { border-color: var(--border2); background: var(--glassh); transform: translateY(-1px); box-shadow: var(--glow-card); }
.gt-card-row1 { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
.gt-card-row1-right { margin-left: auto; flex-shrink: 0; }
.gt-card-title { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; color: var(--text); margin-bottom: 2px; }
.gt-card-desc-sm { font-size: 11px; color: var(--text2); line-height: 1.4; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 1; min-width: 0; }
.gt-card-footer { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.gt-card-footer-left { display: flex; align-items: center; gap: 5px; min-width: 0; }
.gt-card-footer-right { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.gt-pill-strip {
  display: flex; align-items: center; gap: 5px;
  flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
  padding: 0 0 2px; margin-bottom: 14px;
  flex-shrink: 0;
}
.gt-pill-strip::-webkit-scrollbar { display: none; }
.gt-fpill {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 11px; border-radius: 20px; cursor: pointer;
  border: 1px solid var(--border); background: var(--glass);
  white-space: nowrap; transition: all 0.18s; flex-shrink: 0;
  font-family: var(--font);
}
.gt-fpill:hover { border-color: var(--border2); background: var(--glass2); }
.gt-fpill-active { font-weight: 600; }
.gt-fpill-num { font-size: 14px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
.gt-fpill-lbl { font-size: 9px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
.gt-fpill-div { color: var(--border2); font-size: 14px; flex-shrink: 0; padding: 0 2px; user-select: none; }

/* Week view day headers */
.gt-week-day-hdr {
  font-size: 12px; font-weight: 700; color: var(--text2);
  padding: 8px 4px 6px; border-bottom: 1px solid var(--border);
  margin-bottom: 8px; margin-top: 4px;
}

/* Legacy — kept for Kanban compact view */
.gt-fchip.active { background: rgba(40,92,112,0.2); color: var(--accent2); border-color: rgba(40,92,112,0.35); }
.gt-new-btn {
  margin-left: auto; padding: 5px 14px; border-radius: 20px; border: none;
  background: var(--accent); color: #fff; font-size: 11px; font-weight: 700;
  cursor: pointer; white-space: nowrap; flex-shrink: 0; font-family: var(--font);
  transition: all 0.18s;
}
.gt-new-btn:hover { background: var(--accent2); transform: translateY(-1px); }

/* G.Take task cards */
.gt-task-list { display: flex; flex-direction: column; gap: 8px; }
.gt-card {
  background: var(--glass); border: 1px solid var(--border);
  border-radius: 13px; padding: 14px 16px; cursor: pointer;
  transition: all 0.18s;
}
.gt-card:hover { border-color: var(--border2); background: var(--glassh); transform: translateY(-1px); box-shadow: var(--glow-card); }
.gt-card-top { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
.gt-badge { font-size: 8px; font-weight: 700; padding: 2px 8px; border-radius: 20px; letter-spacing: 0.4px; }
.gt-badge-today { background: rgba(40,92,112,0.2); color: var(--accent2); border: 1px solid rgba(79,154,181,0.28); }
.gt-badge-prog  { background: rgba(34,211,238,0.15);  color: var(--cyan);    border: 1px solid rgba(34,211,238,0.28); }
.gt-badge-over  { background: rgba(248,113,113,0.18); color: var(--red);     border: 1px solid rgba(248,113,113,0.28); }
.gt-badge-start { background: rgba(52,211,153,0.15);  color: var(--green);   border: 1px solid rgba(52,211,153,0.28); }
.gt-badge-event { background: rgba(34,211,238,0.12);  color: var(--cyan);    border: 1px solid rgba(34,211,238,0.22); }
.gt-badge-entry { background: rgba(251,191,36,0.12);  color: var(--yellow);  border: 1px solid rgba(251,191,36,0.22); }
.gt-card-id { font-size: 8px; font-family: var(--mono); color: var(--muted); }
.gt-card-title { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 3px; color: var(--text); }
.gt-card-desc { font-size: 11px; color: var(--text2); line-height: 1.45; margin-bottom: 8px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.gt-card-desc-wrap { font-size: 11px; color: var(--text2); line-height: 1.45; margin-bottom: 8px; white-space: normal; word-break: break-word; }
.gt-card-footer { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.gt-tag { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 600; border: 1px solid; }
.gt-card-meta { font-size: 9px; font-family: var(--mono); color: var(--muted); margin-left: auto; }

/* Right panel */
.gt-right-panel { display: flex; flex-direction: column; gap: 12px; }
.gt-panel-card {
  background: var(--glass); border: 1px solid var(--border);
  border-radius: 13px; padding: 14px;
}
.gt-panel-hdr {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.gt-panel-title { font-size: 13px; font-weight: 700; color: var(--text2); }
.gt-pin-note { border-radius: 10px; padding: 9px 30px 9px 11px; font-size: 11px; line-height: 1.55; font-weight: 500; margin-bottom: 6px; position: relative; }
.gt-pin-note:last-child { margin-bottom: 0; }
.gt-pin-unpin { position: absolute; top: 6px; right: 7px; width: 16px; height: 16px; border-radius: 4px; background: rgba(0,0,0,0.15); border: none; cursor: pointer; font-size: 9px; color: inherit; opacity: 0.55; display: flex; align-items: center; justify-content: center; }

/* ── Mini-Calendar (right panel) ── */
.gt-mini-cal { }
.gt-mc-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; margin-top: 6px; }
.gt-mc-dlbl { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); text-align: center; padding-bottom: 3px; }
.gt-mc-cell {
  aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; border-radius: 6px; cursor: pointer;
  color: var(--text2); position: relative; transition: all 0.15s;
  padding: 1px 0;
}
.gt-mc-cell:hover { background: var(--glass2); color: var(--text); }
.gt-mc-cell.other { opacity: 0.25; pointer-events: none; }
.gt-mc-cell.today-mc { background: rgba(79,154,181,0.28); color: var(--accent2); font-weight: 800; border-radius: 6px; }
.gt-mc-cell.has-items::after { content:''; display: block; width: 5px; height: 5px; border-radius: 50%; background: var(--accent2); margin-top: 1px; flex-shrink: 0; }
.gt-mc-legend { display: flex; gap: 12px; margin-top: 6px; font-size: 9px; color: var(--muted); }
.gt-mc-legend span { display: flex; align-items: center; gap: 4px; }
.gt-mc-legend i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

/* ============================================================
   STICKY NOTES — draggable, floating
   ============================================================ */
#sticky-layer {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 900;
}
.sticky-note {
  width: 240px; min-height: 140px; border-radius: 14px;
  padding: 18px 16px 14px; font-size: 14px; line-height: 1.6;
  position: absolute; cursor: grab;
  box-shadow: 4px 6px 22px rgba(0,0,0,0.4);
  transition: box-shadow 0.2s; pointer-events: all; user-select: none;
}
.sticky-note:active { cursor: grabbing; box-shadow: 8px 12px 32px rgba(0,0,0,0.55); }
.sticky-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.7px; opacity: 0.65; margin-bottom: 8px; cursor: grab; display: flex; align-items: center; gap: 4px; }
.sticky-text { font-size: 14px; line-height: 1.6; pointer-events: none; font-weight: 500; }
.sticky-del {
  position: absolute; top: 8px; right: 8px;
  width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,0.18);
  border: none; font-size: 10px; color: inherit; opacity: 0; transition: opacity 0.15s; cursor: pointer;
  display: flex; align-items: center; justify-content: center; pointer-events: all;
}
.sticky-note:hover .sticky-del { opacity: 1; }
.sticky-manager { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--glass); border: 1px solid var(--border); border-radius: var(--radius); margin-top: 8px; }
.sticky-count { font-size: 12px; color: var(--text2); flex: 1; }
.sticky-preview-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.sticky-chip { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 500; display: flex; align-items: center; gap: 6px; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); transition: transform 0.15s; }
.sticky-chip:hover { transform: translateY(-1px); }

/* ============================================================
   CALENDAR — responsive monthly grid
   ============================================================ */
.cal-wrap {
  background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
  width: 100%;
  display: flex; flex-direction: column;
  height: calc(100vh - 220px);
  min-height: 400px;
}
.cal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: clamp(10px, 1.4vw, 16px) clamp(12px, 1.8vw, 22px);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.cal-title  { font-size: clamp(14px, 1.5vw, 18px); font-weight: 700; }
.cal-nav    { display: flex; gap: 6px; }
.cal-nav-btn {
  width: clamp(28px, 2.8vw, 34px); height: clamp(28px, 2.8vw, 34px); border-radius: 9px;
  background: var(--glass2); border: 1px solid var(--border2);
  color: var(--text2); font-size: clamp(11px, 1.1vw, 15px);
  display: flex; align-items: center; justify-content: center; transition: all 0.15s;
}
