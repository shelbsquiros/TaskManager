// ── TAGS CATALOG (read-only, additive metadata — P4-R027) ────
// Normalize a raw NormalizedKey/Tag cell into the catalog's comparison key: trim, strip one leading '#', trim, lowercase
function _normalizeTagCatalogKey(raw) {
  return (raw||'').trim().replace(/^#/,'').trim().toLowerCase();
}
// Interpret a sheet "Active" cell; blank/missing defaults to TRUE (keeps manually added rows active unless explicitly set FALSE)
function _parseTagCatalogActive(raw) {
  if (raw === undefined || raw === null) return true;
  if (raw === true) return true;
  if (raw === false) return false;
  const s = String(raw).trim();
  if (s === '') return true;
  return s.toUpperCase() === 'TRUE';
}
async function loadTagCatalog() {
  try {
    const rows = await sheetGetAll(CONFIG.SHEETS.tags);
    const seen = new Set();
    const catalog = [];
    (rows||[]).forEach(r => {
      const tag = (r['Tag']||'').trim();
      if (!tag) return;
      let normalizedKey = _normalizeTagCatalogKey(r['NormalizedKey']);
      if (!normalizedKey) normalizedKey = _normalizeTagCatalogKey(tag);
      if (!normalizedKey) return;
      if (seen.has(normalizedKey)) {
        console.warn('loadTagCatalog: duplicate NormalizedKey skipped —', normalizedKey);
        return;
      }
      seen.add(normalizedKey);
      catalog.push({
        tag:           tag,
        normalizedKey: normalizedKey,
        color:         (r['Color']||'').trim(),
        active:        _parseTagCatalogActive(r['Active']),
        createdAt:     r['CreatedAt']||'',
        updatedAt:     r['UpdatedAt']||'',
      });
    });
    STATE.tagCatalog = catalog;
  } catch(e) {
    console.warn('loadTagCatalog failed, falling back to empty catalog:', e.message);
    STATE.tagCatalog = [];
  }
  return STATE.tagCatalog;
}
// Read-only lookup: returns the STATE.tagCatalog entry matching tagName's normalized identity, or null.
// No sheet I/O, no side effects; ignores `active` entirely (P4-R028 — color resolution only).
function _getTagCatalogEntry(tagName) {
  if (!tagName || !Array.isArray(STATE.tagCatalog)) return null;
  const key = _normalizeTagCatalogKey(tagName);
  if (!key) return null;
  return STATE.tagCatalog.find(e => e.normalizedKey === key) || null;
}
// Validate/normalize a catalog Color cell into a 6-digit '#RRGGBB' string, or null if invalid.
// Accepts #RGB or #RRGGBB (case-insensitive hex digits) only — no named colors, rgba, or missing '#'.
function _normalizeTagCatalogColor(raw) {
  const s = (raw||'').trim();
  const short = /^#([0-9a-fA-F]{3})$/.exec(s);
  if (short) {
    const [r,g,b] = short[1].split('');
    return '#' + r+r+g+g+b+b;
  }
  if (/^#[0-9a-fA-F]{6}$/.test(s)) return s;
  return null;
}

/* ─── ARCHIVE HELPERS ─── */

// Returns true if a date string is older than CONFIG.ARCHIVE_DAYS days
function isArchivePeriod(dateStr) {
  if (!dateStr) return false;
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return false;
  const boundary = new Date(TODAY);
  boundary.setDate(boundary.getDate() - CONFIG.ARCHIVE_DAYS);
  return d < boundary;
}

// Returns the relevant date string for an item (for archive age checks)
function _itemDate(item) {
  return item.type === 'task' ? (item.dueDate || item.startDate) : item.date;
}

// Auto-archive — runs once per day, silently moves old items
async function autoArchive() {
  if (!STATE.sheetConnected) return;

  // Daily gate
  const today = fmtDate(new Date());
  if (localStorage.getItem('lastArchiveDate') === today) return;

  const toArchive = STATE.items.filter(item => {
    const d = _itemDate(item);
    if (!isArchivePeriod(d)) return false;
    // Tasks: only archive if Completed
    if (item.type === 'task') return parseStatus(item.status).state === 'Completed';
    // Events and entries: archive if date is old enough regardless of status
    return true;
  });

  // ── System closure: mark past Events/Entries as Done if still Open ─────
  // Same daily gate as archive — runs once per day on first load
  const todayD2 = fmtDate(new Date());
  const toClose = STATE.items.filter(item => {
    if (item.type === 'task') return false; // tasks handle their own status
    const itemDate = item.date || item.dueDate;
    if (!itemDate || itemDate >= todayD2) return false; // not past
    const { state } = parseStatus(item.status);
    return !state || state === 'Open'; // only close Open/blank ones
  });

  if (toClose.length > 0) {
    try {
      await Promise.all(toClose.map(item => {
        item.status = 'Done';
        return saveTEE(item);
      }));
      console.log(`[autoArchive] System-closed ${toClose.length} past Events/Entries`);
    } catch(e) {
      console.warn('System closure failed (non-critical):', e.message);
    }
  }

  if (toArchive.length === 0) {
    localStorage.setItem('lastArchiveDate', today);
    return;
  }

  // Write all to archive sheet then delete from active sheet
  try {
    await Promise.all(toArchive.map(item => saveArchiveItem(item, 'auto')));
    await Promise.all(toArchive.map(item => deleteTEE(item.id)));

    // Remove from STATE.items and add to archiveCache
    const ids = new Set(toArchive.map(i => i.id));
    STATE.items = STATE.items.filter(i => !ids.has(i.id));
    toArchive.forEach(item => {
      item.archivedDate = today;
      item.archivedBy   = 'auto';
      const key = (_itemDate(item) || today).substring(0, 7);
      if (!STATE.archiveCache[key]) STATE.archiveCache[key] = [];
      STATE.archiveCache[key].push(item);
    });

    localStorage.setItem('lastArchiveDate', today);
    toast(`Archived ${toArchive.length} old item${toArchive.length > 1 ? 's' : ''}`, 'info');
    renderAll();
  } catch(e) {
    console.warn('Auto-archive failed:', e.message);
  }
}

// Manually archive a single item immediately (from detail view)
async function archiveItem(id) {
  const item = STATE.items.find(i => i.id === id);
  if (!item) return;
  // Store id for the confirm button to use — avoids closure serialization issue
  window._pendingArchiveId = id;
  openModal(`
    <div style="padding:4px 0 12px">
      <div style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:10px">Archive Item</div>
      <div style="font-size:14px;color:var(--text2);line-height:1.6">"<strong>${item.title}</strong>" will be moved to the archive. You can restore it at any time.</div>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="clearNav()">Cancel</button>
      <button style="background:rgba(251,191,36,0.12);color:var(--yellow);border:1px solid rgba(251,191,36,0.35);height:36px;padding:0 16px;border-radius:10px;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;"
        onclick="clearNav();_doArchive(window._pendingArchiveId)">Archive</button>
    </div>`);
}

async function _doArchive(id) {
  const item = STATE.items.find(i => i.id === id);
  if (!item) { toast('Item not found', 'error'); return; }
  try {
    await saveArchiveItem(item, 'manual');
    await deleteTEE(id);
    STATE.items = STATE.items.filter(i => i.id !== id);
    item.archivedDate = fmtDate(new Date());
    item.archivedBy   = 'manual';
    const key = (_itemDate(item) || fmtDate(new Date())).substring(0, 7);
    if (!STATE.archiveCache[key]) STATE.archiveCache[key] = [];
    STATE.archiveCache[key].push(item);
    renderAll();
    toast('Item archived', 'info');
  } catch(e) {
    toast(`Archive failed: ${e.message||'unknown error'}`, 'error');
    console.error('Archive error:', e);
  }
}

// Restore an item from archive back to active sheet
async function restoreFromArchive(id) {
  // Find in archiveCache
  let found = null, foundKey = null;
  for (const [key, items] of Object.entries(STATE.archiveCache)) {
    if (key === '_fetched') continue;
    const match = items.find(i => i.id === id);
    if (match) { found = match; foundKey = key; break; }
  }
  if (!found) { toast('Item not found in archive', 'error'); return; }

  try {
    await saveTEE(found);
    await deleteArchiveItem(id);
    STATE.items.push(found);
    STATE.archiveCache[foundKey] = STATE.archiveCache[foundKey].filter(i => i.id !== id);
    clearNav();
    renderAll();
    toast('✅ Restored to active', 'success');
  } catch(e) {
    toast('Restore failed — try again', 'error');
  }
}

  if (done === total) return `${total} Subtasks · All Done ✓`;
  if (done === 0) return `${total} Subtask${total>1?'s':''}`;

// Shared "detail view" modal header — used by openTEEDetail.
// colorSwatch defaults to '' for consumers that don't render one.
// P4-R013a-fix1: header restructured per owner visual review (discovery
// basis P4-D023) — Row 1 is now Title (left) + close button (right); Row 2
// is a compact Type/Priority/Status chip row (Status is newly added here,
// moved out of the Details section body — see openTEEDetail). The visible
// TEE id line is removed entirely. Priority keeps its existing
// openPriorityDropdown onclick/behavior unchanged. Status is built inline
// here using the exact same id/onclick/color logic _buildDetailStatusRow
// already used (that function itself is unchanged; its only call site was
// removed from openTEEDetail's Details section, since Status now renders
// here instead) — this preserves the existing in-place status-button-update
// selector (`#detail-status-btn-<id>, [onclick*="openStatusDropdown(...)"]`),
// which matches by onclick content as well as by id.
// P4-R013a-fix2: Type chip emoji removed per owner visual review — the
// `typeIcon` parameter is intentionally left in the signature (still passed
// by openTEEDetail's only call site) but no longer rendered, so the chip
// reads as plain text ("Task"/"Event"/"Entry") only.
function buildModalDetailHeader(item, typeIcon, typeLabel, pri, colorSwatch = '') {
  const _sc = getStatusColor(getDisplayStatus(item)) || '#64748B';
  const { state: _hdrState, doneAt } = parseStatus(item.status);

  // P4-R013a-fix5: full-date formatter local to this header (discovery
  // basis P4-D023, owner visual review) — mirrors openTEEDetail's own
  // fmtDisplayDate exactly (full weekday + full month names). Kept as its
  // own tiny copy here rather than shared, since taking a dependency on
  // openTEEDetail's local helper would require a new parameter at the
  // single call site for no real benefit — buildModalDetailHeader has no
  // other date-formatting need.
  const _fmtHdrDate = str => {
    if (!str) return '';
    const d = new Date(str + 'T00:00:00');
    return d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
  };

  // P4-R013a-fix5: terminal timestamp now renders inline after the Status
  // chip as full date + time (undoes fix4's separate Details-section row
  // per owner review — that row is no longer built in openTEEDetail at
  // all). Only renders when parseStatus's state is exactly Completed or
  // Done and a timestamp exists; a missing/malformed timestamp renders
  // nothing extra. Display-only — parseStatus and saveTEEModal's terminal-
  // timestamp write logic are both untouched.
  let _doneAtHTML = '';
  if ((_hdrState === 'Completed' || _hdrState === 'Done') && doneAt) {
    const _dtParts   = doneAt.split(' ');
    const _dtDateFmt = _fmtHdrDate(_dtParts[0]);
    const _dtTimeFmt = _dtParts[1] ? fmtTime(_dtParts[1]) : '';
    if (_dtDateFmt) {
      _doneAtHTML = `<span class="tee-detail-header-timestamp">${_dtDateFmt}${_dtTimeFmt ? ` <span class="tee-detail-dot">·</span> ${_dtTimeFmt}` : ''}</span>`;

// Group 1 — Context chips: label the DATE RELATIONSHIP (today/overdue/starts)
// _buildContextChips(t) returns HTML for all applicable Group 1 chips
function _buildContextChips(t, refDate) {
  // refDate: YYYY-MM-DD string — defaults to real today if not passed
  const refStr   = refDate || fmtDate(TODAY);
  const st       = parseStatus(t.status).state;
  const done     = st === 'Completed' || st === 'Done';
  let chips      = '';

  // Overdue — past due date relative to refDate, not completed
  if (!done && t.dueDate && t.dueDate < refStr) {
    chips += `<span class="ctx-chip" style="${_chipStyle('overdue', true)}">Overdue</span>`;
  }
  // Due Today — due date matches the reference date
  if (!done && t.dueDate === refStr) {
    chips += `<span class="ctx-chip" style="${_chipStyle('dueToday', true)}">Due Today</span>`;
  }
  // Starts Today — start date matches reference date (tasks only)
  if (!done && t.startDate && t.startDate === refStr && t.dueDate !== refStr) {
    chips += `<span class="ctx-chip" style="${_chipStyle('startsToday', true)}">Starts Today</span>`;
  }
  return chips;
}

// Group 2 — Counter chips: show NUMERIC DISTANCE from today
// _buildCounterChip(dueDate) returns one chip showing days remaining/over
function _buildCounterChip(dueDate, refDate) {
  if (!dueDate) return '';
  // refDate: YYYY-MM-DD string — defaults to real today if not passed
  const days = daysBetween(refDate || null, dueDate);
  if (days === null) return '';
  if (days < 0)  return `<span class="due-chip" style="${_chipStyle('counterOver')}">${Math.abs(days)}d Over</span>`;
  if (days === 0) return `<span class="due-chip" style="${_chipStyle('counterToday')}">Today</span>`;
  if (days <= 2)  return `<span class="due-chip" style="${_chipStyle('counterWarn')}">${days}d</span>`;
  return `<span class="due-chip" style="${_chipStyle('counterOk')}">${days}d</span>`;
}

// Discovery basis: P4-D022. Read-only display layer over the item.links
// data model + Add/Edit editor already shipped in P4-R012a — does not
// change storage format, save/load behavior, or the Add/Edit editor
// itself. Dedicated .tee-detail-link-* namespace and dedicated helper
// functions only — not reusing Directory/Folders' .dir-card-action-link
// or the Add/Edit .tee-link-* editor classes (different surface, this one
// is read-only).

// Narrow escaping helpers scoped to this feature only — not an app-wide
// escaping refactor. _escapeTEEText is safe for HTML text-node content;
// _escapeTEEAttr additionally escapes quote characters so the same value
// can be safely placed inside an HTML attribute (href, title, data-*).
function _escapeTEEText(str) {
  return (str == null ? '' : String(str)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function _escapeTEEAttr(str) {
  return _escapeTEEText(str).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Classifies a raw Links URL/path string into a safe-to-render shape.
// Never mutates the stored item.links value and never saves anything —
// display/open/copy only. Preserves the original raw value for display
// and Copy Path; only `href` (used for the Open action) is ever derived/
// normalized. Windows-drive-letter and Mac/Linux-absolute-path patterns
// are checked BEFORE generic scheme detection so a single drive letter
// (e.g. "D:") is never mistaken for a URI scheme. Allowed clickable
// schemes are an allow-list (http/https/file) — anything else explicit
// (javascript:, data:, vbscript:, or any other scheme) is classified
// 'unsafe' and never gets a non-empty href.
function _classifyTEELinkTarget(rawUrl) {
  const raw = (rawUrl == null ? '' : String(rawUrl)).trim();
  if (!raw) return { kind:'unknown', raw:'', href:'', canOpen:false, canCopy:false, reason:'blank' };

  // Windows local path — checked first so "D:" is never read as a scheme.
  if (/^[A-Za-z]:[\\\/]/.test(raw)) {
    const drive = raw.slice(0, 2);
    const rest  = raw.slice(2).replace(/\\/g,'/').split('/').filter(Boolean).map(encodeURIComponent).join('/');
    return { kind:'local', raw, href:'file:///' + drive + '/' + rest, canOpen:true, canCopy:true };
  }
  // Mac/Linux absolute path — checked before scheme detection for the same reason.
  if (/^\//.test(raw)) {
    const rest = raw.split('/').filter(Boolean).map(encodeURIComponent).join('/');
    return { kind:'local', raw, href:'file:///' + rest, canOpen:true, canCopy:true };
  }

  // Explicit scheme (2+ letters — a single drive letter can never match this).
  const schemeMatch = raw.match(/^([a-zA-Z][a-zA-Z0-9+.-]{1,}):/);
  const scheme = schemeMatch ? schemeMatch[1].toLowerCase() : '';
  if (scheme) {
    const ALLOWED = ['http', 'https', 'file'];
    if (!ALLOWED.includes(scheme)) {
      return { kind:'unsafe', raw, href:'', canOpen:false, canCopy:true, reason:'unsafe scheme: ' + scheme };
    }
    return { kind: scheme === 'file' ? 'file' : 'web', raw, href: raw, canOpen:true, canCopy:true };
  }

  // No scheme, not a recognized local path — domain shorthand (example.com, www.example.com/path).
  if (/^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+(\/\S*)?$/i.test(raw)) {
    return { kind:'web', raw, href:'https://' + raw, canOpen:true, canCopy:true };
  }

  return { kind:'unknown', raw, href:'', canOpen:false, canCopy:true, reason:'unrecognized format' };
}

// Fallback display name when a link's Name is blank: hostname for web
// targets, last path segment for file/local targets, else the literal
// string "Link".
function _teeLinkFallbackName(target) {
  if (target.kind === 'web') {
    try { return new URL(target.href).hostname || 'Link'; } catch { return 'Link'; }
  }
  if (target.kind === 'file' || target.kind === 'local') {
    const parts = target.raw.split(/[\\\/]/).filter(Boolean);
    return parts.length ? parts[parts.length - 1] : 'Link';
  }
  return 'Link';
}

// Builds the TEE Detail Links section. Accepts item.links, normalizes to
// an array safely, filters out entries with a blank url, and returns ''
// when there are no valid rows (so a blank/missing item.links renders
// nothing, per spec). Never shows raw JSON or blank rows. Web links get an
// Open action (target="_blank" rel="noopener noreferrer"); file/local
// links get both Open (best-effort) and Copy Path; unsafe schemes render
// inertly with a small muted note and no Open action; unknown/unparseable
// values render as plain text with no action at all.
// P4-R012b-fix1: Correction over the initial P4-R012b pass, per owner
// review — the original one-card-per-link layout with a visible muted
// URL/path line underneath each name read as noisy. This pass replaces it
// with a single outer Links card containing one compact, wrapping pill per
// link; the link's display name IS the clickable action (icon + name, no
// separate generic "Open" label), and the raw URL/path is no longer shown
// as a visible line — it is still preserved internally for href, the
// title tooltip, and Copy Path, exactly as before. Classification logic
// (_classifyTEELinkTarget), the fallback-name rules, Open safety
// (target="_blank" rel="noopener noreferrer", allow-listed schemes only),
// and Copy Path behavior (copyTEELinkPath) are all unchanged — only this
// function's output markup/CSS changed.
function _buildTEELinksDetailSection(links) {
  const valid = (Array.isArray(links) ? links : [])
    .map(l => ({ name: (l && l.name != null) ? String(l.name) : '', url: (l && l.url != null) ? String(l.url).trim() : '' }))
    .filter(l => l.url);
  if (!valid.length) return '';

  const items = valid.map(l => {
    const target = _classifyTEELinkTarget(l.url);
    const displayName = (l.name || '').trim() || _teeLinkFallbackName(target);
    const safeName = _escapeTEEText(displayName);
    const safeRawAttr = _escapeTEEAttr(target.raw);

    if (target.kind === 'web') {
      const safeHref = _escapeTEEAttr(target.href);
      return `<span class="tee-detail-link-item">`
        + `<a class="tee-detail-link-action" href="${safeHref}" target="_blank" rel="noopener noreferrer" title="${safeRawAttr}">`
        + `<i class="ti ti-external-link"></i> ${safeName}</a>`
        + `</span>`;
    }
    if (target.kind === 'file' || target.kind === 'local') {
      const safeHref = _escapeTEEAttr(target.href);
      return `<span class="tee-detail-link-item">`
        + `<a class="tee-detail-link-action" href="${safeHref}" target="_blank" rel="noopener noreferrer" title="${safeRawAttr} — local file opening may depend on your browser/security settings">`
        + `<i class="ti ti-external-link"></i> ${safeName}</a>`
        + `<button type="button" class="tee-detail-link-action" onclick="copyTEELinkPath(this)" data-tee-link-path="${safeRawAttr}" title="Copy Path">`
        + `<i class="ti ti-copy"></i> Copy Path</button>`
        + `</span>`;
    }
    if (target.kind === 'unsafe') {
      return `<span class="tee-detail-link-item tee-detail-link-inert" title="${safeRawAttr}">`
        + `${safeName}<span class="tee-detail-link-muted"> — Blocked unsafe link</span>`
        + `</span>`;
    }
    // 'unknown' kind: inert plain-text name only, no action, no note.
    return `<span class="tee-detail-link-item tee-detail-link-inert" title="${safeRawAttr}">${safeName}</span>`;
  }).join('');

  // fix4: top margin 14px -> 0 (owner review of P4-R013a-fix3 — Notes-to-
  // Links gap read as "an empty field exists there"). This div has no
  // class of its own, so no external Detail-scoped CSS rule could reach
  // it — the only way to close that gap was this one inline value. Nothing
  // else here changed: link classification, hrefs, Copy Path, and the
  // bottom margin (spacing before the pill row) are all untouched.
  return `
    <div class="tee-detail-links">
      <div style="font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.6px;margin:0 0 4px">Links</div>
      <div class="tee-detail-link-list">${items}</div>
    </div>`;
}

// Copies a Links row's original raw value (not the generated file:// href)
// to the clipboard. Reads the value from the clicked button's own
// data-tee-link-path attribute (via .dataset) rather than embedding the
// raw string inside the onclick attribute itself — this avoids having to
// hand-escape backslashes/quotes for a Windows path inside a JS string
// literal, which would be fragile. Uses the modern Clipboard API when
// available, falling back to a temporary offscreen textarea +
// document.execCommand('copy') otherwise (works for both Windows and Mac
// path strings either way, since both are just plain text to the
// clipboard). Fails gracefully — no alert, no thrown error surfaced to
// the user — if the clipboard is unavailable or permission is denied.
function copyTEELinkPath(btnEl) {
  const raw = btnEl?.dataset?.teeLinkPath || '';
  if (!raw) return;
  const showCopied = () => {
    if (!btnEl) return;
    if (btnEl.dataset.teeLinkOriginalLabel === undefined) {
      btnEl.dataset.teeLinkOriginalLabel = btnEl.innerHTML;
    }
    btnEl.textContent = 'Copied';
    setTimeout(() => {
      if (btnEl.isConnected) btnEl.innerHTML = btnEl.dataset.teeLinkOriginalLabel;
    }, 1200);
  };
  const legacyFallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = raw;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showCopied();
    } catch (e) { /* clipboard unavailable/denied — fail silently, no alert */ }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(raw).then(showCopied).catch(legacyFallback);
  } else {
    legacyFallback();
  }
}
window.copyTEELinkPath = copyTEELinkPath;

// Extract trailing hashtags from note text — safety net for manually typed tags
// Reads backwards from end collecting consecutive #word tokens
// Stops at first non-hashtag word — mid-text #3 or #invoice are never captured
function extractStickyTags(text) {
  if (!text) return { cleaned: '', tags: [] };
  const words = text.trim().split(/\s+/);
  const tags  = [];
  while (words.length && /^#[a-zA-Z]\w*$/.test(words[words.length - 1])) {
    tags.unshift(words.pop().slice(1).toLowerCase());
  }
  return { cleaned: words.join(' '), tags };
}

// Get all unique tags from STATE.items and STATE.stickies for autocomplete
function getAllKnownTags() {
  const tagSet = new Set();
  // From tasks/events/entries
  STATE.items.forEach(item => {
    const tags = Array.isArray(item.tags)
      ? item.tags
      : (item.tags||'').split(/[,|]/).map(t=>t.trim().replace(/^#/,'')).filter(Boolean);
    tags.forEach(t => tagSet.add(t.toLowerCase()));
  });
  // From stickies
  STATE.stickies.forEach(s => { (s.tags||[]).forEach(t => tagSet.add(t.toLowerCase())); });
  // From resources (folders, contacts, locations)
  [...(STATE.folders||[]), ...(STATE.contacts||[]), ...(STATE.locations||[])].forEach(r => {
    (r.tags||[]).forEach(t => tagSet.add(t.toLowerCase()));
  });
  return [...tagSet].sort();
}

// Left accent border style based on priority
function _buildAccentBorder(priority) {
  const isDark  = isDarkTheme();
  const accents = {
    Critical: isDark ? '#F87171' : '#DC2626',
    High:     isDark ? '#FB923C' : '#EA580C',
    Medium:   isDark ? '#0891B2' : '#0E7490',
  };
  const color = accents[priority];
  return color ? `border-left:3px solid ${color};` : '';
}

function toggleSubtask(itemId, idx) {
  const item = STATE.items.find(i => i.id === itemId);
  if (!item || !item.subtasks) return;
  const nowDone = !item.subtasks[idx].done;
  item.subtasks[idx].done = nowDone;
  // Set or clear doneAt timestamp
  if (nowDone) {
    const now = new Date();
    const ts  = fmtDate(now) + ' ' + String(now.getHours()).padStart(2,'0')
              + ':' + String(now.getMinutes()).padStart(2,'0');
    item.subtasks[idx].doneAt = ts;
  } else {
    delete item.subtasks[idx].doneAt;
  }
  saveTEE(item).catch(() => toast('Save failed','error'));
  // Update detail modal in-place if open
  const chk = document.getElementById(`st-chk-${itemId}-${idx}`);
  const txt = document.getElementById(`st-txt-${itemId}-${idx}`);
  const tst = document.getElementById(`st-ts-${itemId}-${idx}`);
  const hdr = document.getElementById(`st-hdr-${itemId}`);
  if (chk) chk.className = `subtask-check${nowDone?' checked':''}`;
  if (txt) txt.className = `subtask-text${nowDone?' done':''}`;
  if (tst) tst.textContent = nowDone ? _fmtSubtaskTs(item.subtasks[idx].doneAt) : '';
  if (hdr) hdr.textContent = _subtaskSummary(item.subtasks);
  renderAll();
}

// Format subtask timestamp for inline display — "Jun 2 · 2:45 PM"
function _fmtSubtaskTs(ts) {
  if (!ts) return '';
  try {
    const [datePart, timePart] = ts.split(' ');
    const [y, m, d] = datePart.split('-');
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const dateStr = months[parseInt(m,10)-1] + ' ' + parseInt(d,10);
    if (!timePart) return dateStr;
    const [hh, mm] = timePart.split(':').map(Number);
    const ampm = hh >= 12 ? 'PM' : 'AM';
    const h    = hh % 12 || 12;
    return dateStr + ' · ' + h + ':' + String(mm).padStart(2,'0') + ' ' + ampm;
  } catch { return ts; }
}

function addSubtaskInline(itemId, inputEl) {
  const text = inputEl.value.trim();
  if (!text) return;
  const item = STATE.items.find(i => i.id === itemId);
  if (!item) return;
  if (!item.subtasks) item.subtasks = [];
  item.subtasks.push({ text, done: false });
  saveTEE(item).catch(() => toast('Save failed','error'));
  inputEl.value = '';
  // Re-render subtask list in detail modal

function deleteSubtask(itemId, idx) {
  const item = STATE.items.find(i => i.id === itemId);
  if (!item || !item.subtasks) return;
  item.subtasks.splice(idx, 1);
  saveTEE(item).catch(() => toast('Save failed','error'));
  const listEl = document.getElementById(`st-list-${itemId}`);
  const hdrEl  = document.getElementById(`st-hdr-${itemId}`);
  if (listEl) listEl.innerHTML = _buildSubtaskRows(item, true);
  if (hdrEl)  hdrEl.textContent = _subtaskSummary(item.subtasks);

}

// P4-R013c: added the optional third `readOnly` parameter (discovery basis
// P4-D024) — defaults to false, so every pre-existing 2-arg call site
// (active TEE Detail, Kanban's openSubtaskPanel, toggleSubtask/deleteSubtask
// in-place re-renders) is byte-identical to before. When readOnly is true
// (archived TEE Detail only): the row gets an `is-readonly` class (for the
// paired CSS below, so the row no longer hints at being clickable), the
// checkbox's `onclick` is omitted entirely (never calls toggleSubtask), and
// the delete button is omitted regardless of `withDelete` (never calls
// deleteSubtask) — checked/done visuals, text, and the doneAt timestamp all
// render identically to the active/interactive path.
function _buildSubtaskRows(item, withDelete, readOnly = false) {
  return (item.subtasks||[]).map((s, idx) => {
    const tsHTML = s.doneAt
      ? '<span id="st-ts-' + item.id + '-' + idx + '" class="subtask-ts">' + _fmtSubtaskTs(s.doneAt) + '</span>'
      : '<span id="st-ts-' + item.id + '-' + idx + '" class="subtask-ts"></span>';
    const delBtn = (withDelete && !readOnly)
      ? '<button class="subtask-del" onclick="deleteSubtask(\'' + item.id + '\',' + idx + ')" title="Remove">✕</button>'
      : '';
    const chkOnclick = readOnly ? '' : ' onclick="toggleSubtask(\'' + item.id + '\',' + idx + ')"';
    return '<div class="subtask-row' + (readOnly ? ' is-readonly' : '') + '" id="st-row-' + item.id + '-' + idx + '">'
      + '<div id="st-chk-' + item.id + '-' + idx + '" class="subtask-check' + (s.done ? ' checked' : '') + '"'
      + chkOnclick + '></div>'
      + '<span id="st-txt-' + item.id + '-' + idx + '" class="subtask-text' + (s.done ? ' done' : '') + '">' + (s.text||'') + '</span>'
      + tsHTML
      + delBtn
      + '</div>';
  }).join('');
}

function saveTagColor(tagName, hexColor) {
  TAG_CUSTOM[tagName.trim().toLowerCase()] = hexColor;
  try { localStorage.setItem('jhov_tag_colors', JSON.stringify(TAG_CUSTOM)); } catch(e) {}
}
function tagColor(tagName) {
  if (!tagName) return { bg:'rgba(40,92,112,0.2)', text:'#4F9AB5', border:'rgba(79,154,181,0.35)' };
  const key = tagName.trim().toLowerCase();
  // Catalog color takes precedence when present and valid (P4-R028) — `active` is not considered here
  const catalogEntry = _getTagCatalogEntry(tagName);
  const catalogColor = catalogEntry ? _normalizeTagCatalogColor(catalogEntry.color) : null;
  if (catalogColor) {
    const isDark = isDarkTheme();
    const alpha = isDark ? '22' : '18';
    return { bg: catalogColor + alpha, text: catalogColor, border: catalogColor + '55' };
  }
  // User-defined color takes priority
  if (TAG_CUSTOM[key]) {
    const c = TAG_CUSTOM[key];
    const isDark = isDarkTheme();
    const alpha = isDark ? '22' : '18';
    return { bg: c + alpha, text: c, border: c + '55' };
  }
  const isDark = isDarkTheme();
  const palette = isDark ? TAG_PALETTE_DARK : TAG_PALETTE_LIGHT;
  let h = 0;
  for (let i = 0; i < tagName.length; i++) h = (h * 31 + tagName.charCodeAt(i)) & 0x7fffffff;
  const c = palette[h % palette.length];
  const alpha = isDark ? '22' : '18';
  return { bg: c + alpha, text: c, border: c + '55' };
}

// ── STATUS SYSTEM HELPERS ─────────────────────────────────────────────────────
// parseStatus: pure string parser — splits on | to get state and optional timestamp
// Used on ALL read and write paths for all item types
function parseStatus(raw) {
  if (!raw || !raw.trim()) return { state: null, doneAt: null };
  const parts = raw.split('|');
  return {
    state:  parts[0].trim() || null,
    doneAt: parts[1] ? parts[1].trim() : null
  };
}

// getDisplayStatus: returns display state with type-appropriate fallback for null
// Task null → 'Backlog'  |  Event/Entry null → 'Open'
function getDisplayStatus(item) {
  const { state } = parseStatus(item.status);
  // Tasks — use state directly with Backlog fallback
  if (item.type === 'task') return state || 'Backlog';
  // Events/Entries — check date for display-layer resolution
  // If explicitly set (Open or Done) — use that
  if (state === 'Done') return 'Done';
  if (state === 'Open') return 'Open';
  // Blank/null + date in the past → display as Done (no timestamp)
  // This is display-only — never written to sheet
  const itemDate = item.date || item.dueDate;
  if (!state && itemDate) {
    const todayD = fmtDate(new Date());
    if (itemDate < todayD) return 'Done';
  }
  return 'Open'; // default for Events/Entries
}

// isEffectivelyDone: true if item belongs in the Done section
// Task: Completed  |  Event/Entry: Done
// Starting/InProgress tasks and unmarked Events/Entries always return false
function isEffectivelyDone(item) {
  if (item.type === 'task') return parseStatus(item.status).state === 'Completed';
  // Events/Entries: use getDisplayStatus for display-layer resolution
  return getDisplayStatus(item) === 'Done';
}

// isCompletedToday: used specifically for Today tab Done section
// For Tasks: must be Completed AND doneAt must be today's date
// For Events/Entries: Done state is sufficient (they're already date-scoped to today)
function isCompletedToday(item, todayDateStr) {
  const { state, doneAt } = parseStatus(item.status);
  if (item.type === 'task') {
    if (state !== 'Completed') return false;
    // Must have been completed today — not a previously-completed task
    if (!doneAt) return false;
    return doneAt.split(' ')[0] === todayDateStr;
  }
  // Events/Entries: Done is enough — they're scoped to today by date filter
  return state === 'Done';
}

function changeItemStatus(taskId, newStatus) {
  document.getElementById('status-dropdown')?.remove();
  const task = STATE.items.find(i => i.id === taskId);
  if (!task) return;
  const currentState = getDisplayStatus(task);
  if (currentState === newStatus) return;

  // Build new status value with timestamp for completion states
  const now = new Date();
  const ts  = now.getFullYear() + '-' +
    String(now.getMonth()+1).padStart(2,'0') + '-' +
    String(now.getDate()).padStart(2,'0') + ' ' +
    String(now.getHours()).padStart(2,'0') + ':' +
    String(now.getMinutes()).padStart(2,'0');

  if (task.type === 'task') {
    // Tasks: add timestamp only for Completed
    task.status = newStatus === 'Completed' ? `Completed|${ts}` : newStatus;
  } else {
    // Events/Entries: add timestamp for Done, plain text for Open
    task.status = newStatus === 'Done' ? `Done|${ts}` : newStatus;
  }

  saveTEE(task).catch(() => toast('Save failed', 'error'));

  // Update any open status button in place
  const _newDot = getStatusColor(newStatus);
  document.querySelectorAll(`#detail-status-btn-${taskId}, [onclick*="openStatusDropdown('${taskId}'"]`).forEach(btn => {
    btn.textContent    = newStatus;
    btn.style.background  = `${_newDot}22`;
    btn.style.color       = _newDot;
    btn.style.borderColor = `${_newDot}44`;
  });

  renderAll();
  // P4-R016c: refresh Person Detail in place if it's currently open — see
  // _pdmRefreshIfOpen above. Status chips in Person Detail remain
  // display-only in this checkpoint; this hook is wired now so P4-R016d
  // (Status chip parity) needs no further changes here.
  _pdmRefreshIfOpen();
  toast(`Status → ${newStatus}`, 'success');
}

    return `<span class="chip-option${sel?' selected':''}" data-val="${name}"
      onclick="this.classList.toggle('selected')" style="touch-action:manipulation">

    ? `<input class="form-input" placeholder="Search team members…" style="margin-bottom:6px;height:32px;font-size:12px"

// ── PEOPLE PICKER (P4-R009b) ─────────────────────────────────
// Suggested/Selected people-picker foundation for TEE Assign (Task
// Contributors, Event/Entry Participants). Built alongside buildChipSelect/
// getChipSelections (left untouched — no other caller depends on them,
// confirmed by P4-D019 §K) rather than replacing them.
//
// Critical DOM contract (P4-D019 §I/§L, unchanged by this checkpoint):
// every STATE.people name must always have exactly one .chip-option
// [data-val] element somewhere inside #tee-contributors, and .selected is
// the sole source of truth — never a JS array. getChipSelections() reads
// it directly, and P4-R009a's quickAddPersonFromModal()/_saveQuickPerson()/
// _restoreTEEModal() (all unchanged) toggle .selected on existing chips the
// same way they always did. Hidden/collapsed Suggested chips are hidden via
// CSS classes only (.search-hidden, and the nth-child cap disabled by
// .expanded/.searching) — never removed from the DOM.
// P4-R009c: optional 4th param (leadInfo: { showLeadStar, isLead }) adds a
// Task-only ★/☆ Make Lead indicator (owner decisions 5/6/7). Stars only
// ever render on SELECTED chips — Suggested/unselected people are not yet
// "involved" in the Task, so a star has no meaning for them there (owner
// decision 13). showLeadStar is only ever true for Task's picker
// (buildPeoplePicker's leadMode); Event/Entry never pass leadInfo at all,
// so they never render a star (owner decision 12).
//
// P4-R009c-fix1: both ☆ and ★ now stop propagation and call their own
// dedicated handler (_peoplePickerMakeLead / _peoplePickerClearLead) — in
// P4-R009c, ★ had no handler and fell through to the chip's own click-to-
// remove behavior, which incorrectly removed the person entirely instead
// of just clearing Lead status (owner-reported bug, item E). The × remove
// button also now has its own dedicated handler (_peoplePickerRemoveChip)
// instead of relying on bubbling, since a selected chip's body click is no
// longer a remove action at all (see _peoplePickerToggleChip below) —
// removal is exclusive to × now, for both Task and Event/Entry alike.
function _peopleChipHTML(name, selected, searchHidden, leadInfo) {
  const li = leadInfo || {};
  const showStar = !!li.showLeadStar && selected;
  const isLead   = !!li.isLead;
  const person = STATE.people.find(p => p.name === name);
  const color  = person?.color || avColor(name);
  const star = !showStar ? '' : isLead
    ? `<span class="people-chip-lead-star is-lead" title="Clear Lead" aria-label="Clear ${name} as Lead" onclick="event.stopPropagation();_peoplePickerClearLead(this)">★</span>`
    : `<span class="people-chip-lead-star" title="Make ${name} Lead" aria-label="Make ${name} Lead" onclick="event.stopPropagation();_peoplePickerMakeLead(this)">☆</span>`;
  return `<span class="chip-option people-chip${selected ? ' selected' : ''}${searchHidden ? ' search-hidden' : ''}${isLead ? ' is-lead' : ''}" data-val="${name}"
    onclick="_peoplePickerToggleChip(this)" style="touch-action:manipulation">
    ${star}
    <span class="chip-av" style="background:${color}">${initials(name)}</span>
    <span class="people-chip-label">${name}</span>
    ${selected ? `<span class="people-chip-remove" title="Remove ${name}" aria-label="Remove ${name}" onclick="event.stopPropagation();_peoplePickerRemoveChip(this)">&times;</span>` : ''}
  </span>`;
}

// P4-R009c-fix1: chip-body click now only ADDS a not-yet-selected

// label is now a no-op (owner decision, item E: removal must be exclusive
// to the × button, so clicking a selected pill can't accidentally remove

// chip's own click-to-remove handler; now that a selected chip's body
// click is a no-op (see _peoplePickerToggleChip above), × must do the

// Rebuilds the Suggested/Selected sub-rows from the live .selected state of
// every .chip-option currently under #id — a throwaway read each time, never
// a persisted array. Safe to call as often as needed (idempotent).
//
// P4-R009b-fix1: this function disconnects the shared observer (see
// _peoplePickerEnsureObserver below) before making its own DOM/class changes,
// and reconnects once it's done. Root cause of the original search-typing
// hang: per the DOMTokenList spec, classList.remove(token) unconditionally
// runs its "update steps" (i.e. re-serializes and re-sets the class
// attribute) even when the token was already absent — unlike
// toggle(token, force), which short-circuits when the requested state
// already holds. Regroup used to call suggestedEl.classList.remove('expanded')
// on every keystroke whenever query was truthy, regardless of whether
// 'expanded' was present, which fired a genuine 'class' mutation every time
// and fed an infinite loop back through the observer. fix1's disconnect/
// reconnect wrapper (kept here unchanged in fix2, per hard restriction) makes
// this function's own mutations invisible to the observer regardless of
// which line would otherwise cause them. fix2 also removes the
// remove('expanded') call entirely (search no longer force-collapses Browse
// All — see below), so the original trigger line is gone too, not just
// guarded.
//
// P4-R009b-fix2: Browse All's visibility is now decided by measuring actual
// overflow (scrollHeight vs. clientHeight) against the CSS height cap on
// .people-picker-suggested, via requestAnimationFrame after the DOM update —
// this replaces the old position-based (nth-child) cap and its count
// heuristic, so it stays correct at any width/column layout without
// per-breakpoint rules. Search no longer hides Browse All or force-collapses
// .expanded — per the owner's fix2 comment 5, results stay height-capped
// (not a growing wall) with Browse All still available to reveal more
// matches while searching.
//
// P4-R009b-fix4: Browse All's visibility toggle switched from
// style.display to style.visibility (see below) — Browse All now lives
// inside the Suggested label column as an always-reserved second line
// (buildPeoplePicker), and display:none would have collapsed that
// reservation, changing the Suggested row's height and jumping the Selected
// row underneath it every time Browse All appeared/disappeared. visibility
// keeps the same disconnect/reconnect-safe, inline-style-only, non-class
// mutation this function already relied on — no change to the fix1 hang fix.
function _peoplePickerRegroup(id) {
  const root = document.getElementById(id);
  if (!root) return;
  const suggestedEl = root.querySelector('.people-picker-suggested');
  const selectedEl  = root.querySelector('.people-picker-selected');
  if (!suggestedEl || !selectedEl) return;

  if (_peoplePickerObserver) _peoplePickerObserver.disconnect();

  const all = Array.from(root.querySelectorAll('.chip-option[data-val]')).map(el => ({
    name: el.dataset.val,
    selected: el.classList.contains('selected'),
  }));

  const searchInput = root.querySelector('.people-picker-search');
  const query = (searchInput?.value || '').trim().toLowerCase();

  const unselected     = all.filter(p => !p.selected).map(p => p.name);
  const matchCount     = query ? unselected.filter(n => n.toLowerCase().includes(query)).length : unselected.length;

  // P4-R009c: Task-only lead mode, marked on the container at build time
  // (buildPeoplePicker). Re-read #tee-lead live on every regroup, same as
  // everything else in this function reads live DOM state rather than a
  // persisted value — this is what keeps ★/☆ correct after Make Lead,
  // after clearing/removing the Lead, after quick-add restore, and after
  // type switching, with no extra wiring needed at any of those call sites.
  const leadMode = root.dataset.leadMode === '1';
  const currentLead = leadMode ? (document.getElementById('tee-lead')?.value || '') : '';

  // P4-R009c-fix1 item G: Lead must render first in Assignees, with
  // everyone else keeping their existing relative order. all[] preserves
  // live DOM order (whatever order chips currently sit in), so pull the
  // Lead to the front of that same order rather than re-sorting anything
  // else — this also directly determines saveTEEModal's saved order, since
  // getChipSelections reads chips in this same DOM order.
  const selectedNamesRaw = all.filter(p => p.selected).map(p => p.name);
  const selectedNames = (leadMode && currentLead)
    ? [currentLead, ...selectedNamesRaw.filter(n => n !== currentLead)]
    : selectedNamesRaw;

  // Every unselected person is always rendered — non-matches during an
  // active search are hidden via .search-hidden, never omitted.
  suggestedEl.innerHTML = unselected.map(n =>
    _peopleChipHTML(n, false, !!query && !n.toLowerCase().includes(query))
  ).join('') || `<span class="people-picker-empty">No one else to add</span>`;
  if (unselected.length && query && matchCount === 0) {
    suggestedEl.innerHTML += `<span class="people-picker-empty">No matches</span>`;
  }

  // P4-R009c-fix1 item D: exact empty-state wording is "No one assigned"
  // for both Task Assignees and Event/Entry Participants (was "No one
  // selected yet").
  selectedEl.innerHTML = selectedNames.length
    ? selectedNames.map(n => _peopleChipHTML(n, true, false, { showLeadStar: leadMode, isLead: leadMode && n === currentLead })).join('')
    : `<span class="people-picker-empty">No one assigned</span>`;

  suggestedEl.classList.toggle('searching', !!query);

  const browseBtn = root.querySelector('.people-picker-browse-all');
  if (browseBtn) {
    const expanded = suggestedEl.classList.contains('expanded');
    browseBtn.textContent = expanded ? 'Show Less' : 'Browse All';
    // fix4 owner comment 3: toggle visibility, not display — display:none
    // would collapse Browse All's reserved line in the label column,
    // shrinking/growing the Suggested row and jumping Selected underneath
    // it every time Browse All appeared or disappeared. visibility keeps
    // the line's layout space constant either way, so Selected never moves.
    if (expanded) {
      browseBtn.style.visibility = unselected.length ? 'visible' : 'hidden';
    } else {
      // Measure real overflow against the height cap (not a count guess) —
      // rAF lets the browser lay out the innerHTML rebuild above first.
      // Pure read/inline-style/textContent work, no class mutation, so this
      // cannot re-trigger the observer even while it's already reconnected.
      requestAnimationFrame(() => {
        if (!suggestedEl.isConnected) return;
        const overflowing = suggestedEl.scrollHeight > suggestedEl.clientHeight + 1;
        browseBtn.style.visibility = overflowing ? 'visible' : 'hidden';
      });
    }
  }

  if (_peoplePickerObserver) {
    _peoplePickerObserver.observe(document.body, { attributes: true, attributeFilter: ['class'], subtree: true });
  }
}

function _peoplePickerToggleBrowseAll(id, btn) {
  const root = document.getElementById(id);
  if (!root) return;
  const suggestedEl = root.querySelector('.people-picker-suggested');
  if (!suggestedEl) return;
  const expanded = suggestedEl.classList.toggle('expanded');
  btn.textContent = expanded ? 'Show Less' : 'Browse All';
}

// Lazily installs one page-lifetime observer (not per-render) that watches
// for external .selected class changes on people-picker chips — specifically
// P4-R009a's quick-add Save/Cancel restore loops, which toggle
// #tee-contributors .chip-option.selected directly and are not modified by
// this checkpoint. Regroups whichever picker changed so Suggested/Selected
// stay visually in sync with the DOM-class source of truth, including right
// after quick-add restores a carried selection.
//
// P4-R009b-fix1: the observer instance is now kept in a module-level
// variable (_peoplePickerObserver) instead of a function-local const, so
// _peoplePickerRegroup can disconnect/reconnect it around its own mutations
// (see that function's comment). Still installed exactly once, lazily, for
// the page's lifetime — type switching still creates no stale/duplicate
// observers, since document.body + subtree:true dynamically covers whatever
// #tee-contributors element currently exists.
let _peoplePickerObserverInstalled = false;
let _peoplePickerObserver = null;
function _peoplePickerEnsureObserver() {
  if (_peoplePickerObserverInstalled) return;
  _peoplePickerObserverInstalled = true;
  _peoplePickerObserver = new MutationObserver(muts => {
    const ids = new Set();
    muts.forEach(m => {
      const target = m.target;
      const picker = target && target.nodeType === 1 && target.closest ? target.closest('.people-picker') : null;
      if (picker && picker.id) ids.add(picker.id);
    });
    ids.forEach(id => _peoplePickerRegroup(id));
  });
  _peoplePickerObserver.observe(document.body, { attributes: true, attributeFilter: ['class'], subtree: true });
}

// Renders the full picker: always-visible search (+ optional "+ Add" real
// button), and a full-width body — Suggested row (height-capped via CSS,
// never via omitting people from the DOM), Browse All, and Selected row.
//
// P4-R009b-fix2: split into two top-level children — .people-picker-search-
// row and .people-picker-body — so that with .people-picker's new
// display:contents (see CSS), the search row can stay beside Lead (Task) or
// atop Participants (Event/Entry) while the body independently spans the
// full Assign card width below it. Both children remain descendants of this
// same #id element regardless of how they're laid out, so getChipSelections
// (unchanged)/quick-add restore (unchanged) still find every .chip-option
// under #tee-contributors exactly as before. `opts.showAdd` renders the
// "+ Add" quick-add trigger (same unchanged quickAddPersonFromModal()) as a
// real button, not a text link, per owner review.
//
// P4-R009c: `opts.leadMode` (Task only) marks the container with
// `data-lead-mode="1"` so _peoplePickerRegroup can find it again on every
// later re-render without needing its own opts parameter — the DOM itself
// carries "is this a Lead-aware picker" the same way it already carries
// .selected as the source of truth. `opts.leadName` supplies the current
// Lead for this one initial render only (before #tee-lead exists in the
// DOM to read live); every subsequent render (search, click, quick-add,
// type switch) goes through _peoplePickerRegroup, which reads #tee-lead
// live instead. `selectedNames` is now expected to include the Lead's name
// too when leadMode is on (owner decision 4/13 — Selected is the single
// source of truth for everyone involved, Lead included), so the Lead's
// chip renders in Selected with a star instead of incorrectly appearing in
// Suggested as if not yet involved.
//
// P4-R009c-fix1: row order rebuilt per owner review (item A/B) — header
// (opts.assigneeLabel: "Assignees" for Task, "Participants" for Event/
// Entry, + the ☆/★ hint when leadMode) → assignee/participant pills →
// a labeled Search row → a Suggested header (+ Browse All) → Suggested
// pills. Pills used to render last, after Suggested; they now render
// first, directly under the header, per the owner's requested order.
// Selected/assignee pills are now rendered in the CALLER's given order
// (lead-first, when leadMode — see _buildTEEAssignFields) instead of being
// re-derived from peopleNames/STATE.people order, so Lead renders first in
// Assignees (owner decision, item G) from the very first paint, not only
// after the first regroup.
function buildPeoplePicker(id, peopleNames, selectedNames, opts) {
  _peoplePickerEnsureObserver();
  const o = opts || {};
  const showAdd = !!o.showAdd;
  const leadMode = !!o.leadMode;
  const leadName = o.leadName || '';
  const assigneeLabel = o.assigneeLabel || 'Assignees';
  const selectedSet = new Set(selectedNames || []);

  const orderedSelected = (selectedNames || []).filter(n => selectedSet.has(n));
  const selectedChipsHTML = orderedSelected
    .map(n => _peopleChipHTML(n, true, false, { showLeadStar: leadMode, isLead: leadMode && n === leadName }))
    .join('');
  const unselectedChipsHTML = peopleNames.filter(n => !selectedSet.has(n)).map(n => _peopleChipHTML(n, false, false)).join('');

  // Browse All starts hidden in the markup below (no reliable overflow
  // measurement is possible before layout) — this deferred call runs once
  // the returned markup is actually in the DOM (the caller inserts it
  // synchronously right after this function returns, well before a
  // setTimeout(0) callback can fire) and corrects its visibility from real
  // measured overflow, same as every later interaction does.
  setTimeout(() => _peoplePickerRegroup(id), 0);

  return `
    <div class="people-picker" id="${id}"${leadMode ? ' data-lead-mode="1"' : ''}>
      <div class="people-picker-header-row">
        <span class="people-picker-section-label">${assigneeLabel}</span>
        ${leadMode ? '<span class="people-picker-lead-hint">☆ Make Lead · ★ Lead</span>' : ''}
      </div>
      <div class="people-picker-selected">${selectedChipsHTML || '<span class="people-picker-empty">No one assigned</span>'}</div>

      <div class="people-picker-search-row">
        <span class="people-picker-search-label">Search:</span>
        <input type="text" class="form-input people-picker-search" placeholder="Search people…" oninput="_peoplePickerRegroup('${id}')">
        ${showAdd ? `<button type="button" class="people-picker-add-btn" onclick="quickAddPersonFromModal()" title="Add a new team member">+ Add</button>` : ''}
      </div>

      <div class="people-picker-header-row">
        <span class="people-picker-section-label">Suggested</span>
        <button type="button" class="people-picker-browse-all" onclick="_peoplePickerToggleBrowseAll('${id}', this)" style="visibility:hidden">Browse All</button>
      </div>
      <div class="people-picker-suggested">${unselectedChipsHTML || '<span class="people-picker-empty">No one else to add</span>'}</div>
    </div>`;
}

function togglePinExpand(noteId, btn) {
  const el = document.getElementById(noteId);
  if (!el) return;
  const expanded = el.style.webkitLineClamp === 'unset' || el.style.webkitLineClamp === '';
  if (expanded) {
    el.style.webkitLineClamp = '3';
    el.style.overflow = 'hidden';
    btn.textContent = '▼ more';
  } else {
    el.style.webkitLineClamp = 'unset';
    el.style.overflow = 'visible';
    btn.textContent = '▲ less';
  }

// ── ASSIGNEE HELPERS ─────────────────────────────────────────
// Parse "Lead|Contrib1|Contrib2" → { lead, contributors[] }
function parseAssignees(str) {
  const parts = (str || '').split('|').map(s => s.trim()).filter(Boolean);
  if (!parts.length) return { lead: '', contributors: [] };
  return { lead: parts[0], contributors: parts.slice(1) };
}
// Build back to "Lead|Contrib1|Contrib2"
function buildAssigneesStr(lead, contributors) {
  const all = [lead, ...(contributors || [])].map(s => (s||'').trim()).filter(Boolean);
  return all.join('|');
}
// Split "Lead|Contrib1|Contrib2" into a clean array of names
function splitAssigneeNames(str) {
  return (str||'').split('|').map(s=>s.trim()).filter(Boolean);
}
// Format assignees for detail-view display: "Lead (lead), Contrib1, Contrib2"
function formatAssigneesDisplay(item) {
  const parts = (item.assignees||'').split('|').map(s=>s.trim()).filter(Boolean);
  if (!parts.length) return '—';
  if (item.type==='task') return parts[0]+(parts.length>1?' (lead), '+parts.slice(1).join(', '):'');
  return parts.join(', ');
}

// Render avatar — photo if available, else colored initials circle
// For Google Drive: we expect thumbnail URL (auto-converted on input)
function renderAvatar(name, sizeClass, extraStyle) {
  const person = STATE.people.find(p => p.name === name);
  const color  = person?.color || avColor(name);
  const photo  = person?.photo || '';
  const sz     = sizeClass || 'av-md';
  const style  = extraStyle || '';
  if (photo) {
    // onerror hides img and shows initials fallback
    return `<img src="${photo}" class="av-img ${sz}" style="background:${color};${style}" onerror="this.style.display='none';this.nextElementSibling&&(this.nextElementSibling.style.display='flex')" alt="${initials(name)}"><div class="av-fallback ${sz}" style="background:${color};display:none;${style}">${initials(name)}</div>`;
  }
  return `<div class="av-fallback ${sz}" style="background:${color};${style}">${initials(name)}</div>`;
}

// Render lead + stacked contributors for cards
// Rules: solo lead → avatar + firstName
//        with contribs → lead (larger) + up to 3 stacked contrib circles + "+N" if more
//        compact (narrow card) → lead avatar + "+N" count only
function renderAssigneeStack(assigneesStr, compact, itemType) {
  const { lead, contributors } = parseAssignees(assigneesStr);
  if (!lead) return '';

  // For events and entries: all names are equal participants — no lead/contrib visual distinction
  // Use same avatar size for all, first name shown
  if (itemType === 'event' || itemType === 'entry') {
    const allNames = [lead, ...contributors];
    const firstName = lead.split(' ')[0];
    const MAX_SHOWN = 4;
    const shown = allNames.slice(0, MAX_SHOWN);
    const overflow = allNames.length - MAX_SHOWN;
    const avatarEls = shown.map((name, idx) => {
      const person = STATE.people.find(x => x.name === name);
      const color  = person?.color || avColor(name);
      const photo  = person?.photo || '';
      const cls    = idx === 0 ? 'av' : 'av av-contrib';
      return photo
        ? `<img src="${photo}" class="${cls}" style="background:${color}" onerror="this.outerHTML='<div class=\\'${cls}\\' style=\\'background:${color}\\'>${initials(name)}</div>'" alt="${initials(name)}" title="${name}">`
        : `<div class="${cls}" style="background:${color}" title="${name}">${initials(name)}</div>`;
    }).join('');
    const overflowEl = overflow > 0 ? `<div class="av av-contrib av-more">+${overflow}</div>` : '';
    return `<div class="av-stack">${avatarEls}${overflowEl}</div><span class="t-name">${firstName}${allNames.length > 1 ? ` +${allNames.length - 1}` : ''}</span>`;
  }

  // Tasks: lead is larger, contributors are stacked smaller
  const leadFirst  = lead.split(' ')[0];
  const leadPerson = STATE.people.find(p => p.name === lead);
  const leadColor  = leadPerson?.color || avColor(lead);
  const leadPhoto  = leadPerson?.photo || '';

  const leadAvEl = leadPhoto
    ? `<img src="${leadPhoto}" class="av av-lead" style="background:${leadColor}" onerror="this.outerHTML='<div class=\\'av av-lead\\' style=\\'background:${leadColor}\\'>${initials(lead)}</div>'" alt="${initials(lead)}">`
    : `<div class="av av-lead" style="background:${leadColor}">${initials(lead)}</div>`;

  if (!contributors.length) {
    return `<div class="av-stack">${leadAvEl}</div><span class="t-name">${leadFirst}</span>`;
  }

  if (compact) {
    return `<div class="av-stack">${leadAvEl}<span class="t-name" style="margin-left:6px">${leadFirst}</span><span class="av-count">+${contributors.length}</span></div>`;
  }

  const MAX_SHOWN = 3;
  const shown     = contributors.slice(0, MAX_SHOWN);
  const overflow  = contributors.length - MAX_SHOWN;
  const contribEls = shown.map(name => {
    const p     = STATE.people.find(x => x.name === name);
    const color = p?.color || avColor(name);
    const photo = p?.photo || '';
    return photo
      ? `<img src="${photo}" class="av av-contrib" style="background:${color}" onerror="this.outerHTML='<div class=\\'av av-contrib\\' style=\\'background:${color}\\'>${initials(name)}</div>'" alt="${initials(name)}" title="${name}">`
      : `<div class="av av-contrib" style="background:${color}" title="${name}">${initials(name)}</div>`;
  }).join('');
  const overflowEl = overflow > 0 ? `<div class="av av-contrib av-more" title="${overflow} more">+${overflow}</div>` : '';

  return `<div class="av-stack">${leadAvEl}${contribEls}${overflowEl}</div><span class="t-name">${leadFirst}${contributors.length > 0 ? ` +${contributors.length}` : ''}</span>`;
}
// ── Top-level helper: is person active today? ───────────────
// P4-R018c (discovery basis P4-D033/P4-D034, owner correction after
// product validation): now defined in terms of the shared
// _personActiveTodayItems (Person Detail's own TODAY+ACTIVE basis, via
// the existing unmodified _pdmApplyFilters), instead of a separately
// hand-duplicated predicate — a person only counts as "active today" if
// they have a non-done, non-overdue item due/starting today or currently
// In Progress/Review. Overdue backlog alone no longer makes a person
// count as active today, per explicit owner direction. Does NOT carry
// forward P4-R018b's rejected "Today absorbs overdue" semantics — this
// is the opposite: overdue is now excluded from "active," not included.
function isPersonActiveToday(p) {
  return _personActiveTodayItems(p.name).length > 0;
}

// P4-R018c: now defined in terms of the shared _personActiveWeekItems
// (Person Detail's own THIS WEEK+ACTIVE basis) instead of a separately
// hand-duplicated predicate. This Week intentionally still includes Today
// (THIS WEEK's own primary scope is date-inclusive of today and treats
// In Progress/Review as relevant regardless of date, unchanged) — only
// overdue and done items are excluded, via the unchanged ACTIVE subfilter.
function isPersonActiveThisWeek(p) {
  return _personActiveWeekItems(p.name).length > 0;
}

// ── Today item count helper (used for sorting) ───────────────────
// P4-R018c: now the same TODAY+ACTIVE basis as isPersonActiveToday/the
// People card's own Today chip, so the People page's card-sort order
// never disagrees with what "active today" now means.
function personTodayCount(p) {
  return _personActiveTodayItems(p.name).length;
}

// ── Top-level person card builder ───────────────────────────
function renderPeople() {
  const el = document.getElementById('page-people');
  if (!el) return;

  const f   = STATE.peopleFilter;
  const all = STATE.people || [];
  // P4-R018d (People search role-type guard fix): searchable values are
  // coerced to strings before any string method is called on them, so a
  // non-string field (e.g. a numeric Role value like `role: 7`, or a null/
  // undefined field) can no longer crash the search — previously
  // `(p.role||'').toLowerCase()` still passed a bare number through
  // untouched when that number was truthy (`7||''` === `7`, and numbers
  // have no `.toLowerCase`). Display-only normalization for the search
  // comparison — STATE.people/the saved Role value itself is never
  // modified or written back.
  const _safeSearchText = value => String(value || '').toLowerCase();
  const q   = _safeSearchText(f.search);

  // ── Counts ───────────────────────────────────────────────────
  const cAll  = all.length;
  const cToday = all.filter(p => isPersonActiveToday(p)).length;
  const cWeek  = all.filter(p => isPersonActiveThisWeek(p)).length;
  const cIdle  = all.filter(p => !isPersonActiveThisWeek(p)).length;

  // ── Filter by context ────────────────────────────────────────
  let filtered = all;
  if (f.context === 'today') filtered = all.filter(p => isPersonActiveToday(p));
  if (f.context === 'week')  filtered = all.filter(p => isPersonActiveThisWeek(p));
  if (f.context === 'idle')  filtered = all.filter(p => !isPersonActiveThisWeek(p));
  if (q) filtered = filtered.filter(p =>
    _safeSearchText(p.name).includes(q) || _safeSearchText(p.role).includes(q)
  );

  // ── Sort: Active Today (by count desc) → Active This Week (A-Z) → Idle (A-Z)
  const _byName = (a, b) => (a.name||'').localeCompare(b.name||'');
  filtered = [
    ...filtered.filter(p =>  isPersonActiveToday(p))
               .sort((a, b) => personTodayCount(b) - personTodayCount(a)),
    ...filtered.filter(p => !isPersonActiveToday(p) &&  isPersonActiveThisWeek(p))
               .sort(_byName),
    ...filtered.filter(p => !isPersonActiveThisWeek(p))
               .sort(_byName),
  ];

  // ── Subtitle ─────────────────────────────────────────────────
  const subtitle = f.context === 'today' ? 'Active Today'
    : f.context === 'week' ? 'Active This Week'
    : f.context === 'idle' ? 'Idle This Week'
    : 'All Members';

  // ── Empty state (no people at all) ───────────────────────────
  if (cAll === 0) {
    el.innerHTML = ''
      + '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:20px;flex-shrink:0;flex-wrap:wrap">'
      + '<span style="font-size:26px;font-weight:800;letter-spacing:-0.03em;line-height:1.1;color:var(--text);font-family:var(--font-disp)">People</span>'
      + '<span style="font-size:26px;font-weight:400;color:var(--muted);font-family:var(--font-disp)"> &middot; All Members</span>'
      + '<button class="btn-primary" style="margin-left:auto" onclick="openPersonModal(null)"><i class="ti ti-plus" style="font-size:13px;margin-right:4px"></i>Add Person</button>'
      + '</div>'
      + '<div style="text-align:center;padding:80px 20px;color:var(--muted)">'
      + '<i class="ti ti-users" style="font-size:48px;display:block;margin-bottom:16px;opacity:0.4"></i>'
      + '<div style="font-size:15px;font-weight:600;color:var(--text2);margin-bottom:6px">No team members yet</div>'
      + '<div style="font-size:13px;margin-bottom:20px">Add people to track workload, tasks and activity</div>'
      + '<button class="btn-primary" onclick="openPersonModal(null)"><i class="ti ti-plus" style="font-size:13px;margin-right:4px"></i>Add Person</button>'
      + '</div>';
    return;
  }

  // ── Pill strip ────────────────────────────────────────────────
  const _wasSearchFocused = _captureSearchFocus('pp-search-input');
  const pillsHTML = ''
    + '<button class="kb-pill' + (f.context==='all'?' active':'') + '" onclick="_ppSetContext(' + "'all'" + ')">'
    + '<span class="kb-pill-num">' + cAll + '</span> ALL</button>'
    + (cToday > 0
      ? '<button class="kb-pill today' + (f.context==='today'?' active':'') + '" onclick="_ppSetContext(' + "'today'" + ')">'
        + '<span class="kb-pill-num">' + cToday + '</span> ACTIVE TODAY</button>'
      : '')
    + (cWeek > 0
      ? '<button class="kb-pill week' + (f.context==='week'?' active':'') + '" onclick="_ppSetContext(' + "'week'" + ')">'
        + '<span class="kb-pill-num">' + cWeek + '</span> ACTIVE THIS WEEK</button>'
      : '')
    + (cIdle > 0
      ? '<button class="kb-pill' + (f.context==='idle'?' active':'') + '" onclick="_ppSetContext(' + "'idle'" + ')">'
        + '<span class="kb-pill-num">' + cIdle + '</span> IDLE</button>'
      : '')
    + '<div class="kb-search-wrap">'
    + '<i class="ti ti-search" style="font-size:12px;color:var(--muted)"></i>'
    + '<input id="pp-search-input" placeholder="Search people\u2026" value="' + (f.search||'').replace(/"/g,'&quot;') + '"'
    + ' oninput="STATE.peopleFilter.search=this.value;renderPeople()"'
    + ' style="border:none;background:transparent;color:var(--text);font-family:var(--font);font-size:13px;outline:none;width:100%">'
    + '</div>';

  // ── Cards ─────────────────────────────────────────────────────
  const timeframe = f.context === 'week' ? 'week' : 'today';
  const addCardHTML = '<div class="add-person-btn" onclick="openPersonModal(null)">'
    + '<span class="plus"><i class="ti ti-plus" style="font-size:28px"></i></span>'
    + '<span>Add Person</span>'
    + '</div>';

  const gridHTML = filtered.length > 0
    ? filtered.map(p => buildPersonCard(p, true, timeframe)).join('') + addCardHTML
    : '<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)">'
      + '<i class="ti ti-search-off" style="font-size:40px;display:block;margin-bottom:12px;opacity:0.5"></i>'
      + '<div style="font-size:14px;color:var(--text2)">No people match that filter</div>'
      + '</div>' + addCardHTML;

  // ── Render ────────────────────────────────────────────────────
  el.innerHTML = ''
    + '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:16px;flex-shrink:0;flex-wrap:wrap">'
    + '<span style="font-size:26px;font-weight:800;letter-spacing:-0.03em;line-height:1.1;color:var(--text);font-family:var(--font-disp)">People</span>'
    + '<span style="font-size:26px;font-weight:400;color:var(--muted);font-family:var(--font-disp)"> &middot; ' + subtitle + '</span>'
    + '<button class="btn-primary" style="margin-left:auto" onclick="openPersonModal(null)"><i class="ti ti-plus" style="font-size:13px;margin-right:4px"></i>Add Person</button>'
    + '</div>'
    + '<div class="kb-pill-strip" style="margin-bottom:16px">' + pillsHTML + '</div>'
    + '<div class="person-grid">' + gridHTML + '</div>';

  _restoreSearchFocus('pp-search-input', _wasSearchFocused);
}

// ── People card overflow action menu (P4-R018e, discovery basis P4-D030
// SS8-10) — replaces the two always-visible Edit/Remove dir-action-btn icons
// with a single top-right "⋯" trigger. Mirrors openPriorityDropdown's proven
// four-part shape (stopPropagation, toggle-existing check, anchor-relative
// viewport-clamped positioning, outside-click dismissal) almost verbatim, per
// the discovery's explicit "smallest safe approach" recommendation (SS8) —
// the one deliberate addition is comparing the existing menu's own personId
// before deciding whether a repeat click should just close it (same card) or
// close-and-reopen for a different card (so switching between two cards'
// menus in sequence always shows the second card's menu, not nothing).
// Named/scoped generically (not "openPersonActionMenu") per the discovery's
// SS12 naming guidance, so a future Resources/Reminders pass can adopt or
// adapt this without this checkpoint having overcommitted to an interface
// neither surface has validated yet. Edit/Remove still call the exact same,
// completely unmodified openPersonModal(id)/removePerson(id) functions the
// old icon buttons called — no change to either function.
function _openCardActionMenu(personId, anchorEl, event) {
  event.stopPropagation();
  const existing = document.getElementById('card-action-menu');
  if (existing) {
    const samePerson = existing.dataset.personId === personId;
    existing.remove();
    if (samePerson) return;
  }
  const menu = document.createElement('div');
  menu.id = 'card-action-menu';
  menu.className = 'card-action-menu';
  menu.dataset.personId = personId;
  menu.innerHTML =
      '<button class="card-action-menu-item" onclick="document.getElementById(\'card-action-menu\')?.remove();openPersonModal(\'' + personId + '\')"><i class="ti ti-pencil" style="font-size:13px"></i>Edit</button>'
    + '<button class="card-action-menu-item danger" onclick="document.getElementById(\'card-action-menu\')?.remove();removePerson(\'' + personId + '\')"><i class="ti ti-trash" style="font-size:13px"></i>Remove</button>';
  document.body.appendChild(menu);
  const rect  = anchorEl.getBoundingClientRect();
  const mRect = menu.getBoundingClientRect();
  let top  = rect.bottom + 6;
  let left = rect.left;
  if (left + mRect.width > window.innerWidth - 8)  left = window.innerWidth - mRect.width - 8;
  if (top  + mRect.height > window.innerHeight - 8) top  = rect.top - mRect.height - 6;
  menu.style.top  = `${top}px`;
  menu.style.left = `${left}px`;
  setTimeout(() => {
    document.addEventListener('click', function _close() {
      document.getElementById('card-action-menu')?.remove();
      document.removeEventListener('click', _close);
    });
  }, 0);
}

// Used by renderPeople (People tab)
function buildPersonCard(p, showActiveBadge, timeframe) {
  const allPi = personItems(p.name);

  // ── Active state ──────────────────────────────────────────────
  const activeToday = isPersonActiveToday(p);
  const activeWeek  = isPersonActiveThisWeek(p);

  // ── Shortcut chip counts (P4-R018c, discovery basis P4-D033/P4-D034,
  // owner correction after product validation of P4-R018b-redo) — reuses
  // the same shared _personActiveTodayItems/_personActiveWeekItems/
  // _personOverdueItems wrappers isPersonActiveToday/isPersonActiveThisWeek
  // now use, so the card's own numbers, the People page's Active Today/
  // Active This Week classification, and Person Detail's own TODAY+ACTIVE/
  // THIS WEEK+ACTIVE/ALL+OVERDUE destinations can never disagree. This
  // Week intentionally does NOT exclude Today items — owner direction:
  // "This Week includes Today... do not subtract Today from This Week."
  const cToday   = _personActiveTodayItems(p.name).length;
  const cWeek    = _personActiveWeekItems(p.name).length;
  const cOverdue = _personOverdueItems(p.name).length;

  // ── Stats HTML ────────────────────────────────────────────────
  // P4-R018c: compact shortcut chips — N Today / N This Week / N Overdue
  // (shorter than P4-R018b-redo's "Active Today"/"Active This Week"
  // labels, per owner direction) — each opening Person Detail LIST
  // pre-filtered to the matching primary/state selection. No per-type
  // icons, since the chip model is not type-based; event.stopPropagation()
  // guards every click defensively, matching this card's existing edit/
  // remove button pattern. Colors reuse the same rgba/var values
  // previously used for the old per-type Task/Event/Entry breakdown chips
  // (accent2 for Today, amber #FBBF24 for This Week, var(--red) for
  // Overdue) — no new theme-readability risk introduced. Overdue routes
  // to ALL+OVERDUE directly (not absorbed into Today) — does not carry
  // forward any rejected P4-R018b/P4-R018b-redo semantics.
  const _shortcutChip = (cls, count, label, primaryFilter, stateFilter) =>
    '<button class="person-shortcut-chip ' + cls + '" onclick="event.stopPropagation();openPersonDetailModal(\'' + p.id + '\',\'' + primaryFilter + '\',\'' + stateFilter + '\',\'list\')">'
    + count + ' ' + label + '</button>';

  const _hasShortcuts = cToday > 0 || cWeek > 0 || cOverdue > 0;

  const statsHTML = '<div class="person-stats">'
    + (cToday   > 0 ? _shortcutChip('today',   cToday,   'Today',      'today', 'active')  : '')
    + (cWeek    > 0 ? _shortcutChip('week',    cWeek,    'This Week',  'week',  'active')  : '')
    + (cOverdue > 0 ? _shortcutChip('overdue', cOverdue, 'Overdue',    'all',   'overdue') : '')
    + (!_hasShortcuts ? '<span class="stat-pill" style="background:var(--glass);color:var(--muted)">Nothing today</span>' : '')
    + '</div>';

  // ── Badge ─────────────────────────────────────────────────────
  let badgeHTML = '';
  if (showActiveBadge) {
    if (activeToday)
      badgeHTML = '<span class="person-active-badge" style="margin-top:3px;display:inline-flex">Active Today</span>';
    else if (activeWeek)
      badgeHTML = '<span class="person-active-week-badge" style="margin-top:3px;display:inline-flex">Active This Week</span>';
    else
      badgeHTML = '<span class="person-idle-badge" style="margin-top:3px;display:inline-flex">Idle</span>';
  }

  // ── Avatar ────────────────────────────────────────────────────
  const avatarHTML = p.photo
    ? '<img src="' + p.photo + '" class="person-avatar" style="background:' + p.color + ';box-shadow:0 4px 14px ' + p.color + '55;object-fit:cover" onerror="this.style.display=\'none\'" alt="' + initials(p.name) + '">'
    : '<div class="person-avatar" style="background:' + p.color + ';box-shadow:0 4px 14px ' + p.color + '55">' + initials(p.name) + '</div>';

  // ── View Activities button (P4-R018a: renamed from "View details", arrow
  // removed, discovery basis P4-D030 SS6; moved above the stats block in the
  // return concatenation below — click behavior unchanged) ──
  const viewBtn = '<button class="person-viewall" onclick="openPersonDetailModal(\'' + p.id + '\')">View Activities</button>';

  return '<div class="person-card' + (activeToday?' person-card-active':'') + '">'
    + '<div class="person-header">'
    + '<div style="position:relative;flex-shrink:0">'
    + avatarHTML
    + (activeToday ? '<div class="person-active-dot" title="Active today"></div>' : '')
    + '</div>'
    + '<div style="flex:1;min-width:0">'
    + '<div class="person-name" style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis">' + p.name + '</div>'
    + '<div class="person-role">' + (p.role||'\u2014') + '</div>'
    + badgeHTML
    + '</div>'
    + '<div class="person-actions">'
    + '<button class="card-action-trigger" onclick="_openCardActionMenu(\'' + p.id + '\', this, event)" title="More actions"><i class="ti ti-dots" style="font-size:15px"></i></button>'
    + '</div>'
    + '</div>'
    + '<div style="margin-bottom:10px">' + viewBtn + '</div>'
    + statsHTML
    + '</div>';
}

function renderOverview() {
  const todayStr = fmtDate(TODAY);

  // ── Data sets ──
  const allTasks    = getTasks();
  const allEvents   = getEvents();
  const allEntries  = getEntries();

  // ── TODAY data ──────────────────────────────────────────────────────────
  // Tasks dated today: include active ones + those completed TODAY only
  // Tasks completed on previous days are excluded (they're done, not today's work)
  const dueTasks    = allTasks.filter(t =>
    t.dueDate === todayStr &&
    (parseStatus(t.status).state !== 'Completed' || isCompletedToday(t, todayStr))
  );
  const startTasks  = allTasks.filter(t =>
    t.startDate === todayStr && t.dueDate !== todayStr &&
    (parseStatus(t.status).state !== 'Completed' || isCompletedToday(t, todayStr))
  );
  const todayEvents = allEvents.filter(e => e.date === todayStr);
  const todayEntries= allEntries.filter(e => e.date === todayStr);

  // ── ALL TASKS data ───────────────────────────────────────────────────────
  const incompleteTasks = allTasks.filter(t => parseStatus(t.status).state !== 'Completed');

  // ── UPCOMING data (rolling 14 days from tomorrow) ─────────────────────────
  const upcomingDays = [];
  for (let i = 1; i <= 14; i++) {
    const d = new Date(TODAY);
    d.setDate(d.getDate() + i);
    upcomingDays.push(fmtDate(d));
  }

  // ── FILTER STATE ─────────────────────────────────────────────────────────
  // Primary group: 'today' | 'alltasks' | 'upcoming'
  // Sub-filters: Set of active sub-filter keys
  if (!window._gtGroup)   window._gtGroup   = 'today';
  if (!window._gtSubs)    window._gtSubs    = new Set();
  if (!window._gtCooldown) window._gtCooldown = false;

  const group = window._gtGroup;
  const subs  = window._gtSubs;

  // ── PILL COUNTS ───────────────────────────────────────────────────────────
  // Today counts — split active vs done
  const todayAllItems   = [...dueTasks, ...startTasks, ...todayEvents, ...todayEntries];
  // todayDone: tasks completed TODAY + events/entries marked Done today
  // Tasks completed on previous days are excluded (wrong date in doneAt)
  const todayDone       = todayAllItems.filter(i => isCompletedToday(i, todayStr));
  const todayActive     = todayAllItems.filter(i => !isCompletedToday(i, todayStr));
  const cTodayAll       = todayAllItems.length;   // primary pill: total
  const cTodayTasks     = todayActive.filter(i => i.type==='task').length;
  const cTodayEvents    = todayActive.filter(i => i.type==='event').length;
  const cTodayEntries   = todayActive.filter(i => i.type==='entry').length;
  const cTodayDone      = todayDone.length;       // Done sub-pill

  // All Tasks counts
  const cAllTasks   = incompleteTasks.length;
  const cHiPri      = incompleteTasks.filter(t => t.priority==='Critical'||t.priority==='High').length;
  const cInProg     = incompleteTasks.filter(t => parseStatus(t.status).state==='In Progress'||parseStatus(t.status).state==='Review').length;
  const cOverdue    = incompleteTasks.filter(t => t.dueDate && daysUntil(t.dueDate)<0).length;

  // Upcoming counts
  const cUpcoming   = upcomingDays.reduce((sum,d) => {
    return sum +
      incompleteTasks.filter(t => t.dueDate===d || t.startDate===d).length +
      allEvents.filter(e => e.date===d).length +
      allEntries.filter(e => e.date===d).length;
  }, 0);
  const cUpTasks    = upcomingDays.reduce((sum,d) => sum + incompleteTasks.filter(t => t.dueDate===d||t.startDate===d).length, 0);
  const cUpEvents   = upcomingDays.reduce((sum,d) => sum + allEvents.filter(e => e.date===d).length, 0);
  const cUpEntries  = upcomingDays.reduce((sum,d) => sum + allEntries.filter(e => e.date===d).length, 0);

  // ── GROUP/SUB CHANGE HANDLERS ────────────────────────────────────────────
  window._setGtGroup = (newGroup, direction) => {
    if (window._gtCooldown) return;
    if (window._gtGroup === newGroup) return;
    window._gtGroup = newGroup;
    window._gtSubs  = new Set(); // clear sub-filters on group change

    // Animate card list
    const col = document.getElementById('gt-main-col');
